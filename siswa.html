    const formatTimer = (totalSeconds) => {
      const sec = Math.max(0, Number(totalSeconds) || 0);
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    };

    // Algoritma Fisher-Yates untuk mengacak urutan butir soal & mengacak opsi jawaban PG
    const shuffleArray = (arr) => {
      const copy = [...(arr || [])];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
      }
      return copy;
    };

          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });
        return `${formatter.format(new Date()).replace(/\./g, ':')} WIB`;
      } catch (_) {
        return new Date().toISOString().replace('T', ' ').slice(0, 19) + ' WIB';

    const resolveImageSrc = (fileVal, previewVal) => {
      const candidate = String(previewVal || fileVal || '').trim();
      if (!candidate) return '';
      if (candidate.startsWith('data:image') || candidate.startsWith('http://') || candidate.startsWith('https://') || candidate.startsWith('blob:')) {
        return candidate;
      }
      const strFile = String(fileVal || '').trim();
      if (strFile.startsWith('data:image') || strFile.startsWith('http://') || strFile.startsWith('https://') || strFile.startsWith('blob:')) {
        return strFile;
      }
      if (strFile) return buildSvgDiagramPlaceholder(strFile);
      return '';
    };

    const GREEK_UNICODE_MAP = {
      'α': '\\alpha ', 'β': '\\beta ', 'γ': '\\gamma ', 'δ': '\\delta ', 'ε': '\\varepsilon ',
      'ζ': '\\zeta ', 'η': '\\eta ', 'θ': '\\theta ', 'ϑ': '\\vartheta ', 'ι': '\\iota ',
      'κ': '\\kappa ', 'λ': '\\lambda ', 'μ': '\\mu ', 'ν': '\\nu ', 'ξ': '\\xi ',
      'π': '\\pi ', 'ρ': '\\rho ', 'σ': '\\sigma ', 'τ': '\\tau ', 'υ': '\\upsilon ',
      'φ': '\\varphi ', 'ϕ': '\\phi ', 'χ': '\\chi ', 'ψ': '\\psi ', 'ω': '\\omega ',
      'Γ': '\\Gamma ', 'Δ': '\\Delta ', '∆': '\\Delta ', 'Θ': '\\Theta ', 'Λ': '\\Lambda ',
      'Ξ': '\\Xi ', 'Π': '\\Pi ', 'Σ': '\\Sigma ', 'Φ': '\\Phi ', 'Ψ': '\\Psi ', 'Ω': '\\Omega '
    };

    const SUPERSCRIPT_CHAR_MAP = {
      '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9',
      '⁺': '+', '⁻': '-', '⁼': '=', '⁽': '(', '⁾': ')', 'ⁿ': 'n', 'ⁱ': 'i'
    };

    const SUBSCRIPT_CHAR_MAP = {
      '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9',
      '₊': '+', '₋': '-', '₌': '=', '₍': '(', '₎': ')', 'ₐ': 'a', 'ₑ': 'e', 'ₒ': 'o', 'ₓ': 'x', 'ᵢ': 'i', 'ⱼ': 'j', 'ₖ': 'k', 'ₙ': 'n', 'ₘ': 'm'
    };

    const normalizeWordMathUnicodeChars = (input) => {
      if (!input) return { text: '', hadWordMathFont: false };
      let hadWordMathFont = false;
      const chars = Array.from(String(input));
      const out = chars.map((ch) => {
        const cp = ch.codePointAt(0);
        if (!cp) return ch;
        if (cp >= 0x1D400 && cp <= 0x1D7FF) {
          hadWordMathFont = true;
          const latinRanges = [
            [0x1D400, 0x1D419, 65], [0x1D41A, 0x1D433, 97],
            [0x1D434, 0x1D44D, 65], [0x1D44E, 0x1D467, 97],
            [0x1D468, 0x1D481, 65], [0x1D482, 0x1D49B, 97],
            [0x1D49C, 0x1D4B5, 65], [0x1D4B6, 0x1D4CF, 97],
            [0x1D5A0, 0x1D5B9, 65], [0x1D5BA, 0x1D5D3, 97],
            [0x1D608, 0x1D621, 65], [0x1D622, 0x1D63B, 97]
          ];
          for (const [start, end, base] of latinRanges) {
            if (cp >= start && cp <= end) return String.fromCharCode(base + (cp - start));
          }
          const digitRanges = [0x1D7CE, 0x1D7D8, 0x1D7E2, 0x1D7EC, 0x1D7F6];
          for (const dStart of digitRanges) {
            if (cp >= dStart && cp <= dStart + 9) return String.fromCharCode(48 + (cp - dStart));
          }
          if (cp >= 0x1D6FC && cp <= 0x1D714) {
            const greekList = ['α','β','γ','δ','ε','ζ','η','θ','ι','κ','λ','μ','ν','ξ','ο','π','ρ','ς','σ','τ','υ','φ','χ','ψ','ω'];
            return greekList[cp - 0x1D6FC] || ch;
          }
        }
        if (cp === 0x210E) { hadWordMathFont = true; return 'h'; }
        if (cp === 0x2212) return '-';
        if (cp === 0x2215 || cp === 0x2044) { hadWordMathFont = true; return '/'; }
        if (cp === 0x2592) { hadWordMathFont = true; return ' '; }
        return ch;
      });
      return { text: out.join(''), hadWordMathFont };
    };

    const convertWordLinearExprToLatex = (rawExpr) => {
      if (!rawExpr) return '';
      let s = normalizeWordMathUnicodeChars(rawExpr).text;
      s = s.replace(/〖/g, '{').replace(/〗/g, '}').replace(/▒/g, ' ');
      s = s.replace(/([⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻⁼⁽⁾ⁿⁱ]+)/g, (m) => `^{${Array.from(m).map(c => SUPERSCRIPT_CHAR_MAP[c] || c).join('')}}`);
      s = s.replace(/([₀₁₂₃₄₅₆₇₈₉₊₋₌₍₎ₐₑₒₓᵢⱼₖₙₘ]+)/g, (m) => `_{${Array.from(m).map(c => SUBSCRIPT_CHAR_MAP[c] || c).join('')}}`);
      s = s.replace(/∫_(\([^()]+\)|\{[^{}]+\}|[^\s^]+)\^(\([^()]+\)|\{[^{}]+\}|[^\s]+)/g, (_, sub, sup) => `\\int_{${sub.replace(/^[\(\{]|[\)\}]$/g, '')}}^{${sup.replace(/^[\(\{]|[\)\}]$/g, '')}} `);
      s = s.replace(/∫/g, '\\int ');
      s = s.replace(/∑_(\([^()]+\)|\{[^{}]+\}|[^\s^]+)\^(\([^()]+\)|\{[^{}]+\}|[^\s]+)/g, (_, sub, sup) => `\\sum_{${sub.replace(/^[\(\{]|[\)\}]$/g, '')}}^{${sup.replace(/^[\(\{]|[\)\}]$/g, '')}} `);
      s = s.replace(/∑/g, '\\sum ');
      s = s.replace(/\blim_(\([^()]+\)|\{[^{}]+\}|[^\s]+)/gi, (_, sub) => `\\lim_{${sub.replace(/^[\(\{]|[\)\}]$/g, '').replace(/->|→/g, '\\to ')}} `);
      s = s.replace(/∛\(([^()]+)\)/g, '\\sqrt[3]{$1}')
           .replace(/∛([a-zA-Z0-9]+)/g, '\\sqrt[3]{$1}')
           .replace(/∜\(([^()]+)\)/g, '\\sqrt[4]{$1}')
           .replace(/√\(([^()]+)\)/g, '\\sqrt{$1}')
           .replace(/√\{([^{}]+)\}/g, '\\sqrt{$1}')
           .replace(/√([a-zA-Z0-9]+)/g, '\\sqrt{$1}');
      s = s.replace(/\(([^()]+)\)\s*\/\s*\(([^()]+)\)/g, '\\frac{$1}{$2}');
      s = s.replace(/\{([^{}]+)\}\s*\/\s*\{([^{}]+)\}/g, '\\frac{$1}{$2}');
      s = s.replace(/\^\(([^()]+)\)/g, '^{$1}').replace(/_\(([^()]+)\)/g, '_{$1}');
      s = s.replace(/±/g, '\\pm ').replace(/×/g, '\\times ').replace(/÷/g, '\\div ').replace(/⋅|∙/g, '\\cdot ')
           .replace(/≤/g, '\\le ').replace(/≥/g, '\\ge ').replace(/≠/g, '\\ne ').replace(/≈/g, '\\approx ')
           .replace(/∞/g, '\\infty ').replace(/→|->/g, '\\to ').replace(/⇒/g, '\\Rightarrow ').replace(/⇔/g, '\\Leftrightarrow ');
      Object.keys(GREEK_UNICODE_MAP).forEach((gk) => { s = s.split(gk).join(GREEK_UNICODE_MAP[gk]); });
      return s.trim();
    };

    const autoUpgradeWordMathInPlainText = (rawStr) => {
      if (!rawStr) return '';
      let str = String(rawStr);
      const existingMath = [];
      str = str.replace(/\$\$?[\s\S]+?\$\$?/g, (m) => {
        existingMath.push(m);
        return `@@EXISTING_MATH_${existingMath.length - 1}@@`;
      });
      str = str.replace(/([\uD835][\uDC00-\uDFFF]|[〖〗▒√∛∜∫∑])+/g, (seg) => convertWordLinearExprToLatex(seg));
      str = str.replace(/(∛|∜|√)\s*(\([^()]+\)|\{[^{}]+\}|[a-zA-Z0-9_^{}+-]+)/g, (m) => `$${convertWordLinearExprToLatex(m)}$`);
      str = str.replace(/\(([^()\n]+)\)\s*\/\s*\(([^()\n]+)\)/g, (_, num, den) => `$\\frac{${convertWordLinearExprToLatex(num)}}{${convertWordLinearExprToLatex(den)}}$`);
      str = str.replace(/\b(lim)_(\([^()]+\)|\{[^{}]+\}|[^\s]+)/gi, (m) => `$${convertWordLinearExprToLatex(m)}$`);
      str = str.replace(/(∫|∑)_(\([^()]+\)|\{[^{}]+\}|[^\s^]+)\^(\([^()]+\)|\{[^{}]+\}|[^\s]+)/g, (m) => `$${convertWordLinearExprToLatex(m)}$`);
      str = str.replace(/(\\(?:frac|sqrt|int|sum|lim|sin|cos|tan|log|alpha|beta|gamma|theta|pi|infty|le|ge|ne|pm|times|div)\b(?:\s*\[[^\]]*\])?(?:\s*\{[^{}]*\})*)/g, (m) => `$${m}$`);
      str = str.replace(/@@EXISTING_MATH_(\d+)@@/g, (_, idx) => existingMath[Number(idx)] || '');
      return str;
    };

    const renderRichMathHtml = (rawText) => {
      if (rawText === null || rawText === undefined || rawText === '') return '';
      let str = autoUpgradeWordMathInPlainText(String(rawText));
      const mathTokens = [];
      str = str.replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => {
        const idx = mathTokens.length;
        const cleanTex = convertWordLinearExprToLatex(tex);
        let rendered = `$$${cleanTex}$$`;
        if (window.katex) {
          try { rendered = window.katex.renderToString(cleanTex.trim(), { displayMode: true, throwOnError: false }); } catch (_) {}
        }
        mathTokens.push(rendered);
        return `@@MATH_TOKEN_${idx}@@`;
      });
      str = str.replace(/\$([^\$\n]+?)\$/g, (_, tex) => {
        const idx = mathTokens.length;
        const cleanTex = convertWordLinearExprToLatex(tex);
        let rendered = `$${cleanTex}$`;
        if (window.katex) {
          try { rendered = window.katex.renderToString(cleanTex.trim(), { displayMode: false, throwOnError: false }); } catch (_) {}
        }
        mathTokens.push(rendered);
        return `@@MATH_TOKEN_${idx}@@`;
      });
      str = str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      str = str.replace(/&lt;(\/?(b|strong|i|em|u|sup|sub))&gt;/gi, '<$1>').replace(/&lt;br\s*\/?&gt;/gi, '<br/>');
      str = str.replace(/\*\*([^\*]+)\*\*/g, '<b>$1</b>').replace(/__([^_]+)__/g, '<u>$1</u>');
      str = str.replace(/\r?\n/g, '<br/>');
      str = str.replace(/@@MATH_TOKEN_(\d+)@@/g, (_, i) => mathTokens[Number(i)] || '');
      return str;
    };

    function RichMathText({ text, className = '' }) {
      return (
        <div
          className={`rich-math-content whitespace-pre-line break-words leading-relaxed ${className}`}
          dangerouslySetInnerHTML={{ __html: renderRichMathHtml(text) }}
        />
      );
    }

    function StudentPortalApp() {

        if (saved && saved.trim() !== '') return saved.trim();
        safeSetStorage('skarida_script_url', DEFAULT_SCRIPT_URL);
        return DEFAULT_SCRIPT_URL;
      });
      const [studentListState, setStudentListState] = useState([]);
      const [loggedInUser, setLoggedInUser] = useState(() => {
        try {
          const raw = safeGetStorage('skarida_cbt_session', '');
          const sess = raw ? JSON.parse(raw) : null;
          const u = sess?.user || sess;
          if (u && (u.username || u.username_nisn || u.nama || u.nama_lengkap)) {
            return {
              id_user: u.id_user || '',

              agama: String(u.agama || '-'),
              kelas: String(u.kelas || '-'),
              jurusan: String(u.jurusan || '-')

          }
        } catch (_) {}
        return { id_user: '', username_nisn: '-', nama_lengkap: 'Memuat Data Peserta...', agama: '-', kelas: '-', jurusan: '-' };
      });
      const [showProfileSwitcher, setShowProfileSwitcher] = useState(false);
      const [sesiListState, setSesiListState] = useState([]);
      const [soalBankState, setSoalBankState] = useState([]);
      const [activePesertaUjianId, setActivePesertaUjianId] = useState('');
      const [activeSesiObj, setActiveSesiObj] = useState(null);

      const [selectedSesi, setSelectedSesi] = useState(null);
      const [tokenInput, setTokenInput] = useState('');
      const [agreedIntegrity, setAgreedIntegrity] = useState(true);
      const [tokenError, setTokenError] = useState('');

      const [examQuestions, setExamQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [answers, setAnswers] = useState({});
      const [doubtful, setDoubtful] = useState({});
      const [fontSize, setFontSize] = useState('text-sm');
      const [showNavDrawer, setShowNavDrawer] = useState(false);
      const [showSubmitConfirm, setShowSubmitConfirm] = useState(false);

      const [remainingSeconds, setRemainingSeconds] = useState(5400);
      const [elapsedMinutes, setElapsedMinutes] = useState(0);
      const [waktuMulaiStr, setWaktuMulaiStr] = useState('');
      const [waktuSelesaiStr, setWaktuSelesaiStr] = useState('');
      const [strikes, setStrikes] = useState(0);
      const [activeStrikePopup, setActiveStrikePopup] = useState(null);
      const [finishSummary, setFinishSummary] = useState(null);

      useEffect(() => {
        let link = document.querySelector("link[rel~='icon']");
        if (!link) {
          link = document.createElement('link');
          link.rel = 'icon';
          document.head.appendChild(link);
        }
        link.href = LOGO_DATA_URI;
      }, []);

      // Sinkronisasi peserta, jadwal sesi & soal real dari Google Sheets saat halaman siswa dibuka
      useEffect(() => {
        if (!scriptUrl) return;
        fetch(`${scriptUrl}?action=initAll`, { credentials: 'omit', redirect: 'follow' })
          .then(r => r.json())
          .then(json => {
            if (json.status === 'success' && json.data) {
              const d = json.data;
              if (Array.isArray(d.users_peserta)) {
                const mappedUsers = d.users_peserta.map(u => ({
                  id_user: u.id_user,
                  username_nisn: String(u.username_nisn || ''),
                  nama_lengkap: String(u.nama_lengkap || ''),
                  agama: String(u.agama || 'Islam'),
                  kelas: String(u.kelas || ''),
                  jurusan: String(u.jurusan || '')
                }));
                setStudentListState(mappedUsers);
                setLoggedInUser(prev => {
                  if (prev && prev.id_user) {
                    const matched = mappedUsers.find(u => String(u.id_user) === String(prev.id_user) || String(u.username_nisn) === String(prev.username_nisn));
                    if (matched) return matched;
                  }
                  return mappedUsers[0] || prev;
                });
              }
              if (Array.isArray(d.sesi_ujian)) {
                const pktMap = {};
                (d.paket_soal || []).forEach(p => { pktMap[p.id_paket] = p; });
                setSesiListState(d.sesi_ujian.map(s => {
                  let parsedIds = [];
                  try { parsedIds = JSON.parse(s.peserta_ids_json || '[]'); } catch (_) {}
                  const parseBool = (val, def = true) => {
                    if (val === undefined || val === null || val === '') return def;
                    if (typeof val === 'boolean') return val;
                    return String(val).toUpperCase() === 'TRUE' || String(val) === '1';
                  };
                  return {
                    ...s,
                    mata_pelajaran: String(pktMap[s.id_paket]?.mata_pelajaran || s.nama_sesi_spesifik || 'Mata Pelajaran Ujian'),
                    jurusan: String(pktMap[s.id_paket]?.jurusan || 'Semua Jurusan'),
                    nama_sesi_spesifik: String(s.nama_sesi_spesifik || 'Sesi Ujian CBT'),
                    waktu_buka: String(s.waktu_buka || ''),
                    waktu_tutup: String(s.waktu_tutup || ''),
                    durasi_menit: Number(s.durasi_menit) || 60,
                    minimal_menit_submit: Number(s.minimal_menit_submit) || 15,
                    is_acak_soal: parseBool(s.is_acak_soal, true),
                    is_proctoring_active: parseBool(s.is_proctoring_active, true),
                    token: String(s.token || ''),
                    require_token: parseBool(s.require_token, true),
                    peserta_ids: Array.isArray(s.peserta_ids) ? s.peserta_ids : parsedIds
                  };
                }));
              }
              if (Array.isArray(d.master_soal)) {
                setSoalBankState(d.master_soal.map(q => ({
                  ...q,
                  tipe_soal: String(q.tipe_soal || 'PG'),
                  kategori_kognitif: String(q.kategori_kognitif || 'MoTS'),
                  teks_pertanyaan: String(q.teks_pertanyaan || ''),
                  jumlah_opsi: Number(q.jumlah_opsi) || 4,
                  bobot_skor: Number(q.bobot_skor) || 2,
                  kunci_jawaban: String(q.kunci_jawaban || 'A'),
                  file_gambar_soal: q.file_gambar_soal || null,
                  preview_gambar_soal: q.preview_gambar_soal || '',
                  opsi: Array.isArray(q.opsi) ? q.opsi : [String(q.opsi_a ?? ''), String(q.opsi_b ?? ''), String(q.opsi_c ?? ''), String(q.opsi_d ?? ''), String(q.opsi_e ?? '')],
                  gambar_opsi: Array.isArray(q.gambar_opsi) ? q.gambar_opsi : [q.gambar_a || null, q.gambar_b || null, q.gambar_c || null, q.gambar_d || null, q.gambar_e || null],
                  preview_gambar_opsi: Array.isArray(q.preview_gambar_opsi) ? q.preview_gambar_opsi : []
                })));
              }
            }
          })
          .catch(() => {});
      }, [scriptUrl]);

      useEffect(() => {
        if (screen !== 'exam') return;
        const t = setInterval(() => {
          setRemainingSeconds(prev => {
            const nextSec = prev > 1 ? prev - 1 : 0;
            const totalDurSec = (Number(activeSesiObj?.durasi_menit) || 60) * 60;
            setElapsedMinutes(Math.floor((totalDurSec - nextSec) / 60));
            return nextSec;
          });
        }, 1000);
        return () => clearInterval(t);
      }, [screen, activeSesiObj]);

      const handleStartExamSession = async () => {
        if (!selectedSesi) return;
        if (selectedSesi.require_token && tokenInput.trim().toUpperCase() !== String(selectedSesi.token).toUpperCase()) {
          setTokenError('Token ujian tidak sesuai! Silakan minta token aktif kepada Pengawas.');
          return;
        }
        const soalPaket = soalBankState.filter(q => String(q.id_paket) === String(selectedSesi.id_paket));
        const sourceQuestions = soalPaket.length > 0 ? soalPaket : soalBankState;
        const isRandomActive = selectedSesi.is_acak_soal !== false;

        let pgQuestions = sourceQuestions.filter(q => q.tipe_soal === 'PG');
        let uraianQuestions = sourceQuestions.filter(q => q.tipe_soal === 'Uraian');

        // Jika Toggle "Acak Soal & Jawaban" ON, acak urutan butir soal sekaligus acak posisi opsi jawaban PG (A-E)
        if (isRandomActive) {
          pgQuestions = shuffleArray(pgQuestions).map(q => {
            const jmlOpsi = Math.min(5, Math.max(3, Number(q.jumlah_opsi) || 4));
            const optionBundles = Array.from({ length: jmlOpsi }).map((_, idx) => ({
              origLetter: String.fromCharCode(65 + idx),
              teks: q.opsi?.[idx] ?? '',
              gambar: q.gambar_opsi?.[idx] ?? null,
              preview: q.preview_gambar_opsi?.[idx] ?? ''
            }));
            const shuffledBundles = shuffleArray(optionBundles);
            const origKey = String(q.kunci_jawaban || 'A').trim().toUpperCase();
            const newKeyIndex = shuffledBundles.findIndex(b => b.origLetter === origKey);
            const newDisplayKey = newKeyIndex >= 0 ? String.fromCharCode(65 + newKeyIndex) : origKey;

            return {
              ...q,
              opsi: shuffledBundles.map(b => b.teks),
              gambar_opsi: shuffledBundles.map(b => b.gambar),
              preview_gambar_opsi: shuffledBundles.map(b => b.preview),
              opsi_original_letters: shuffledBundles.map(b => b.origLetter),
              kunci_jawaban_asli: origKey,
              kunci_jawaban: newDisplayKey
            };
          });
          uraianQuestions = shuffleArray(uraianQuestions);
        }

        const ordered = [...pgQuestions, ...uraianQuestions].map((q, idx) => ({ ...q, nomor_urut: idx + 1 }));

        const nowStr = getWaktuIndonesiaString();
        const puId = `PU-${selectedSesi.id_sesi}-${loggedInUser.id_user}`;
        setActivePesertaUjianId(puId);
        setActiveSesiObj(selectedSesi);
        setWaktuMulaiStr(nowStr);
        setExamQuestions(ordered);
        setCurrentIndex(0);
        setAnswers({});
        setStrikes(0);
        setRemainingSeconds((Number(selectedSesi.durasi_menit) || 60) * 60);
        setElapsedMinutes(0);
        const currentSesi = selectedSesi;
        setSelectedSesi(null);
        setScreen('exam');

        if (scriptUrl) {
          fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            credentials: 'omit',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'startExam',
              id_sesi: currentSesi.id_sesi,
              id_user: loggedInUser.id_user,
              input_token: tokenInput,
              user_agent: navigator.userAgent
            })
          }).catch(() => {});
        }
      };

      const computeRealExamStats = (currentAnswers) => {
        let skorPG = 0;
        let jmlBenarPG = 0;
        let jmlSalahPG = 0;
        let jmlTerjawab = 0;
        const jawabanPgMap = {};
        const detailUraianMap = {};
        let firstUraianText = '';

        examQuestions.forEach((q) => {
          const ans = currentAnswers[q.nomor_urut];
          if (ans !== undefined && String(ans).trim() !== '') {
            jmlTerjawab += 1;
          }
          if (q.tipe_soal === 'PG') {
            const picked = String(ans || '').trim().toUpperCase();
            if (picked) {
              const pickedIdx = picked.charCodeAt(0) - 65;
              // Kembalikan ke kode huruf opsi asli di Bank Soal agar Preview Jawaban PG di Admin tetap akurat walau opsi diacak
              const originalOptionLetter = (Array.isArray(q.opsi_original_letters) && q.opsi_original_letters[pickedIdx])
                ? q.opsi_original_letters[pickedIdx]
                : picked;
              jawabanPgMap[q.id_soal] = originalOptionLetter;

              if (picked === String(q.kunci_jawaban || 'A').trim().toUpperCase()) {
                jmlBenarPG += 1;
                skorPG += Number(q.bobot_skor) || 2;
              } else {
                jmlSalahPG += 1;
              }
            }
          } else {
            const essayTxt = String(ans || '').trim();
            if (!firstUraianText && essayTxt) firstUraianText = essayTxt;
            detailUraianMap[q.id_soal] = {
              id_soal: q.id_soal,
              jawaban: essayTxt,
              skor: 0
            };
          }
        });

        return {
          skorPG,
          jmlBenarPG,
          jmlSalahPG,
          jmlTerjawab,
          jawabanPgMap,
          detailUraianMap,
          firstUraianText
        };
      };

      const handleTriggerViolation = (type) => {
        const nextStrike = strikes + 1;
        setStrikes(nextStrike);

        if (scriptUrl) {
          fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            credentials: 'omit',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'logViolation',
              id_peserta_ujian: activePesertaUjianId,
              id_sesi: activeSesiObj?.id_sesi || sesiListState[0]?.id_sesi || '',
              id_user: loggedInUser.id_user,
              strike_ke: nextStrike,
              jenis_pelanggaran: type,
              user_agent: navigator.userAgent
            })
          }).catch(() => {});
        }

        if (nextStrike >= 4) {
          const endNow = getWaktuIndonesiaString();
          setWaktuSelesaiStr(endNow);
          setFinishSummary({
            status: 'dihentikan_sistem',
            reason: `Auto Force Submit: Pelanggaran Ke-4 (${type})`,
            strikes: nextStrike
          });
          setActiveStrikePopup(null);
          setScreen('result');
        } else {
          setActiveStrikePopup({ count: nextStrike, type });
        }
      };

      const activeQuestion = examQuestions[currentIndex];
      const minSubmitMinutes = activeSesiObj?.minimal_menit_submit || sesiListState[0]?.minimal_menit_submit || 15;
      const canSubmitNow = elapsedMinutes >= minSubmitMinutes;

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center justify-start py-0 sm:py-6 px-0 sm:px-4">
          {/* Switcher Ukuran Layar HP */}
          <div className="hidden sm:flex items-center justify-between gap-4 w-full max-w-md mb-3 bg-slate-900/90 border border-slate-800 px-3.5 py-2 rounded-2xl text-xs">
            <span className="text-slate-300 font-bold flex items-center gap-1.5">
              <Smartphone className="w-4 h-4 text-sky-400" /> Mode Preview Siswa:
            </span>
            <div className="flex gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
              <button onClick={() => setViewportMode('frame')} className={`px-2.5 py-1 rounded-lg text-[11px] font-bold ${viewportMode === 'frame' ? 'bg-sky-600 text-white' : 'text-slate-400'}`}>
                Ukuran HP (412px)
              </button>
              <button onClick={() => setViewportMode('full')} className={`px-2.5 py-1 rounded-lg text-[11px] font-bold ${viewportMode === 'full' ? 'bg-sky-600 text-white' : 'text-slate-400'}`}>
                Layar Penuh
              </button>
            </div>
          </div>

          <div className={`w-full bg-slate-900 text-slate-100 flex flex-col relative overflow-hidden shadow-2xl transition-all ${
            viewportMode === 'frame'
              ? 'sm:max-w-[420px] sm:min-h-[780px] sm:rounded-[38px] sm:border-[7px] sm:border-slate-800 min-h-screen'
              : 'max-w-3xl min-h-[calc(100vh-48px)] sm:rounded-3xl sm:border sm:border-slate-800'
          }`}>
            {/* Status Bar HP */}
            <div className="bg-slate-950 px-5 py-2 flex items-center justify-between text-[11px] text-slate-400 border-b border-slate-800">
              <span className="font-bold text-slate-200">SKARIDA-CBT</span>
              <span className="font-mono text-[10px] text-emerald-400 flex items-center gap-1"><Wifi className="w-3.5 h-3.5" /> Online</span>
            </div>

            {/* 1. DASHBOARD JADWAL SISWA */}
            {screen === 'dashboard' && (
              <div className="flex-1 flex flex-col bg-slate-950 overflow-y-auto relative">
                <div className="bg-gradient-to-br from-slate-900 via-indigo-950/60 to-slate-900 p-5 border-b border-slate-800">
                  <div className="flex items-center justify-between mb-4">
                    <div className="flex items-center gap-2.5">
                      <SkaridaLogo className="w-9 h-9" />
                      <div>
                        <div className="text-xs font-extrabold text-white">DASHBOARD SISWA</div>
                        <div className="text-[10px] text-sky-400 font-bold">SMK Negeri 2 Tegalsari</div>
                      </div>
                    </div>
                    {studentListState.length > 1 && (
                      <button onClick={() => setShowProfileSwitcher(!showProfileSwitcher)} className="px-3 py-1.5 rounded-xl bg-slate-800 text-sky-300 border border-slate-700 text-[11px] font-bold">
                        Pilih Peserta ({studentListState.length})
                      </button>
                    )}
                  </div>

                  {showProfileSwitcher && (
                    <div className="mb-3 p-3 rounded-2xl bg-slate-950 border border-sky-500/40 space-y-1.5 max-h-48 overflow-y-auto">
                      {studentListState.map(u => (
                        <button key={u.id_user} onClick={() => { setLoggedInUser(u); setShowProfileSwitcher(false); }} className="w-full text-left p-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-xs flex justify-between">
                          <span className="font-bold text-white">{u.nama_lengkap} ({u.kelas})</span>
                          <span className="text-emerald-400">{u.agama}</span>
                        </button>
                      ))}
                    </div>
                  )}

                  <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5">
                    <div className="text-sm font-black text-white">{loggedInUser.nama_lengkap}</div>
                    <div className="text-xs text-slate-400 font-mono mt-0.5">
                      NISN: {loggedInUser.username_nisn} • {loggedInUser.kelas} • Agama: {loggedInUser.agama}
                    </div>
                  </div>
                </div>

                <div className="p-4 space-y-3 flex-1">
                  <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-300">Jadwal Sesi Ujian Database</h2>
                  {sesiListState.length === 0 ? (
                    <div className="p-8 rounded-2xl bg-slate-900 border border-slate-800 text-center text-xs text-slate-400">
                      Belum ada sesi ujian terjadwal di database Google Sheets.
                    </div>
                  ) : (
                    sesiListState.map((sesi) => {
                      const now = new Date();
                      const bukaDate = sesi.waktu_buka ? new Date(String(sesi.waktu_buka).replace(' ', 'T')) : null;
                      const isBelumBuka = bukaDate && !isNaN(bukaDate) && now < bukaDate;
                      return (
                        <div key={sesi.id_sesi} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-2.5">
                          <div className="flex justify-between items-center">
                            <span className="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 text-[10px] font-bold">{sesi.jurusan}</span>
                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${isBelumBuka ? 'bg-amber-500/15 text-amber-400' : 'bg-emerald-500/15 text-emerald-400'}`}>
                              {isBelumBuka ? 'Belum Dibuka' : 'Tersedia'}
                            </span>
                          </div>
                          <h3 className="font-extrabold text-white text-sm">{sesi.mata_pelajaran}</h3>
                          <p className="text-xs text-slate-400">{sesi.nama_sesi_spesifik}</p>
                          <div className="text-[11px] text-slate-300 bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                            Durasi: <strong>{sesi.durasi_menit} Menit</strong> • Minimal Submit: <strong>{sesi.minimal_menit_submit} Menit</strong>
                          </div>
                          <button
                            disabled={isBelumBuka}
                            onClick={() => { setSelectedSesi(sesi); setTokenInput(''); setTokenError(''); }}
                            className={`w-full py-2.5 rounded-xl text-xs font-extrabold flex items-center justify-center gap-1.5 ${
                              isBelumBuka ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : 'bg-gradient-to-r from-sky-600 to-indigo-600 text-white'
                            }`}
                          >
                            {isBelumBuka ? <><Lock className="w-3.5 h-3.5" /> Belum Masuk Jadwal Mulai</> : <><Play className="w-3.5 h-3.5" /> Mulai Kerjakan</>}
                          </button>
                        </div>
                      );
                    })
                  )}
                </div>

                {/* Modal Validasi Token */}
                {selectedSesi && (
                  <div className="absolute inset-0 z-30 bg-black/80 backdrop-blur-sm flex items-end justify-center">
                    <div className="bg-slate-900 border-t-2 border-sky-500 rounded-t-3xl w-full p-5 space-y-4">
                      <div className="flex justify-between items-center">
                        <h3 className="text-sm font-extrabold text-white">{selectedSesi.nama_sesi_spesifik}</h3>
                        <button onClick={() => setSelectedSesi(null)} className="text-slate-400 hover:text-white"><X className="w-5 h-5" /></button>
                      </div>
                      {selectedSesi.require_token && (
                        <div>
                          <label className="text-[11px] font-bold uppercase text-slate-300 block mb-1">Masukkan Token Ujian Aktif</label>
                          <input
                            type="text"
                            value={tokenInput}
                            onChange={e => setTokenInput(e.target.value.toUpperCase())}
                            placeholder="Ketik Token dari Pengawas..."
                            className="w-full bg-slate-950 border-2 border-indigo-500/60 rounded-2xl px-4 py-2.5 text-center font-mono text-base font-black tracking-widest text-amber-300 uppercase outline-none"
                          />
                        </div>
                      )}
                      {tokenError && <div className="text-xs text-red-400 font-bold">{tokenError}</div>}
                      <button onClick={handleStartExamSession} className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-2xl">
                        Masuk Layar Penuh & Mulai Ujian
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 2. LEMBAR KERJA UJIAN SISWA */}
            {screen === 'exam' && activeQuestion && (
              <div className="flex-1 flex flex-col bg-slate-950 relative overflow-hidden">
                <div className="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between z-20">
                  <div className="flex items-center gap-2">
                    <SkaridaLogo className="w-7 h-7" />
                    <div>
                      <div className="text-xs font-extrabold text-white truncate max-w-[160px]">{activeSesiObj?.mata_pelajaran || 'Ujian CBT'}</div>
                      <div className="text-[10px] text-emerald-400">Soal No. {activeQuestion.nomor_urut} / {examQuestions.length}</div>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="px-2 py-1 rounded-lg text-[10px] font-extrabold bg-amber-500/20 text-amber-300">
                      Strike: {strikes}/3
                    </span>
                    <div className="px-2.5 py-1 rounded-xl bg-slate-950 border border-slate-800 font-mono text-xs font-black text-amber-400">
                      {formatTimer(remainingSeconds)}
                    </div>
                  </div>
                </div>

                {/* Konten Pertanyaan & Pilihan Jawaban */}
                <div className="flex-1 overflow-y-auto p-4 space-y-4 z-20">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                    <RichMathText text={activeQuestion.teks_pertanyaan} className={`${fontSize} text-white font-medium`} />
                    {resolveImageSrc(activeQuestion.file_gambar_soal, activeQuestion.preview_gambar_soal) && (
                      <div className="p-2.5 rounded-xl bg-slate-950 border border-slate-800">
                        <img
                          src={resolveImageSrc(activeQuestion.file_gambar_soal, activeQuestion.preview_gambar_soal)}
                          alt="Gambar Soal"
                          className="max-h-56 mx-auto rounded-lg object-contain"
                        />
                      </div>
                    )}
                  </div>

                  {activeQuestion.tipe_soal === 'PG' ? (
                    <div className="space-y-2.5">
                      {Array.from({ length: activeQuestion.jumlah_opsi || 4 }).map((_, idx) => {
                        const huruf = String.fromCharCode(65 + idx);
                        const isSelected = answers[activeQuestion.nomor_urut] === huruf;
                        const optImgSrc = resolveImageSrc(activeQuestion.gambar_opsi?.[idx], activeQuestion.preview_gambar_opsi?.[idx]);
                        return (
                          <button
                            key={huruf}
                            type="button"
                            onClick={() => setAnswers({ ...answers, [activeQuestion.nomor_urut]: huruf })}
                            className={`w-full text-left p-3.5 rounded-2xl border-2 flex items-start gap-3 ${
                              isSelected ? 'bg-sky-600/20 border-sky-500 text-white font-bold' : 'bg-slate-900 border-slate-800 text-slate-200'
                            }`}
                          >
                            <span className={`w-7 h-7 rounded-xl font-black text-xs flex items-center justify-center shrink-0 mt-0.5 ${isSelected ? 'bg-sky-500 text-white' : 'bg-slate-800 text-slate-300'}`}>
                              {huruf}
                            </span>
                            <div className="flex-1 min-w-0 space-y-2">
                              <RichMathText text={activeQuestion.opsi?.[idx] || ''} className={`${fontSize}`} />
                              {optImgSrc && (
                                <img src={optImgSrc} alt={`Opsi ${huruf}`} className="max-h-36 rounded-xl border border-slate-700 bg-slate-950 p-1 object-contain" />
                              )}
                            </div>
                          </button>
                        );
                      })}
                    </div>
                  ) : (
                    <textarea
                      rows={5}
                      value={answers[activeQuestion.nomor_urut] || ''}
                      onChange={e => setAnswers({ ...answers, [activeQuestion.nomor_urut]: e.target.value })}
                      placeholder="Ketik jawaban uraian Anda di sini..."
                      className="w-full bg-slate-900 border border-slate-700 rounded-2xl p-3 text-xs text-white"
                    />
                  )}
                </div>

                {/* Bottom Navigation */}
                <div className="bg-slate-900 border-t border-slate-800 p-3 space-y-2 z-20">
                  <div className="grid grid-cols-3 gap-2">
                    <button disabled={currentIndex === 0} onClick={() => setCurrentIndex(currentIndex - 1)} className="py-2.5 rounded-xl bg-slate-800 text-white font-bold text-xs disabled:opacity-40">
                      ← Prev
                    </button>
                    {currentIndex < examQuestions.length - 1 ? (
                      <button onClick={() => setCurrentIndex(currentIndex + 1)} className="py-2.5 rounded-xl bg-sky-600 text-white font-extrabold text-xs col-span-2">
                        Selanjutnya →
                      </button>
                    ) : (
                      <button
                        disabled={!canSubmitNow}
                        onClick={() => {
                          const endNow = getWaktuIndonesiaString();
                          setWaktuSelesaiStr(endNow);
                          const stats = computeRealExamStats(answers);
                          setFinishSummary({ status: 'selesai', reason: 'Dikumpulkan secara sah oleh peserta', strikes });
                          setScreen('result');
                          if (scriptUrl) {
                            fetch(scriptUrl, {
                              method: 'POST',
                              mode: 'no-cors',
                              credentials: 'omit',
                              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                              body: JSON.stringify({
                                action: 'submitExam',
                                id_peserta_ujian: activePesertaUjianId,
                                status_akhir: 'selesai',
                                durasi_aktual: `${elapsedMinutes} Menit`,
                                jml_terjawab: stats.jmlTerjawab,
                                jml_benar_pg: stats.jmlBenarPG,
                                jml_salah_pg: stats.jmlSalahPG,
                                skor_pg: stats.skorPG,
                                skor_uraian: 0,
                                jawaban_pg_siswa: stats.jawabanPgMap,
                                detail_uraian: stats.detailUraianMap,
                                jawaban_uraian_teks: stats.firstUraianText
                              })
                            }).catch(() => {});
                          }
                        }}
                        className="py-2.5 rounded-xl bg-emerald-600 disabled:bg-slate-800 disabled:text-slate-500 text-white font-extrabold text-xs col-span-2"
                      >
                        {canSubmitNow ? '✓ Kumpulkan Ujian' : `🔒 Tunggu ${minSubmitMinutes} Menit`}
                      </button>
                    )}
                  </div>
                </div>

                {/* POPUP PERINGATAN 1, 2, DAN PERINGATAN TERAKHIR KE-3 */}
                {activeStrikePopup && (
                  <div className={`absolute inset-0 z-50 p-6 flex flex-col items-center justify-center text-center backdrop-blur-md ${activeStrikePopup.count === 3 ? 'bg-red-950/95' : 'bg-amber-950/95'}`}>
                    <AlertTriangle className="w-12 h-12 text-amber-300 mb-3" />
                    <span className="px-3 py-1 rounded-full bg-black/40 text-white text-[11px] font-black uppercase mb-2">
                      Peringatan Pelanggaran {activeStrikePopup.count} dari 3
                    </span>
                    <h3 className="text-lg font-black text-white mb-2">
                      {activeStrikePopup.count === 3 ? '⚠️ PERINGATAN TERAKHIR (KE-3)!' : 'Pelanggaran Terdeteksi!'}
                    </h3>
                    <p className="text-xs text-slate-100 mb-5">
                      {activeStrikePopup.count === 3
                        ? 'Ini adalah kesempatan terakhir! Jika Anda melakukan 1 pelanggaran lagi, ujian otomatis di-Force Submit!'
                        : `Aktivitas terdeteksi: ${activeStrikePopup.type}`}
                    </p>
                    <button onClick={() => setActiveStrikePopup(null)} className="w-full py-3 rounded-2xl bg-white text-slate-950 font-black text-xs">
                      Saya Mengerti & Kembali Mengerjakan
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* 3. RINGKASAN SELESAI / AUTO FORCE SUBMIT */}
            {screen === 'result' && finishSummary && (
              <div className="flex-1 flex flex-col justify-center p-6 bg-slate-950 text-center space-y-4">
                <div className="w-16 h-16 rounded-full bg-emerald-500/20 border-2 border-emerald-500 flex items-center justify-center mx-auto">
                  <CheckCircle2 className="w-8 h-8 text-emerald-400" />
                </div>
                <h2 className="text-lg font-black text-white">
                  {finishSummary.status === 'dihentikan_sistem' ? 'Ujian Dihentikan Sistem (Force Submit)' : 'Jawaban Berhasil Dikumpulkan!'}
                </h2>
                <p className="text-xs text-slate-400">{finishSummary.reason}</p>
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-left text-xs space-y-1.5">
                  <div>Waktu Mulai: <strong className="text-emerald-400 font-mono">{waktuMulaiStr}</strong></div>
                  <div>Waktu Selesai: <strong className="text-sky-400 font-mono">{waktuSelesaiStr}</strong></div>
                  <div>Total Pelanggaran: <strong className="text-red-400">{finishSummary.strikes}x</strong></div>
                </div>
                <button onClick={() => setScreen('dashboard')} className="w-full py-3 rounded-2xl bg-slate-800 text-white font-extrabold text-xs">
                  Kembali ke Dashboard Jadwal Siswa
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StudentPortalApp />);
  </script>
</body>
</html>
