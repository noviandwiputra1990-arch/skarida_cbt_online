                    <div className="bg-slate-900 border border-slate-700 rounded-3xl p-5 w-full max-w-sm space-y-4 text-center">
                      <CheckCircle2 className="w-12 h-12 text-emerald-400 mx-auto" />
                      <h4 className="font-extrabold text-white text-base">Kumpulkan Ujian Sekarang?</h4>
                      <p className="text-xs text-slate-300 leading-relaxed">
                        Anda telah menjawab <strong>{Object.keys(answers).filter(k => String(answers[k] || '').trim() !== '').length} dari {examQuestions.length} soal</strong>. Setelah dikumpulkan, ujian ini akan terkunci dan tidak dapat dikerjakan ulang.
                      </p>
                      <div className="flex gap-2">
                        <button
                          type="button"
                          onClick={() => setShowSubmitConfirm(false)}
                          className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold"
                        >
                          Periksa Lagi
                        </button>
                        <button
                          type="button"
                          onClick={() => handleExecuteSubmitExam('selesai', 'Dikumpulkan secara sah oleh peserta')}
                          className="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold"
                        >
                          Ya, Kumpulkan
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* MODAL PERBESAR GAMBAR SOAL */}
                {zoomedImage && (
                  <div
                    onClick={() => setZoomedImage(null)}
                    className="absolute inset-0 z-40 bg-black/90 flex flex-col items-center justify-center p-4"
                  >
                    <div className="bg-slate-900 border border-slate-700 rounded-2xl p-4 w-full text-center space-y-3">
                      <img src={zoomedImage} alt="Zoom Soal" className="max-h-[65vh] mx-auto rounded-lg object-contain" />
                      <button className="px-4 py-2 bg-sky-600 text-white text-xs font-bold rounded-xl">Tutup Perbesaran</button>
                    </div>
                  </div>
                )}

                {/* POPUP PERINGATAN 1, 2, DAN PERINGATAN TERAKHIR KE-3 */}
                {activeStrikePopup && (
                  <div className={`absolute inset-0 z-50 p-6 flex flex-col items-center justify-center text-center backdrop-blur-md ${activeStrikePopup.count === 3 ? 'bg-red-950/95' : 'bg-amber-950/95'}`}>
                    <AlertTriangle className="w-12 h-12 text-amber-300 mb-3 animate-bounce" />
                    <span className="px-3 py-1 rounded-full bg-black/40 text-white text-[11px] font-black uppercase mb-2">
                      Peringatan Pelanggaran {activeStrikePopup.count} dari 3
                    </span>
                    <h3 className="text-lg font-black text-white mb-2">
                      {activeStrikePopup.count === 3 ? '⚠️ PERINGATAN TERAKHIR (KE-3)!' : 'Pelanggaran Proctoring Terdeteksi!'}
                    </h3>
                    <p className="text-xs text-slate-100 mb-5 leading-relaxed">
                      {activeStrikePopup.count === 3
                        ? `Aktivitas terlarang terdeteksi: "${activeStrikePopup.type}". Ini adalah kesempatan terakhir! Jika Anda melakukan 1 pelanggaran lagi, ujian otomatis di-Force Submit!`
                        : `Sistem mendeteksi aktivitas terlarang: "${activeStrikePopup.type}". Tetap berada di layar ujian!`}
                    </p>
                    <button
                      disabled={activeStrikePopup.cooldown > 0}
                      onClick={() => {
                        setActiveStrikePopup(null);
                        setIsScreenObscured(false);
                        try {
                          if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                            document.documentElement.requestFullscreen().catch(() => {});
                          }
                        } catch (_) {}
                      }}
                      className="w-full py-3.5 rounded-2xl bg-white disabled:bg-slate-700 text-slate-950 disabled:text-slate-400 font-black text-xs transition"
                    >
                      {activeStrikePopup.cooldown > 0
                        ? `Tunggu ${activeStrikePopup.cooldown} Detik untuk Kembali...`
                        : 'Saya Mengerti & Kembali Mengerjakan'}
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* 3. RINGKASAN SELESAI / AUTO FORCE SUBMIT */}
            {screen === 'result' && finishSummary && (
              <div className="flex-1 flex flex-col justify-center p-6 bg-slate-950 text-center space-y-4">
                {finishSummary.status === 'dihentikan_sistem' ? (
                  <div className="w-16 h-16 rounded-full bg-rose-500/20 border-2 border-rose-500 flex items-center justify-center mx-auto">
                    <Ban className="w-8 h-8 text-rose-400 animate-bounce" />
                  </div>
                ) : (
                  <div className="w-16 h-16 rounded-full bg-emerald-500/20 border-2 border-emerald-500 flex items-center justify-center mx-auto">
                    <CheckCircle2 className="w-8 h-8 text-emerald-400" />
                  </div>
                )}
                <h2 className="text-lg font-black text-white">
                  {finishSummary.status === 'dihentikan_sistem' ? 'Ujian Dihentikan Sistem (Force Submit)' : 'Jawaban Berhasil Dikumpulkan!'}
                </h2>
                <p className="text-xs text-slate-400">{finishSummary.reason}</p>
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-left text-xs space-y-1.5">
                  <div className="flex justify-between"><span>Peserta:</span> <strong className="text-white">{loggedInUser.nama_lengkap}</strong></div>
                  <div className="flex justify-between"><span>Waktu Mulai:</span> <strong className="text-emerald-400 font-mono">{waktuMulaiStr}</strong></div>
                  <div className="flex justify-between"><span>Waktu Selesai:</span> <strong className="text-sky-400 font-mono">{waktuSelesaiStr}</strong></div>
                  {finishSummary.totalSoal !== undefined && (
                    <div className="flex justify-between"><span>Soal Terjawab:</span> <strong className="text-white">{finishSummary.jmlTerjawab} / {finishSummary.totalSoal} Soal</strong></div>
                  )}
                  <div className="flex justify-between"><span>Total Pelanggaran:</span> <strong className="text-red-400">{finishSummary.strikes}x</strong></div>
                </div>
                <div className="space-y-2 pt-2">
                  <button onClick={() => setScreen('dashboard')} className="w-full py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white font-extrabold text-xs">
                    Kembali ke Dashboard Jadwal Siswa
                  </button>
                  <button
                    onClick={() => handleLogoutStudent('Anda telah menyelesaikan ujian dan keluar dengan aman.')}
                    className="w-full py-3 rounded-2xl bg-rose-500/15 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/30 font-extrabold text-xs flex items-center justify-center gap-1.5 transition"
                  >
                    <LogOut className="w-4 h-4" /> Logout / Keluar Akun
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StudentPortalApp />);
  </script>
</body>
</html>
