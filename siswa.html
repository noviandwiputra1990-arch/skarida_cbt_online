    // Seluruh data diambil secara real-time dari Database Google Sheets (tanpa data dummy)
    const STUDENT_USERS = [];

    const formatTimer = (totalSeconds) => {
      const sec = Math.max(0, Number(totalSeconds) || 0);
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    };

    // Parser Waktu Jadwal Ujian yang Mengunci Zona Waktu Indonesia (WIB UTC+7, WITA UTC+8, WIT UTC+9)
    // Menangani format datetime-local (YYYY-MM-DDTHH:mm), ISO UTC (.000Z dari Sheets), maupun DD/MM/YYYY HH:mm
    const parseWaktuJadwalIndonesia = (rawStr, zona = 'WIB') => {
      if (!rawStr) return null;
      const str = String(rawStr).trim().replace(/^'/, '');
      if (!str) return null;

      const offsetMap = { WIB: '+07:00', WITA: '+08:00', WIT: '+09:00' };
      const tzOffset = offsetMap[String(zona || 'WIB').toUpperCase()] || '+07:00';
      const pad2 = (n) => String(n).padStart(2, '0');

      // 1. Jika string dari Google Sheets berakhiran .000Z (UTC ISO String akibat konversi sel Date di Sheets)
      // Ambil komponen tahun, bulan, tanggal, jam, menit sesuai jam dinding lokal
      const isoLocalMatch = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})[T ](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?$/);
      if (isoLocalMatch) {
        const [, y, m, d, hh, mm, ss = '00'] = isoLocalMatch;
        const parsed = new Date(`${y}-${pad2(m)}-${pad2(d)}T${pad2(hh)}:${pad2(mm)}:${pad2(ss)}${tzOffset}`);
        return isNaN(parsed.getTime()) ? null : parsed;
      }

      // 2. Jika format DD/MM/YYYY HH:mm atau DD-MM-YYYY HH:mm
      const dmyMatch = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(?:[T ](\d{1,2})[:.](\d{1,2})(?:[:.](\d{1,2}))?)?$/);
      if (dmyMatch) {
        const [, d, m, y, hh = '00', mm = '00', ss = '00'] = dmyMatch;
        const parsed = new Date(`${y}-${pad2(m)}-${pad2(d)}T${pad2(hh)}:${pad2(mm)}:${pad2(ss)}${tzOffset}`);
        return isNaN(parsed.getTime()) ? null : parsed;
      }

      // 3. Jika format ISO dengan 'Z' dari Google Sheets Date serialization
      if (str.endsWith('Z')) {
        const dObj = new Date(str);
        if (!isNaN(dObj.getTime())) return dObj;
      }

      const fallback = new Date(str.replace(' ', 'T'));
      return isNaN(fallback.getTime()) ? null : fallback;
    };

    const formatTampilanJadwalSesi = (rawStr, zona = 'WIB') => {
      const d = parseWaktuJadwalIndonesia(rawStr, zona);
      if (!d) return String(rawStr || '-').replace('T', ' ');
      const tzName = zona === 'WITA' ? 'Asia/Makassar' : zona === 'WIT' ? 'Asia/Jayapura' : 'Asia/Jakarta';
      try {
        const fmt = new Intl.DateTimeFormat('id-ID', {
          timeZone: tzName,
          day: '2-digit',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        });
        return `${fmt.format(d).replace(/\./g, ':')} ${zona || 'WIB'}`;
      } catch (_) {
        return `${String(rawStr).replace('T', ' ')} ${zona || 'WIB'}`;
      }
    };

    const evaluateStatusJadwalSesi = (sesi, nowMs = Date.now()) => {
      const zona = sesi?.zona_waktu || 'WIB';
      const bukaDate = parseWaktuJadwalIndonesia(sesi?.waktu_buka, zona);
      const tutupDate = parseWaktuJadwalIndonesia(sesi?.waktu_tutup, zona);

      const isBelumBuka = bukaDate ? nowMs < bukaDate.getTime() : false;
      const isSudahTutup = tutupDate ? nowMs > tutupDate.getTime() : false;

      let statusKey = 'TERSEDIA';
      let statusLabel = 'Sedang Berlangsung';
      if (isBelumBuka) {
        statusKey = 'BELUM_DIBUKA';
        statusLabel = 'Belum Dibuka';
      } else if (isSudahTutup) {
        statusKey = 'SUDAH_DITUTUP';
        statusLabel = 'Waktu Ujian Berakhir';
      }

      return {
        statusKey,
        statusLabel,
        isBelumBuka,
        isSudahTutup,
        isOpen: !isBelumBuka && !isSudahTutup,
        tutupDateMs: tutupDate ? tutupDate.getTime() : null,
        bukaFormatted: formatTampilanJadwalSesi(sesi?.waktu_buka, zona),
        tutupFormatted: formatTampilanJadwalSesi(sesi?.waktu_tutup, zona)
      };
    };

    // Algoritma Fisher-Yates murni (1-to-1 Permutation tanpa duplikasi opsi)
    const shuffleArray = (arr) => {
      const copy = [...(arr || [])];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
      }
      return copy;
    };

    // Menyusun kertas soal & mengacak posisi opsi A-E secara unik (tanpa pernah menduplikasi opsi)
    // serta membatasi jumlah soal PG & Uraian sesuai konfigurasi sesi (limitPG & limitUraian)
    const buildOrderedExamQuestions = (sourceQuestions, isRandomActive, limitPG = null, limitUraian = null) => {
      let pgRaw = (sourceQuestions || []).filter(q => String(q.tipe_soal || 'PG').toUpperCase() === 'PG');
      let uraianRaw = (sourceQuestions || []).filter(q => String(q.tipe_soal || 'PG').toUpperCase() !== 'PG');

      if (isRandomActive) {
        pgRaw = shuffleArray(pgRaw);
        uraianRaw = shuffleArray(uraianRaw);
      }

      if (limitPG !== null && limitPG !== undefined && Number(limitPG) > 0) {
        pgRaw = pgRaw.slice(0, Number(limitPG));
      } else if (limitPG !== null && Number(limitPG) === 0 && pgRaw.length > 0 && Number(limitUraian) > 0) {
        pgRaw = [];
      }

      if (limitUraian !== null && limitUraian !== undefined && Number(limitUraian) >= 0) {
        if (Number(limitUraian) > 0) {
          uraianRaw = uraianRaw.slice(0, Number(limitUraian));
        } else if (Number(limitPG) > 0) {
          uraianRaw = [];
        }
      }

      const processedPG = pgRaw.map(q => {
        // Ambil selalu dari sumber opsi asli agar tidak pernah teracak ganda atau terduplikasi
        const baseOpsi = Array.isArray(q.orig_opsi)
          ? q.orig_opsi
          : [
              String(q.opsi_a ?? q.opsi?.[0] ?? ''),
              String(q.opsi_b ?? q.opsi?.[1] ?? ''),
              String(q.opsi_c ?? q.opsi?.[2] ?? ''),
              String(q.opsi_d ?? q.opsi?.[3] ?? ''),
              String(q.opsi_e ?? q.opsi?.[4] ?? '')
            ];
        const baseGbr = Array.isArray(q.orig_gambar_opsi)
          ? q.orig_gambar_opsi
          : [
              q.gambar_a ?? q.gambar_opsi?.[0] ?? null,
              q.gambar_b ?? q.gambar_opsi?.[1] ?? null,
              q.gambar_c ?? q.gambar_opsi?.[2] ?? null,
              q.gambar_d ?? q.gambar_opsi?.[3] ?? null,
              q.gambar_e ?? q.gambar_opsi?.[4] ?? null
            ];
        const basePrev = Array.isArray(q.orig_preview_gambar_opsi)
          ? q.orig_preview_gambar_opsi
          : (Array.isArray(q.preview_gambar_opsi) ? q.preview_gambar_opsi : ['', '', '', '', '']);

        const jmlOpsi = Math.min(5, Math.max(3, Number(q.jumlah_opsi) || 4));
        const origKeyLetter = String(q.orig_kunci_jawaban || q.kunci_jawaban || 'A').trim().toUpperCase().slice(0, 1) || 'A';
        const origKeyIndex = Math.max(0, Math.min(jmlOpsi - 1, origKeyLetter.charCodeAt(0) - 65));

        // Buat daftar indeks unik [0, 1, ..., jmlOpsi - 1]
        const uniqueIndices = Array.from({ length: jmlOpsi }, (_, idx) => idx);
        const permutedIndices = isRandomActive ? shuffleArray(uniqueIndices) : uniqueIndices;

        const finalOpsi = permutedIndices.map(oldIdx => baseOpsi[oldIdx] ?? '');
        const finalGbr = permutedIndices.map(oldIdx => baseGbr[oldIdx] ?? null);
        const finalPrev = permutedIndices.map(oldIdx => basePrev[oldIdx] ?? '');
        const finalOrigLetters = permutedIndices.map(oldIdx => String.fromCharCode(65 + oldIdx));

        // Kunci jawaban baru melekat tepat pada indeks di mana origKeyIndex berada
        const newKeyPos = permutedIndices.indexOf(origKeyIndex);
        const newDisplayKey = String.fromCharCode(65 + (newKeyPos >= 0 ? newKeyPos : 0));

        return {
          ...q,
          jumlah_opsi: jmlOpsi,
          orig_opsi: baseOpsi,
          orig_gambar_opsi: baseGbr,
          orig_preview_gambar_opsi: basePrev,
          orig_kunci_jawaban: origKeyLetter,
          opsi: finalOpsi,
          gambar_opsi: finalGbr,
          preview_gambar_opsi: finalPrev,
          opsi_original_letters: finalOrigLetters,
          kunci_jawaban_asli: origKeyLetter,
          kunci_jawaban: newDisplayKey
        };
      });

      return [...processedPG, ...uraianRaw].map((q, idx) => ({
        ...q,
        nomor_urut: idx + 1
      }));
    };

    const getWaktuIndonesiaString = () => {
      try {
        const formatter = new Intl.DateTimeFormat('id-ID', {
          timeZone: 'Asia/Jakarta',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });
        return `${formatter.format(new Date()).replace(/\./g, ':')} WIB`;
      } catch (_) {
        return new Date().toISOString().replace('T', ' ').slice(0, 19) + ' WIB';
      }
    };

    const buildSvgDiagramPlaceholder = (filename) => {
      const cleanName = String(filename || 'Gambar Soal').replace(/[<>&"']/g, '');
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240">
        <rect width="520" height="240" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4"/>
        <rect x="150" y="45" width="220" height="90" rx="10" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
        <circle cx="260" cy="90" r="24" fill="#38bdf8" fill-opacity="0.25" stroke="#7dd3fc" stroke-width="2"/>
        <text x="260" y="168" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-weight="bold" font-size="14">LAMPIRAN GAMBAR SOAL / OPSI</text>
        <text x="260" y="194" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="13">${cleanName}</text>
      </svg>`;
      return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
    };

    const resolveImageSrc = (fileVal, previewVal) => {
      const candidate = String(previewVal || fileVal || '').trim();
      if (!candidate) return '';
      if (candidate.startsWith('data:image') || candidate.startsWith('http://') || candidate.startsWith('https://') || candidate.startsWith('blob:')) {
        return candidate;
      }
      const strFile = String(fileVal || '').trim();
      if (strFile.startsWith('data:image') || strFile.startsWith('http://') || strFile.startsWith('https://') || strFile.startsWith('blob:')) {
        return strFile;
      }
      if (strFile) return buildSvgDiagramPlaceholder(strFile);
      return '';
    };

    const GREEK_UNICODE_MAP = {
      'α': '\\alpha ', 'β': '\\beta ', 'γ': '\\gamma ', 'δ': '\\delta ', 'ε': '\\varepsilon ',
      'ζ': '\\zeta ', 'η': '\\eta ', 'θ': '\\theta ', 'ϑ': '\\vartheta ', 'ι': '\\iota ',
      'κ': '\\kappa ', 'λ': '\\lambda ', 'μ': '\\mu ', 'ν': '\\nu ', 'ξ': '\\xi ',
      'π': '\\pi ', 'ρ': '\\rho ', 'σ': '\\sigma ', 'τ': '\\tau ', 'υ': '\\upsilon ',
      'φ': '\\varphi ', 'ϕ': '\\phi ', 'χ': '\\chi ', 'ψ': '\\psi ', 'ω': '\\omega ',
      'Γ': '\\Gamma ', 'Δ': '\\Delta ', '∆': '\\Delta ', 'Θ': '\\Theta ', 'Λ': '\\Lambda ',
      'Ξ': '\\Xi ', 'Π': '\\Pi ', 'Σ': '\\Sigma ', 'Φ': '\\Phi ', 'Ψ': '\\Psi ', 'Ω': '\\Omega '
    };

    const SUPERSCRIPT_CHAR_MAP = {
      '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9',
      '⁺': '+', '⁻': '-', '⁼': '=', '⁽': '(', '⁾': ')', 'ⁿ': 'n', 'ⁱ': 'i'
    };

    const SUBSCRIPT_CHAR_MAP = {
      '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9',
      '₊': '+', '₋': '-', '₌': '=', '₍': '(', '₎': ')', 'ₐ': 'a', 'ₑ': 'e', 'ₒ': 'o', 'ₓ': 'x', 'ᵢ': 'i', 'ⱼ': 'j', 'ₖ': 'k', 'ₙ': 'n', 'ₘ': 'm'
    };

    const normalizeWordMathUnicodeChars = (input) => {
      if (!input) return { text: '', hadWordMathFont: false };
      let hadWordMathFont = false;
      const chars = Array.from(String(input));
      const out = chars.map((ch) => {
        const cp = ch.codePointAt(0);
        if (!cp) return ch;
        if (cp >= 0x1D400 && cp <= 0x1D7FF) {
          hadWordMathFont = true;
          const latinRanges = [
            [0x1D400, 0x1D419, 65], [0x1D41A, 0x1D433, 97],
            [0x1D434, 0x1D44D, 65], [0x1D44E, 0x1D467, 97],
            [0x1D468, 0x1D481, 65], [0x1D482, 0x1D49B, 97],
            [0x1D49C, 0x1D4B5, 65], [0x1D4B6, 0x1D4CF, 97],
            [0x1D5A0, 0x1D5B9, 65], [0x1D5BA, 0x1D5D3, 97],
            [0x1D608, 0x1D621, 65], [0x1D622, 0x1D63B, 97]
          ];
          for (const [start, end, base] of latinRanges) {
            if (cp >= start && cp <= end) return String.fromCharCode(base + (cp - start));
          }
          const digitRanges = [0x1D7CE, 0x1D7D8, 0x1D7E2, 0x1D7EC, 0x1D7F6];
          for (const dStart of digitRanges) {
            if (cp >= dStart && cp <= dStart + 9) return String.fromCharCode(48 + (cp - dStart));
          }
          if (cp >= 0x1D6FC && cp <= 0x1D714) {
            const greekList = ['α','β','γ','δ','ε','ζ','η','θ','ι','κ','λ','μ','ν','ξ','ο','π','ρ','ς','σ','τ','υ','φ','χ','ψ','ω'];
            return greekList[cp - 0x1D6FC] || ch;
          }
        }
        if (cp === 0x210E) { hadWordMathFont = true; return 'h'; }
        if (cp === 0x2212) return '-';
        if (cp === 0x2215 || cp === 0x2044) { hadWordMathFont = true; return '/'; }
        if (cp === 0x2592) { hadWordMathFont = true; return ' '; }
        return ch;
      });
      return { text: out.join(''), hadWordMathFont };
    };

    const convertWordLinearExprToLatex = (rawExpr) => {
      if (!rawExpr) return '';
      let s = normalizeWordMathUnicodeChars(rawExpr).text;
      s = s.replace(/〖/g, '{').replace(/〗/g, '}').replace(/▒/g, ' ');
      s = s.replace(/([⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻⁼⁽⁾ⁿⁱ]+)/g, (m) => `^{${Array.from(m).map(c => SUPERSCRIPT_CHAR_MAP[c] || c).join('')}}`);
      s = s.replace(/([₀₁₂₃₄₅₆₇₈₉₊₋₌₍₎ₐₑₒₓᵢⱼₖₙₘ]+)/g, (m) => `_{${Array.from(m).map(c => SUBSCRIPT_CHAR_MAP[c] || c).join('')}}`);
      s = s.replace(/∫_(\([^()]+\)|\{[^{}]+\}|[^\s^]+)\^(\([^()]+\)|\{[^{}]+\}|[^\s]+)/g, (_, sub, sup) => `\\int_{${sub.replace(/^[\(\{]|[\)\}]$/g, '')}}^{${sup.replace(/^[\(\{]|[\)\}]$/g, '')}} `);
      s = s.replace(/∫/g, '\\int ');
      s = s.replace(/∑_(\([^()]+\)|\{[^{}]+\}|[^\s^]+)\^(\([^()]+\)|\{[^{}]+\}|[^\s]+)/g, (_, sub, sup) => `\\sum_{${sub.replace(/^[\(\{]|[\)\}]$/g, '')}}^{${sup.replace(/^[\(\{]|[\)\}]$/g, '')}} `);
      s = s.replace(/∑/g, '\\sum ');
      s = s.replace(/\blim_(\([^()]+\)|\{[^{}]+\}|[^\s]+)/gi, (_, sub) => `\\lim_{${sub.replace(/^[\(\{]|[\)\}]$/g, '').replace(/->|→/g, '\\to ')}} `);
      s = s.replace(/∛\(([^()]+)\)/g, '\\sqrt[3]{$1}')
           .replace(/∛([a-zA-Z0-9]+)/g, '\\sqrt[3]{$1}')
           .replace(/∜\(([^()]+)\)/g, '\\sqrt[4]{$1}')
           .replace(/√\(([^()]+)\)/g, '\\sqrt{$1}')
           .replace(/√\{([^{}]+)\}/g, '\\sqrt{$1}')
           .replace(/√([a-zA-Z0-9]+)/g, '\\sqrt{$1}');
      s = s.replace(/\(([^()]+)\)\s*\/\s*\(([^()]+)\)/g, '\\frac{$1}{$2}');
      s = s.replace(/\{([^{}]+)\}\s*\/\s*\{([^{}]+)\}/g, '\\frac{$1}{$2}');
      s = s.replace(/\^\(([^()]+)\)/g, '^{$1}').replace(/_\(([^()]+)\)/g, '_{$1}');
      s = s.replace(/±/g, '\\pm ').replace(/×/g, '\\times ').replace(/÷/g, '\\div ').replace(/⋅|∙/g, '\\cdot ')
           .replace(/≤/g, '\\le ').replace(/≥/g, '\\ge ').replace(/≠/g, '\\ne ').replace(/≈/g, '\\approx ')
           .replace(/∞/g, '\\infty ').replace(/→|->/g, '\\to ').replace(/⇒/g, '\\Rightarrow ').replace(/⇔/g, '\\Leftrightarrow ');
      Object.keys(GREEK_UNICODE_MAP).forEach((gk) => { s = s.split(gk).join(GREEK_UNICODE_MAP[gk]); });
      return s.trim();
    };

    const autoUpgradeWordMathInPlainText = (rawStr) => {
      if (!rawStr) return '';
      let str = String(rawStr);
      const existingMath = [];
      str = str.replace(/\$\$?[\s\S]+?\$\$?/g, (m) => {
        existingMath.push(m);
        return `@@EXISTING_MATH_${existingMath.length - 1}@@`;
      });
      str = str.replace(/([\uD835][\uDC00-\uDFFF]|[〖〗▒√∛∜∫∑])+/g, (seg) => convertWordLinearExprToLatex(seg));
      str = str.replace(/(∛|∜|√)\s*(\([^()]+\)|\{[^{}]+\}|[a-zA-Z0-9_^{}+-]+)/g, (m) => `$${convertWordLinearExprToLatex(m)}$`);
      str = str.replace(/\(([^()\n]+)\)\s*\/\s*\(([^()\n]+)\)/g, (_, num, den) => `$\\frac{${convertWordLinearExprToLatex(num)}}{${convertWordLinearExprToLatex(den)}}$`);
      str = str.replace(/\b(lim)_(\([^()]+\)|\{[^{}]+\}|[^\s]+)/gi, (m) => `$${convertWordLinearExprToLatex(m)}$`);
      str = str.replace(/(∫|∑)_(\([^()]+\)|\{[^{}]+\}|[^\s^]+)\^(\([^()]+\)|\{[^{}]+\}|[^\s]+)/g, (m) => `$${convertWordLinearExprToLatex(m)}$`);
      str = str.replace(/(\\(?:frac|sqrt|int|sum|lim|sin|cos|tan|log|alpha|beta|gamma|theta|pi|infty|le|ge|ne|pm|times|div)\b(?:\s*\[[^\]]*\])?(?:\s*\{[^{}]*\})*)/g, (m) => `$${m}$`);
      str = str.replace(/@@EXISTING_MATH_(\d+)@@/g, (_, idx) => existingMath[Number(idx)] || '');
      return str;
    };

    const renderRichMathHtml = (rawText) => {
      if (rawText === null || rawText === undefined || rawText === '') return '';
      let str = autoUpgradeWordMathInPlainText(String(rawText));
      const mathTokens = [];
      str = str.replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => {
        const idx = mathTokens.length;
        const cleanTex = convertWordLinearExprToLatex(tex);
        let rendered = `$$${cleanTex}$$`;
        if (window.katex) {
          try { rendered = window.katex.renderToString(cleanTex.trim(), { displayMode: true, throwOnError: false }); } catch (_) {}
        }
        mathTokens.push(rendered);
        return `@@MATH_TOKEN_${idx}@@`;
      });
      str = str.replace(/\$([^\$\n]+?)\$/g, (_, tex) => {
        const idx = mathTokens.length;
        const cleanTex = convertWordLinearExprToLatex(tex);
        let rendered = `$${cleanTex}$`;
        if (window.katex) {
          try { rendered = window.katex.renderToString(cleanTex.trim(), { displayMode: false, throwOnError: false }); } catch (_) {}
        }
        mathTokens.push(rendered);
        return `@@MATH_TOKEN_${idx}@@`;
      });
      str = str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      str = str.replace(/&lt;(\/?(b|strong|i|em|u|sup|sub))&gt;/gi, '<$1>').replace(/&lt;br\s*\/?&gt;/gi, '<br/>');
      str = str.replace(/\*\*([^\*]+)\*\*/g, '<b>$1</b>').replace(/__([^_]+)__/g, '<u>$1</u>');
      str = str.replace(/\r?\n/g, '<br/>');
      str = str.replace(/@@MATH_TOKEN_(\d+)@@/g, (_, i) => mathTokens[Number(i)] || '');
      return str;
    };

    function RichMathText({ text, className = '' }) {
      return window.React.createElement('div', {
        className: `rich-math-content whitespace-pre-line break-words leading-relaxed ${className}`,
        dangerouslySetInnerHTML: { __html: renderRichMathHtml(text) }
      });
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function StudentPortalApp() {

      // Handler Refresh Halaman & Soal Aman (Saat Gangguan Internet) Tanpa Dianggap Kecurangan & Tanpa Reset Waktu

        triggerToast(

          screen === 'exam'
            ? `Soal No. ${currentIndex + 1} dan jawaban Anda berhasil dimuat ulang tanpa mereset waktu.`
            : 'Jadwal sesi & bank soal berhasil disinkronkan ulang.'

        setTimeout(() => {

      // Helper mengaktifkan Fullscreen 1 Layar Penuh, WakeLock & KeyboardLock untuk menekan Popup Notifikasi Sistem
      const enterFullscreenOneScreen = async () => {
        try {
          const docEl = document.documentElement;

            } else if (docEl.webkitRequestFullscreen) {
              docEl.webkitRequestFullscreen();
            } else if (docEl.msRequestFullscreen) {
              docEl.msRequestFullscreen();
            }
          }
          // Kunci tombol sistem & keyboard agar popup notifikasi eksternal tidak mengambil alih input
          if (navigator.keyboard && navigator.keyboard.lock) {
            navigator.keyboard.lock(['Escape', 'MetaLeft', 'MetaRight', 'AltLeft', 'AltRight']).catch(() => {});
          }
          // Aktifkan Screen Wake Lock agar layar tidak redup/memicu notifikasi lockscreen
          if (navigator.wakeLock && navigator.wakeLock.request && !wakeLockRef.current) {
            navigator.wakeLock.request('screen').then(lock => {
              wakeLockRef.current = lock;
              lock.addEventListener('release', () => { wakeLockRef.current = null; });
            }).catch(() => {});
          }
          window.focus();
          setIsFullscreenLocked(true);
        } catch (_) {
          setIsFullscreenLocked(true);
        }
      };

      // Pantau status Fullscreen & otomatis kunci layar penuh saat interaksi pertama
      useEffect(() => {
        const syncFsState = () => {
          const active = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
          setIsFullscreenLocked(active);
        };
        const autoLockOnFirstTap = () => {
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            enterFullscreenOneScreen();
          }
        };
        document.addEventListener('fullscreenchange', syncFsState);
        document.addEventListener('webkitfullscreenchange', syncFsState);
        window.addEventListener('pointerdown', autoLockOnFirstTap, { once: true, passive: true });
        return () => {
          document.removeEventListener('fullscreenchange', syncFsState);
          document.removeEventListener('webkitfullscreenchange', syncFsState);
          window.removeEventListener('pointerdown', autoLockOnFirstTap);
        };
      }, []);

      const normalizeRowKeys = (rawRow) => {
        const out = {};
        if (!rawRow || typeof rawRow !== 'object') return out;
        Object.keys(rawRow).forEach(k => {
          const val = rawRow[k];
          out[k] = val;
          const cleanKey = String(k).trim().toLowerCase().replace(/\s+/g, '_');
          if (out[cleanKey] === undefined || out[cleanKey] === '') {
            out[cleanKey] = val;
          }
        });
        return out;
      };

      const isRowNotEmpty = (rowObj) => {
        if (!rowObj || typeof rowObj !== 'object') return false;
        return Object.values(rowObj).some(v => v !== null && v !== undefined && String(v).trim() !== '');
      };

      const triggerToast = (title, message, type = 'success') => {
        setToast({ title, message, type });
        setTimeout(() => setToast(null), 4000);
      };

      const getLocalExamKey = (idSesi, idUser) => `skarida_exam_state_${idSesi}_${idUser}`;
      const getActivePointerKey = (idUser) => `skarida_active_exam_${idUser}`;

      // Simpan state pengerjaan ujian ke localStorage setiap kali ada perubahan (anti-hilang saat refresh)
      const saveLocalExamProgress = (customPatch = {}) => {
        const sId = customPatch.id_sesi || activeSesiObj?.id_sesi;
        const uId = customPatch.id_user || loggedInUser?.id_user;
        if (!sId || !uId) return;
        const key = getLocalExamKey(sId, uId);
        let existing = {};
        try { existing = JSON.parse(safeGetStorage(key, '{}')) || {}; } catch (_) {}
        const merged = {
          ...existing,
          id_sesi: sId,
          id_user: uId,
          id_peserta_ujian: customPatch.id_peserta_ujian || activePesertaUjianId || `PU-${sId}-${uId}`,
          activeSesiObj: customPatch.activeSesiObj || activeSesiObj,
          examQuestions: customPatch.examQuestions || examQuestions,
          currentIndex: customPatch.currentIndex !== undefined ? customPatch.currentIndex : currentIndex,
          answers: customPatch.answers || answers,
          doubtful: customPatch.doubtful || doubtful,
          strikes: customPatch.strikes !== undefined ? customPatch.strikes : strikes,
          violationLogs: customPatch.violationLogs || violationLogs,
          waktuMulaiStr: customPatch.waktuMulaiStr || waktuMulaiStr,
          waktuSelesaiStr: customPatch.waktuSelesaiStr || waktuSelesaiStr,
          examStartTimeMs: customPatch.examStartTimeMs || examStartTimeMs,
          examEndTimeMs: customPatch.examEndTimeMs || examEndTimeMs,
          status_pengerjaan: customPatch.status_pengerjaan || existing.status_pengerjaan || 'sedang_mengerjakan',
          updatedAtMs: Date.now()
        };
        safeSetStorage(key, JSON.stringify(merged));
      };

      useEffect(() => {
        let link = document.querySelector("link[rel~='icon']");
        if (!link) {
          link = document.createElement('link');
          link.rel = 'icon';
          document.head.appendChild(link);
        }
        link.href = cachedLogoResolvedSrc;
      }, []);

      // Update jam real-time setiap 1 detik
      useEffect(() => {
        const clockTimer = setInterval(() => {
          setNowTimestampMs(Date.now());
          setClockWibStr(getWaktuIndonesiaString());
        }, 1000);
        return () => clearInterval(clockTimer);
      }, []);

      // Geser koordinat watermark forensik setiap 8 detik agar tidak dapat di-crop/dihapus
      useEffect(() => {
        if (screen !== 'exam') return;
        const wmTimer = setInterval(() => {
          setWatermarkShift(prev => (prev + 1) % 4);
        }, 8000);
        return () => clearInterval(wmTimer);
      }, [screen]);

      // Handler Logout Manual & Auto-Logout Idle 15 Menit
      const handleLogoutStudent = (reasonMsg = '') => {
        if (screen === 'exam' && activeSesiObj) {
          saveLocalExamProgress({ currentIndex, answers, doubtful, strikes });
        }
        if (scriptUrl && loggedInUser?.id_user) {
          fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            credentials: 'omit',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'logout',
              roleType: 'siswa',
              id: loggedInUser.id_user
            })
          }).catch(() => {});
        }
        try {
          localStorage.removeItem('skarida_cbt_session');
        } catch (_) {}
        if (reasonMsg) {
          triggerToast('Sesi Diakhiri', reasonMsg, 'danger');
        }
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 250);
      };

      // Sensor Auto-Logout jika tidak aktif selama 15 menit (900 detik)
      useEffect(() => {
        const resetIdle = () => setIdleSecondsLeft(900);
        const events = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll', 'click'];
        events.forEach(ev => window.addEventListener(ev, resetIdle, { passive: true }));

        const idleInterval = setInterval(() => {
          setIdleSecondsLeft(prev => {
            if (prev <= 1) {
              handleLogoutStudent('Otomatis logout karena tidak ada aktivitas selama 15 menit.');
              return 900;
            }
            return prev - 1;
          });
        }, 1000);

        return () => {
          events.forEach(ev => window.removeEventListener(ev, resetIdle));
          clearInterval(idleInterval);
        };
      }, [loggedInUser, screen, activeSesiObj, currentIndex, answers, doubtful, strikes]);

      const loadScheduleAndDatabase = async () => {
        setIsRefreshingSchedule(true);
        const parseBool = (val, def = true) => {
          if (val === undefined || val === null || val === '') return def;
          if (typeof val === 'boolean') return val;
          return String(val).toUpperCase() === 'TRUE' || String(val) === '1';
        };

        const mergePesertaUjianRecords = (listPU, replaceAll = false) => {
          if (!Array.isArray(listPU)) return;
          setPesertaUjianMap(prev => {
            const next = replaceAll ? {} : { ...prev };
            listPU.forEach(pu => {
              if (pu && pu.id_sesi && pu.id_user) {
                next[`${pu.id_sesi}_${pu.id_user}`] = pu;
              }
            });
            return next;
          });
        };

        // 1. Muat cadangan lokal terlebih dahulu
        try {
          const cachedSesi = JSON.parse(safeGetStorage('skarida_db_sesi', '[]'));
          const cachedPaket = JSON.parse(safeGetStorage('skarida_db_paket', '[]'));
          const cachedSoal = JSON.parse(safeGetStorage('skarida_db_soal', '[]'));
          const cachedUsers = JSON.parse(safeGetStorage('skarida_db_users', '[]'));
          const cachedPU = JSON.parse(safeGetStorage('skarida_db_peserta_ujian', '[]'));

          if (Array.isArray(cachedUsers) && cachedUsers.length > 0 && studentListState.length === 0) {
            setStudentListState(cachedUsers);
          }
          if (Array.isArray(cachedPU) && cachedPU.length > 0) {
            mergePesertaUjianRecords(cachedPU);
          }
          if (Array.isArray(cachedSesi) && cachedSesi.length > 0 && sesiListState.length === 0) {
            const pktMapLocal = {};
            (Array.isArray(cachedPaket) ? cachedPaket : []).forEach(p => { pktMapLocal[p.id_paket] = p; });
            setSesiListState(cachedSesi.map(s => ({
              ...s,
              mata_pelajaran: String(pktMapLocal[s.id_paket]?.mata_pelajaran || s.nama_sesi_spesifik || 'Mata Pelajaran Ujian'),
              jurusan: String(pktMapLocal[s.id_paket]?.jurusan || 'Semua Jurusan'),
              zona_waktu: String(s.zona_waktu || 'WIB'),
              waktu_buka: String(s.waktu_buka || ''),
              waktu_tutup: String(s.waktu_tutup || ''),
              durasi_menit: Number(s.durasi_menit) || 60,
              minimal_menit_submit: Number(s.minimal_menit_submit) || 15,
              limit_soal_pg: s.limit_soal_pg !== undefined && s.limit_soal_pg !== '' ? Number(s.limit_soal_pg) : undefined,
              limit_soal_uraian: s.limit_soal_uraian !== undefined && s.limit_soal_uraian !== '' ? Number(s.limit_soal_uraian) : undefined,
              is_acak_soal: parseBool(s.is_acak_soal, true),
              is_proctoring_active: parseBool(s.is_proctoring_active, true),
              require_token: parseBool(s.require_token, true),
              token: String(s.token || '')
            })));
          }
          if (Array.isArray(cachedSoal) && cachedSoal.length > 0 && soalBankState.length === 0) {
            setSoalBankState(cachedSoal.map(q => {
              const origOpsi = Array.isArray(q.orig_opsi) ? q.orig_opsi : (Array.isArray(q.opsi) ? [...q.opsi] : [String(q.opsi_a ?? ''), String(q.opsi_b ?? ''), String(q.opsi_c ?? ''), String(q.opsi_d ?? ''), String(q.opsi_e ?? '')]);
              const origGbr = Array.isArray(q.orig_gambar_opsi) ? q.orig_gambar_opsi : (Array.isArray(q.gambar_opsi) ? [...q.gambar_opsi] : [q.gambar_a || null, q.gambar_b || null, q.gambar_c || null, q.gambar_d || null, q.gambar_e || null]);
              const origPrev = Array.isArray(q.orig_preview_gambar_opsi) ? q.orig_preview_gambar_opsi : (Array.isArray(q.preview_gambar_opsi) ? [...q.preview_gambar_opsi] : []);
              return {
                ...q,
                orig_opsi: origOpsi,
                orig_gambar_opsi: origGbr,
                orig_preview_gambar_opsi: origPrev,
                orig_kunci_jawaban: String(q.orig_kunci_jawaban || q.kunci_jawaban || 'A').trim().toUpperCase()
              };
            }));
          }
        } catch (_) {}

        if (!scriptUrl) {
          setIsRefreshingSchedule(false);
          return;
        }

        // 2. Tarik data terbaru dari Google Sheets (dengan fallback POST jika GET terhalang cache)
        try {
          let json = null;
          try {
            const r = await fetch(`${scriptUrl}${scriptUrl.includes('?') ? '&' : '?'}action=initAll&_ts=${Date.now()}`, {
              method: 'GET',
              credentials: 'omit',
              redirect: 'follow'
            });
            json = await r.json();
          } catch (_getErr) {
            const rPost = await fetch(scriptUrl, {
              method: 'POST',
              credentials: 'omit',
              redirect: 'follow',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'initAll' })
            });
            json = await rPost.json();
          }

          if (json && json.status === 'success' && json.data) {
            setDbConnected(true);
            const d = json.data;
            if (Array.isArray(d.users_peserta)) {
              const mappedUsers = d.users_peserta.filter(isRowNotEmpty).map((raw, idx) => {
                const u = normalizeRowKeys(raw);
                return {
                  id_user: u.id_user || u.id || idx + 1001,
                  username_nisn: String(u.username_nisn || u.nisn || u.username || '').trim().replace(/^'/, ''),
                  nama_lengkap: String(u.nama_lengkap || u.nama || '').trim(),
                  agama: String(u.agama || 'Islam').trim(),
                  kelas: String(u.kelas || u.nama_kelas || '').trim(),
                  jurusan: String(u.jurusan || u.kode_jurusan || '').trim().toUpperCase()
                };
              });
              setStudentListState(mappedUsers);
              safeSetStorage('skarida_db_users', JSON.stringify(mappedUsers));
              setLoggedInUser(prev => {
                if (prev && (prev.id_user || prev.username_nisn !== '-')) {
                  const normPrevNisn = String(prev.username_nisn || '').trim().replace(/^0+/, '');
                  const matched = mappedUsers.find(u =>
                    String(u.id_user) === String(prev.id_user) ||
                    String(u.username_nisn) === String(prev.username_nisn) ||
                    (normPrevNisn !== '' && String(u.username_nisn).replace(/^0+/, '') === normPrevNisn)
                  );
                  if (matched) return matched;
                }
                return mappedUsers[0] || prev;
              });
            }
            if (Array.isArray(d.peserta_ujian)) {
              const cleanPU = d.peserta_ujian.filter(isRowNotEmpty).map(normalizeRowKeys);
              mergePesertaUjianRecords(cleanPU, true);
              safeSetStorage('skarida_db_peserta_ujian', JSON.stringify(cleanPU));
            }
            if (Array.isArray(d.sesi_ujian)) {
              const pktMap = {};
              (d.paket_soal || []).filter(isRowNotEmpty).forEach(rawP => {
                const p = normalizeRowKeys(rawP);
                pktMap[p.id_paket || p.id] = p;
              });
              const mappedSesi = d.sesi_ujian.filter(isRowNotEmpty).map((rawS, idx) => {
                const s = normalizeRowKeys(rawS);
                let parsedIds = [];
                try { parsedIds = JSON.parse(s.peserta_ids_json || '[]'); } catch (_) {}
                const pkt = pktMap[s.id_paket] || {};
                return {
                  ...s,
                  id_sesi: s.id_sesi || s.id || idx + 501,
                  mata_pelajaran: String(pkt.mata_pelajaran || pkt.mapel || s.nama_sesi_spesifik || 'Mata Pelajaran Ujian').trim(),
                  tingkat_paket: String(pkt.tingkat || pkt.kelas || '').trim().toUpperCase(),
                  jurusan: String(pkt.jurusan || 'Semua Jurusan').trim(),
                  nama_sesi_spesifik: String(s.nama_sesi_spesifik || 'Sesi Ujian CBT').trim(),
                  zona_waktu: String(s.zona_waktu || 'WIB').trim(),
                  waktu_buka: String(s.waktu_buka || '').trim().replace(/^'/, ''),
                  waktu_tutup: String(s.waktu_tutup || '').trim().replace(/^'/, ''),
                  durasi_menit: Number(s.durasi_menit) || 60,
                  minimal_menit_submit: Number(s.minimal_menit_submit) || 15,
                  limit_soal_pg: s.limit_soal_pg !== undefined && s.limit_soal_pg !== '' ? Number(s.limit_soal_pg) : undefined,
                  limit_soal_uraian: s.limit_soal_uraian !== undefined && s.limit_soal_uraian !== '' ? Number(s.limit_soal_uraian) : undefined,
                  is_acak_soal: parseBool(s.is_acak_soal, true),
                  is_proctoring_active: parseBool(s.is_proctoring_active, true),
                  token: String(s.token || '').trim(),
                  require_token: parseBool(s.require_token, true),
                  peserta_ids: Array.isArray(s.peserta_ids) ? s.peserta_ids : parsedIds
                };
              });
              setSesiListState(mappedSesi);
              safeSetStorage('skarida_db_sesi', JSON.stringify(mappedSesi));
            }
            if (Array.isArray(d.master_soal)) {
              const mappedSoal = d.master_soal.filter(isRowNotEmpty).map((rawQ, idx) => {
                const q = normalizeRowKeys(rawQ);
                const origOpsi = Array.isArray(q.opsi) ? [...q.opsi] : [String(q.opsi_a ?? ''), String(q.opsi_b ?? ''), String(q.opsi_c ?? ''), String(q.opsi_d ?? ''), String(q.opsi_e ?? '')];
                const origGbr = Array.isArray(q.gambar_opsi) ? [...q.gambar_opsi] : [q.gambar_a || q.gambar_opsi_a || null, q.gambar_b || q.gambar_opsi_b || null, q.gambar_c || q.gambar_opsi_c || null, q.gambar_d || q.gambar_opsi_d || null, q.gambar_e || q.gambar_opsi_e || null];
                const origPrev = Array.isArray(q.preview_gambar_opsi) ? [...q.preview_gambar_opsi] : origGbr.map(g => (String(g || '').startsWith('data:image') || String(g || '').startsWith('http')) ? String(g) : '');
                const origKey = String(q.kunci_jawaban || 'A').trim().toUpperCase();
                const mainFile = q.file_gambar_soal || null;
                const mainPrev = q.preview_gambar_soal || ((String(mainFile || '').startsWith('data:image') || String(mainFile || '').startsWith('http')) ? String(mainFile) : '');
                return {
                  ...q,
                  id_soal: q.id_soal || q.id || idx + 301,
                  tipe_soal: String(q.tipe_soal || 'PG').trim(),
                  kategori_kognitif: String(q.kategori_kognitif || 'MoTS').trim(),
                  teks_pertanyaan: String(q.teks_pertanyaan || '').trim(),
                  jumlah_opsi: Number(q.jumlah_opsi) || 4,
                  bobot_skor: Number(q.bobot_skor) || 2,
                  kunci_jawaban: origKey,
                  orig_kunci_jawaban: origKey,
                  file_gambar_soal: mainFile,
                  preview_gambar_soal: mainPrev,
                  opsi: origOpsi,
                  orig_opsi: origOpsi,
                  gambar_opsi: origGbr,
                  orig_gambar_opsi: origGbr,
                  preview_gambar_opsi: origPrev,
                  orig_preview_gambar_opsi: origPrev
                };
              });
              setSoalBankState(mappedSoal);
              safeSetStorage('skarida_db_soal', JSON.stringify(mappedSoal));
            }
          }
        } catch (_) {}
        setIsRefreshingSchedule(false);
      };

      useEffect(() => {
        loadScheduleAndDatabase();
      }, [scriptUrl]);

      // Fungsi mendapatkan status ujian peserta pada suatu sesi (menggabungkan data Server & LocalStorage)
      const getParticipantSessionStatus = (sesiId, userId = loggedInUser?.id_user) => {
        if (!sesiId || !userId) return { status: 'belum', savedLocal: null, serverRecord: null };
        const key = `${sesiId}_${userId}`;
        const serverRecord = pesertaUjianMap[key] || null;
        let savedLocal = null;
        try {
          const raw = safeGetStorage(getLocalExamKey(sesiId, userId), '');
          if (raw) savedLocal = JSON.parse(raw);
        } catch (_) {}

        // Jika Admin/Guru telah melakukan "Reset Ujian" (baris di peserta_ujian dihapus atau berstatus 'belum'),
        // bersihkan cache selesai/dihentikan lokal agar peserta dapat langsung mengulang ujian dari awal!
        if ((dbConnected && !serverRecord) || (serverRecord && serverRecord.status_pengerjaan === 'belum')) {
          if (savedLocal && (savedLocal.status_pengerjaan === 'selesai' || savedLocal.status_pengerjaan === 'dihentikan_sistem')) {
            try {
              localStorage.removeItem(getLocalExamKey(sesiId, userId));
              localStorage.removeItem(getActivePointerKey(userId));
            } catch (_) {}
            savedLocal = null;
          }
          if (!savedLocal) {
            return { status: 'belum', savedLocal: null, serverRecord: null };
          }
        }

        // Jika server menyatakan dihentikan_sistem atau selesai, prioritaskan status server
        if (serverRecord?.status_pengerjaan === 'dihentikan_sistem') {
          return { status: 'dihentikan_sistem', savedLocal, serverRecord };
        }
        if (serverRecord?.status_pengerjaan === 'selesai') {
          return { status: 'selesai', savedLocal, serverRecord };
        }
        // Jika baru di-reset oleh proktor di server (status sedang_mengerjakan dan pelanggaran 0), izinkan lanjutkan
        if (serverRecord?.status_pengerjaan === 'sedang_mengerjakan' && Number(serverRecord?.jumlah_pelanggaran) === 0 && savedLocal?.status_pengerjaan === 'dihentikan_sistem') {
          savedLocal.status_pengerjaan = 'sedang_mengerjakan';
          savedLocal.strikes = 0;
          safeSetStorage(getLocalExamKey(sesiId, userId), JSON.stringify(savedLocal));
          return { status: 'sedang_mengerjakan', savedLocal, serverRecord };
        }
        if (savedLocal?.status_pengerjaan === 'selesai' || savedLocal?.status_pengerjaan === 'dihentikan_sistem') {
          return { status: savedLocal.status_pengerjaan, savedLocal, serverRecord };
        }
        if (savedLocal?.status_pengerjaan === 'sedang_mengerjakan' || serverRecord?.status_pengerjaan === 'sedang_mengerjakan') {
          return { status: 'sedang_mengerjakan', savedLocal, serverRecord };
        }
        return { status: 'belum', savedLocal, serverRecord };
      };

      // Otomatis pulihkan halaman soal jika peserta me-refresh browser saat sedang mengerjakan ujian
      useEffect(() => {
        if (hasRestoredSessionRef.current) return;
        if (!loggedInUser?.id_user) return;
        const activePointer = safeGetStorage(getActivePointerKey(loggedInUser.id_user), '');
        if (!activePointer) return;

        try {
          const rawSaved = safeGetStorage(getLocalExamKey(activePointer, loggedInUser.id_user), '');
          if (!rawSaved) return;
          const saved = JSON.parse(rawSaved);
          if (saved && saved.status_pengerjaan === 'sedang_mengerjakan' && Array.isArray(saved.examQuestions) && saved.examQuestions.length > 0) {
            const serverCheck = pesertaUjianMap[`${activePointer}_${loggedInUser.id_user}`];
            if (serverCheck && (serverCheck.status_pengerjaan === 'selesai' || serverCheck.status_pengerjaan === 'dihentikan_sistem')) {
              return;
            }
            hasRestoredSessionRef.current = true;
            const now = Date.now();
            const endMs = Number(saved.examEndTimeMs) || (now + 3600 * 1000);
            const startMs = Number(saved.examStartTimeMs) || (now - 60000);
            const remSec = Math.max(0, Math.floor((endMs - now) / 1000));
            const elapMin = Math.max(0, Math.floor((now - startMs) / 60000));

            setActivePesertaUjianId(saved.id_peserta_ujian || `PU-${saved.id_sesi}-${loggedInUser.id_user}`);
            setActiveSesiObj(saved.activeSesiObj);
            setExamQuestions(saved.examQuestions);
            setCurrentIndex(Math.min(saved.examQuestions.length - 1, Math.max(0, Number(saved.currentIndex) || 0)));
            setAnswers(saved.answers || {});
            setDoubtful(saved.doubtful || {});
            setStrikes(Number(saved.strikes) || 0);
            setViolationLogs(saved.violationLogs || []);
            setWaktuMulaiStr(saved.waktuMulaiStr || getWaktuIndonesiaString());
            setExamStartTimeMs(startMs);
            setExamEndTimeMs(endMs);
            setRemainingSeconds(remSec);
            setElapsedMinutes(elapMin);
            isSubmittingExamRef.current = false;
            setScreen('exam');
            triggerToast('Sesi Dilanjutkan Otomatis', `Kembali ke Soal No. ${(Number(saved.currentIndex) || 0) + 1}. Jawaban & sisa waktu Anda tetap aman.`);
          }
        } catch (_) {}
      }, [loggedInUser, pesertaUjianMap]);

      // Simpan otomatis perubahan index soal, jawaban, ragu-ragu, dan strike ke localStorage
      useEffect(() => {
        if (screen === 'exam' && activeSesiObj && loggedInUser?.id_user) {
          saveLocalExamProgress({
            currentIndex,
            answers,
            doubtful,
            strikes,
            violationLogs
          });
        }
      }, [screen, currentIndex, answers, doubtful, strikes, violationLogs]);

      const computeRealExamStats = (currentAnswers, questionsList = examQuestions) => {
        let skorPG = 0;
        let jmlBenarPG = 0;
        let jmlSalahPG = 0;
        let jmlTerjawab = 0;
        const jawabanPgMap = {};
        const detailUraianMap = {};
        let firstUraianText = '';

        (questionsList || []).forEach((q) => {
          const ans = currentAnswers[q.nomor_urut];
          if (ans !== undefined && String(ans).trim() !== '') {
            jmlTerjawab += 1;
          }
          if (q.tipe_soal === 'PG') {
            const picked = String(ans || '').trim().toUpperCase();
            if (picked) {
              const pickedIdx = picked.charCodeAt(0) - 65;
              const originalOptionLetter = (Array.isArray(q.opsi_original_letters) && q.opsi_original_letters[pickedIdx])
                ? q.opsi_original_letters[pickedIdx]
                : picked;
              jawabanPgMap[q.id_soal] = originalOptionLetter;

              if (picked === String(q.kunci_jawaban || 'A').trim().toUpperCase()) {
                jmlBenarPG += 1;
                skorPG += Number(q.bobot_skor) || 2;
              } else {
                jmlSalahPG += 1;
              }
            } else {
              // Tandai bahwa soal PG ini termasuk dalam kuota soal yang disajikan pada sesi peserta
              jawabanPgMap[q.id_soal] = '';
            }
          } else {
            const essayTxt = String(ans || '').trim();
            if (!firstUraianText && essayTxt) firstUraianText = essayTxt;
            detailUraianMap[q.id_soal] = {
              id_soal: q.id_soal,
              jawaban: essayTxt,
              skor: 0
            };
          }
        });

        return {
          skorPG,
          jmlBenarPG,
          jmlSalahPG,
          jmlTerjawab,
          jawabanPgMap,
          detailUraianMap,
          firstUraianText
        };
      };

      // Fungsi Terpusat Eksekusi Submit Ujian (Normal Submit, Waktu Habis, Strike ke-4, maupun Force Submit Admin)
      const handleExecuteSubmitExam = (statusAkhir = 'selesai', reasonText = 'Dikumpulkan secara sah oleh peserta', customStrikeCount = strikes) => {
        if (isSubmittingExamRef.current) return;
        isSubmittingExamRef.current = true;

        const endNow = getWaktuIndonesiaString();
        setWaktuSelesaiStr(endNow);
        setShowSubmitConfirm(false);
        setShowNavDrawer(false);
        setActiveStrikePopup(null);
        setIsScreenObscured(false);

        const stats = computeRealExamStats(answers, examQuestions);
        const sId = activeSesiObj?.id_sesi;
        const uId = loggedInUser?.id_user;
        const puId = activePesertaUjianId || `PU-${sId}-${uId}`;

        // 1. Kunci status di localStorage agar tidak bisa dikerjakan ulang
        if (sId && uId) {
          saveLocalExamProgress({
            status_pengerjaan: statusAkhir,
            waktuSelesaiStr: endNow,
            strikes: customStrikeCount
          });
          try {
            localStorage.removeItem(getActivePointerKey(uId));
          } catch (_) {}

          const updatedPURecord = {
            id_peserta_ujian: puId,
            id_sesi: sId,
            id_user: uId,
            waktu_mulai: waktuMulaiStr,
            waktu_selesai: endNow,
            durasi_aktual: `${Math.max(1, elapsedMinutes)} Menit`,
            sisa_detik: 0,
            status_pengerjaan: statusAkhir,
            jumlah_pelanggaran: customStrikeCount,
            jml_terjawab: stats.jmlTerjawab,
            jml_benar_pg: stats.jmlBenarPG,
            jml_salah_pg: stats.jmlSalahPG,
            skor_pg: stats.skorPG,
            skor_uraian: 0,
            nilai_total: stats.skorPG,
            jawaban_pg_siswa: stats.jawabanPgMap,
            jawaban_pg_siswa_json: JSON.stringify(stats.jawabanPgMap),
            detail_uraian: stats.detailUraianMap,
            detail_skor_uraian_json: JSON.stringify(stats.detailUraianMap),
            jawaban_uraian_teks: stats.firstUraianText,
            user_agent_device: navigator.userAgent
          };

          setPesertaUjianMap(prev => ({
            ...prev,
            [`${sId}_${uId}`]: updatedPURecord
          }));

          try {
            const cachedPUList = JSON.parse(safeGetStorage('skarida_db_peserta_ujian', '[]'));
            const existsIdx = cachedPUList.findIndex(item => String(item.id_peserta_ujian) === String(puId) || (String(item.id_sesi) === String(sId) && String(item.id_user) === String(uId)));
            if (existsIdx >= 0) {
              cachedPUList[existsIdx] = { ...cachedPUList[existsIdx], ...updatedPURecord };
            } else {
              cachedPUList.push(updatedPURecord);
            }
            safeSetStorage('skarida_db_peserta_ujian', JSON.stringify(cachedPUList));
          } catch (_) {}
        }

        // 2. Kirim ke Google Sheets
        if (scriptUrl) {
          fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            credentials: 'omit',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'submitExam',
              id_peserta_ujian: puId,
              id_sesi: sId,
              id_user: uId,
              waktu_mulai: waktuMulaiStr,
              status_akhir: statusAkhir,
              durasi_aktual: `${Math.max(1, elapsedMinutes)} Menit`,
              jumlah_pelanggaran: customStrikeCount,
              jml_terjawab: stats.jmlTerjawab,
              jml_benar_pg: stats.jmlBenarPG,
              jml_salah_pg: stats.jmlSalahPG,
              skor_pg: stats.skorPG,
              skor_uraian: 0,
              jawaban_pg_siswa: stats.jawabanPgMap,
              detail_uraian: stats.detailUraianMap,
              jawaban_uraian_teks: stats.firstUraianText,
              user_agent: navigator.userAgent
            })
          }).catch(() => {});
        }

        setFinishSummary({
          status: statusAkhir,
          reason: reasonText,
          strikes: customStrikeCount,
          skorPG: stats.skorPG,
          jmlTerjawab: stats.jmlTerjawab,
          totalSoal: examQuestions.length
        });
        setScreen('result');

        try {
          if (document.fullscreenElement && document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
          }
        } catch (_) {}
      };

      // Timer Hitung Mundur Real-Time berbasis Timestamp Target (Anti-Reset saat Refresh & Auto Force Submit saat 00:00:00)
      useEffect(() => {
        if (screen !== 'exam' || !examEndTimeMs) return;
        const t = setInterval(() => {
          const now = Date.now();
          const remSec = Math.max(0, Math.floor((examEndTimeMs - now) / 1000));
          const startMs = examStartTimeMs || (now - 60000);
          const elapMin = Math.max(0, Math.floor((now - startMs) / 60000));

          setRemainingSeconds(remSec);
          setElapsedMinutes(elapMin);

          if (remSec <= 0) {
            clearInterval(t);
            triggerToast('Waktu Ujian Habis!', 'Durasi waktu pengerjaan telah berakhir. Jawaban otomatis dikumpulkan.', 'danger');
            handleExecuteSubmitExam('selesai', 'Durasi Waktu Ujian Habis (00:00:00) — Auto Force Submit Sistem');
          }
        }, 1000);
        return () => clearInterval(t);
      }, [screen, examEndTimeMs, examStartTimeMs, answers, examQuestions, strikes]);

      // Polling & Listener Real-Time dari Command Center (Deteksi Force Submit oleh Admin/Proktor)
      useEffect(() => {
        if (screen !== 'exam' || !activeSesiObj || !loggedInUser?.id_user) return;
        const sId = activeSesiObj.id_sesi;
        const uId = loggedInUser.id_user;
        const puId = activePesertaUjianId || `PU-${sId}-${uId}`;

        const checkAdminForceSubmitFromStorage = () => {
          try {
            const cachedPU = JSON.parse(safeGetStorage('skarida_db_peserta_ujian', '[]'));
            const match = cachedPU.find(p => String(p.id_peserta_ujian) === String(puId) || (String(p.id_sesi) === String(sId) && String(p.id_user) === String(uId)));
            if (match && match.status_pengerjaan === 'dihentikan_sistem') {
              triggerToast('Dihentikan Pengawas!', 'Proktor telah mengeksekusi Force Submit pada sesi ujian Anda.', 'danger');
              handleExecuteSubmitExam('dihentikan_sistem', 'Dihentikan Paksa (Force Submit) oleh Pengawas / Command Center', Number(match.jumlah_pelanggaran) || strikes);
            }
          } catch (_) {}
        };

        window.addEventListener('storage', checkAdminForceSubmitFromStorage);

        const pollInterval = setInterval(async () => {
          checkAdminForceSubmitFromStorage();
          if (!scriptUrl) return;
          try {
            const res = await fetch(`${scriptUrl}?action=read&sheet=peserta_ujian`, { credentials: 'omit', redirect: 'follow' });
            const json = await res.json();
            if (json && json.status === 'success' && Array.isArray(json.data)) {
              safeSetStorage('skarida_db_peserta_ujian', JSON.stringify(json.data));
              const found = json.data.find(p => String(p.id_peserta_ujian) === String(puId) || (String(p.id_sesi) === String(sId) && String(p.id_user) === String(uId)));
              if (found && found.status_pengerjaan === 'dihentikan_sistem') {
                triggerToast('Dihentikan Pengawas!', 'Proktor telah mengeksekusi Force Submit pada sesi ujian Anda.', 'danger');
                handleExecuteSubmitExam('dihentikan_sistem', 'Dihentikan Paksa (Force Submit) oleh Pengawas / Command Center', Number(found.jumlah_pelanggaran) || strikes);
              }
            }
          } catch (_) {}
        }, 4500);

        return () => {
          window.removeEventListener('storage', checkAdminForceSubmitFromStorage);
          clearInterval(pollInterval);
        };
      }, [screen, activeSesiObj, loggedInUser, activePesertaUjianId, answers, examQuestions, strikes, scriptUrl]);

      // Mulai atau Lanjutkan Sesi Ujian
      const handleStartOrResumeExamSession = async (isResumeMode = false, targetSesiOverride = null) => {
        const sesiTarget = targetSesiOverride || selectedSesi;
        if (!sesiTarget) return;

        const uId = loggedInUser.id_user;
        const sId = sesiTarget.id_sesi;
        const puStatusInfo = getParticipantSessionStatus(sId, uId);

        // Cegah pengerjaan ulang jika sudah selesai atau dihentikan sistem
        if (puStatusInfo.status === 'selesai') {
          setTokenError('Anda sudah menyelesaikan sesi ujian ini. Tidak dapat mengerjakan ulang.');
          triggerToast('Sesi Terkunci', 'Ujian ini sudah selesai Anda kerjakan.', 'danger');
          return;
        }
        if (puStatusInfo.status === 'dihentikan_sistem') {
          setTokenError('Sesi ujian Anda telah dihentikan oleh sistem/pengawas. Hubungi Proktor untuk Reset Sesi.');
          triggerToast('Sesi Dihentikan', 'Hubungi Proktor jika ingin mereset sesi.', 'danger');
          return;
        }

        // Jika melanjutkan sesi yang sudah berjalan (Resume), pulihkan langsung tanpa acak ulang & tanpa reset waktu
        if (isResumeMode || (puStatusInfo.savedLocal && puStatusInfo.savedLocal.status_pengerjaan === 'sedang_mengerjakan' && Array.isArray(puStatusInfo.savedLocal.examQuestions) && puStatusInfo.savedLocal.examQuestions.length > 0)) {
          const saved = puStatusInfo.savedLocal;
          if (saved && Array.isArray(saved.examQuestions) && saved.examQuestions.length > 0) {
            const now = Date.now();
            const durMs = (Number(sesiTarget.durasi_menit) || 60) * 60 * 1000;
            const startMs = Number(saved.examStartTimeMs) || now;
            const schedInfo = evaluateStatusJadwalSesi(sesiTarget, now);
            const rawEndMs = Number(saved.examEndTimeMs) || (startMs + durMs);
            const endMs = schedInfo.tutupDateMs ? Math.min(rawEndMs, schedInfo.tutupDateMs) : rawEndMs;
            const remSec = Math.max(0, Math.floor((endMs - now) / 1000));
            const elapMin = Math.max(0, Math.floor((now - startMs) / 60000));

            // Cari nomor soal pertama yang belum dijawab, atau kembali ke currentIndex terakhir
            const savedAns = saved.answers || {};
            const firstUnansweredIdx = saved.examQuestions.findIndex(q => !savedAns[q.nomor_urut]);
            const resumeIdx = firstUnansweredIdx >= 0 ? firstUnansweredIdx : Math.min(saved.examQuestions.length - 1, Number(saved.currentIndex) || 0);

            setActivePesertaUjianId(saved.id_peserta_ujian || `PU-${sId}-${uId}`);
            setActiveSesiObj(sesiTarget);
            setExamQuestions(saved.examQuestions);
            setCurrentIndex(resumeIdx);
            setAnswers(savedAns);
            setDoubtful(saved.doubtful || {});
            setStrikes(Number(saved.strikes) || 0);
            setViolationLogs(saved.violationLogs || []);
            setWaktuMulaiStr(saved.waktuMulaiStr || getWaktuIndonesiaString());
            setExamStartTimeMs(startMs);
            setExamEndTimeMs(endMs);
            setRemainingSeconds(remSec);
            setElapsedMinutes(elapMin);
            isSubmittingExamRef.current = false;
            setSelectedSesi(null);
            safeSetStorage(getActivePointerKey(uId), String(sId));
            setScreen('exam');

            enterFullscreenOneScreen();

            triggerToast('Melanjutkan Ujian', `Melanjutkan pada Soal No. ${resumeIdx + 1}. Sisa waktu & jawaban sebelumnya telah dipulihkan.`);
            return;
          }
        }

        // Validasi Token untuk mulai baru
        if (sesiTarget.require_token && tokenInput.trim().toUpperCase() !== String(sesiTarget.token).toUpperCase()) {
          setTokenError('Token ujian tidak sesuai! Silakan minta token aktif kepada Pengawas.');
          return;
        }
        if (!agreedIntegrity) {
          setTokenError('Anda wajib menyetujui Pakta Integritas ujian.');
          return;
        }

        const soalPaket = soalBankState.filter(q => String(q.id_paket) === String(sesiTarget.id_paket));
        const sourceQuestions = soalPaket.length > 0 ? soalPaket : soalBankState;
        const isRandomActive = sesiTarget.is_acak_soal !== false;

        // Susun & acak soal + posisi opsi A-E secara 1-to-1 serta tarik sejumlah limit_soal_pg & limit_soal_uraian
        const ordered = buildOrderedExamQuestions(
          sourceQuestions,
          isRandomActive,
          sesiTarget.limit_soal_pg,
          sesiTarget.limit_soal_uraian
        );

        const nowMs = Date.now();
        const nowStr = getWaktuIndonesiaString();
        const durSec = (Number(sesiTarget.durasi_menit) || 60) * 60;
        const schedInfo = evaluateStatusJadwalSesi(sesiTarget, nowMs);
        const rawEndMs = nowMs + durSec * 1000;
        const finalEndMs = schedInfo.tutupDateMs ? Math.min(rawEndMs, schedInfo.tutupDateMs) : rawEndMs;
        const initialRemSec = Math.max(1, Math.floor((finalEndMs - nowMs) / 1000));
        const puId = `PU-${sId}-${uId}`;

        setActivePesertaUjianId(puId);
        setActiveSesiObj(sesiTarget);
        setWaktuMulaiStr(nowStr);
        setExamStartTimeMs(nowMs);
        setExamEndTimeMs(finalEndMs);
        setExamQuestions(ordered);
        setCurrentIndex(0);
        setAnswers({});
        setDoubtful({});
        setStrikes(0);
        setViolationLogs([]);
        setRemainingSeconds(initialRemSec);
        setElapsedMinutes(0);
        isSubmittingExamRef.current = false;
        setSelectedSesi(null);

        safeSetStorage(getActivePointerKey(uId), String(sId));
        saveLocalExamProgress({
          id_sesi: sId,
          id_user: uId,
          id_peserta_ujian: puId,
          activeSesiObj: sesiTarget,
          examQuestions: ordered,
          currentIndex: 0,
          answers: {},
          doubtful: {},
          strikes: 0,
          violationLogs: [],
          waktuMulaiStr: nowStr,
          examStartTimeMs: nowMs,
          examEndTimeMs: finalEndMs,
          status_pengerjaan: 'sedang_mengerjakan'
        });

        setPesertaUjianMap(prev => ({
          ...prev,
          [`${sId}_${uId}`]: {
            id_peserta_ujian: puId,
            id_sesi: sId,
            id_user: uId,
            waktu_mulai: nowStr,
            status_pengerjaan: 'sedang_mengerjakan',
            jumlah_pelanggaran: 0,
            sisa_detik: initialRemSec
          }
        }));

        setScreen('exam');

        enterFullscreenOneScreen();

        if (scriptUrl) {
          fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            credentials: 'omit',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'startExam',
              id_sesi: sId,
              id_user: uId,
              input_token: tokenInput,
              user_agent: navigator.userAgent
            })
          }).catch(() => {});
        }
      };

      // Handler Simpan Jawaban Langsung (Auto-Save ke LocalStorage & Google Sheets setiap siswa memilih opsi / mengetik)
      const handleSelectOrTypeAnswer = (questionObj, newValue) => {
        if (!questionObj) return;
        const nomor = questionObj.nomor_urut;
        const updatedAnswers = { ...answers, [nomor]: newValue };
        setAnswers(updatedAnswers);

        saveLocalExamProgress({
          answers: updatedAnswers,
          currentIndex
        });

        if (scriptUrl && activePesertaUjianId) {
          const statsNow = computeRealExamStats(updatedAnswers, examQuestions);
          const pickedIdx = String(newValue || '').trim().toUpperCase().charCodeAt(0) - 65;
          const origLetter = (questionObj.tipe_soal === 'PG' && Array.isArray(questionObj.opsi_original_letters) && questionObj.opsi_original_letters[pickedIdx])
            ? questionObj.opsi_original_letters[pickedIdx]
            : String(newValue || '');

          fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            credentials: 'omit',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'saveAnswer',
              id_peserta_ujian: activePesertaUjianId,
              id_soal: questionObj.id_soal,
              nomor_urut_tampil: nomor,
              tipe_soal: questionObj.tipe_soal,
              kategori_kognitif: questionObj.kategori_kognitif || 'MoTS',
              jawaban_pg: questionObj.tipe_soal === 'PG' ? origLetter : '',
              jawaban_uraian: questionObj.tipe_soal !== 'PG' ? newValue : '',
              ragu_ragu: Boolean(doubtful[nomor]),
              skor_didapat: (questionObj.tipe_soal === 'PG' && String(newValue).toUpperCase() === String(questionObj.kunci_jawaban).toUpperCase())
                ? (Number(questionObj.bobot_skor) || 2)
                : 0,
              sisa_detik: remainingSeconds,
              jawaban_pg_siswa: statsNow.jawabanPgMap
            })
          }).catch(() => {});
        }
      };

      // Handler Picu Pelanggaran Anti-Cheat (3-Strike Penalty -> Pelanggaran ke-4 Otomatis Force Submit)
      const handleTriggerViolation = (type) => {
        if (screen !== 'exam') return;
        if (isSafeRefreshingRef.current) return;
        if (activeSesiObj && activeSesiObj.is_proctoring_active === false) return;

        // Sensor & hitamkan layar soal seketika (0ms) agar tangkapan screenshot tidak merekam soal
        setIsScreenObscured(true);

        const nowMs = Date.now();
        // Debounce 2.5 detik agar 1 kejadian pindah tab tidak memicu blur + visibilitychange bersamaan
        if (nowMs - lastViolationEpochRef.current < 2500) return;
        lastViolationEpochRef.current = nowMs;

        const nextStrike = strikes + 1;
        const newLogItem = {
          id_log: nowMs,
          strike_ke: nextStrike,
          jenis_pelanggaran: type,
          waktu_kejadian: getWaktuIndonesiaString()
        };
        const updatedLogs = [...violationLogs, newLogItem];

        setStrikes(nextStrike);
        setViolationLogs(updatedLogs);
        saveLocalExamProgress({
          strikes: nextStrike,
          violationLogs: updatedLogs
        });

        const statsNow = computeRealExamStats(answers, examQuestions);

        if (scriptUrl) {
          fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            credentials: 'omit',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'logViolation',
              id_peserta_ujian: activePesertaUjianId || `PU-${activeSesiObj?.id_sesi}-${loggedInUser?.id_user}`,
              id_sesi: activeSesiObj?.id_sesi || sesiListState[0]?.id_sesi || '',
              id_user: loggedInUser.id_user,
              strike_ke: nextStrike,
              jenis_pelanggaran: type,
              skor_pg: statsNow.skorPG,
              user_agent: navigator.userAgent
            })
          }).catch(() => {});
        }

        if (nextStrike >= 4) {
          triggerToast('Batas Pelanggaran Terlampaui!', `Pelanggaran ke-4 (${type}). Ujian otomatis dihentikan!`, 'danger');
          handleExecuteSubmitExam(
            'dihentikan_sistem',
            `Auto Force Submit: Melampaui Batas Peringatan Ke-3 (${type})`,
            nextStrike
          );
        } else {
          setActiveStrikePopup({ count: nextStrike, type, cooldown: 3 });
        }
      };

      // Handler Peringatan Screenshot (HANYA Memunculkan Peringatan & Sensor Layar TANPA Menghitung Sebagai Pelanggaran / Strike)
      const handleTriggerScreenshotWarning = (sourceLabel = 'Percobaan Screenshot / Tangkapan Layar') => {
        if (screen !== 'exam') return;
        if (isSafeRefreshingRef.current) return;

        // Hitamkan & blur-kan layar soal seketika saat terdeteksi tombol/gestur screenshot
        setIsScreenObscured(true);
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText('SKARIDA CBT — DILARANG SCREENSHOT SOAL & JAWABAN').catch(() => {});
          }
        } catch (_) {}

        setScreenshotWarningPopup({
          type: sourceLabel,
          time: getWaktuIndonesiaString()
        });
      };

      // Cooldown 3 detik pada Popup Peringatan Pelanggaran
      useEffect(() => {
        if (!activeStrikePopup || activeStrikePopup.cooldown <= 0) return;
        const cdTimer = setInterval(() => {
          setActiveStrikePopup(prev => {
            if (!prev) return null;
            return { ...prev, cooldown: Math.max(0, (prev.cooldown || 0) - 1) };
          });
        }, 1000);
        return () => clearInterval(cdTimer);
      }, [activeStrikePopup]);

      // Sensor Proteksi Anti-Kecurangan & Anti-Screenshot (Kompatibel Penuh dengan Tablet & Smartphone)
      useEffect(() => {
        if (screen !== 'exam') return;

        const onVisibilityChange = () => {
          if (document.hidden && !isSafeRefreshingRef.current) {
            setIsScreenObscured(true);
            handleTriggerViolation('Pindah Tab Browser / Minimize Aplikasi Ujian');
          }
        };

        const onWindowBlur = () => {
          if (!isSafeRefreshingRef.current) {
            setIsScreenObscured(true);
            setTimeout(() => {
              try { window.focus(); } catch (_) {}
            }, 50);
            handleTriggerViolation('Membuka / Membalas Popup Notifikasi Chat (WA/Pesan) atau Floating App');
          }
        };

        const baseViewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        const onVisualViewportResize = () => {
          if (isSafeRefreshingRef.current || !window.visualViewport) return;
          const currentVh = window.visualViewport.height;
          const heightDrop = baseViewportHeight - currentVh;
          const activeTag = (document.activeElement && document.activeElement.tagName) ? document.activeElement.tagName.toUpperCase() : '';
          if (heightDrop > 140 && activeTag !== 'TEXTAREA' && activeTag !== 'INPUT') {
            setIsScreenObscured(true);
            handleTriggerViolation('Membalas Chat WA / Mengetik pada Popup Notifikasi Pesan Saat Ujian');
          }
        };

        const onFullscreenChange = () => {
          if (!document.fullscreenElement && !document.webkitFullscreenElement && !isSafeRefreshingRef.current) {
            setIsFullscreenLocked(false);
            setIsScreenObscured(true);
            handleTriggerViolation('Keluar dari Mode Layar Penuh (Fullscreen 1 Layar)');
          }

        const onTouchStartSensor = (e) => {
          if (!e.touches || e.touches.length === 0) return;

          // Deteksi Gestur Screenshot 3 Jari -> Munculkan Peringatan & Blur Layar (Tanpa Pelanggaran)
          if (e.touches.length >= 3) {
            if (e.cancelable) e.preventDefault();
            handleTriggerScreenshotWarning('Percobaan Screenshot Gestur 3 Jari di Layar Tablet/HP');
            return;
          }

          if (e.touches.length === 1) {
            const t = e.touches[0];
            touchGestureRef.current = {
              startY: t.clientY,
              startX: t.clientX,
              startTime: Date.now(),
              isTopEdgePull: t.clientY <= 18
            };
          }
        };

        const onTouchMoveSensor = (e) => {
          if (!e.touches || e.touches.length === 0) return;

          // Gestur Screenshot Swipe 3 Jari -> HANYA PERINGATAN (Tanpa tambah pelanggaran)
          if (e.touches.length >= 3) {
            if (e.cancelable) e.preventDefault();
            handleTriggerScreenshotWarning('Percobaan Screenshot Swipe 3 Jari di Layar Tablet/HP');
            return;
          }

          const g = touchGestureRef.current;
          if (g.isTopEdgePull && e.touches.length === 1) {
            const t = e.touches[0];
            const deltaY = t.clientY - g.startY;
            const deltaX = Math.abs(t.clientX - g.startX);
            // Hanya jika menarik dari tepi paling atas layar (<= 18px) ke bawah sejauh > 90px (membuka bar notifikasi sistem)
            if (deltaY > 90 && deltaY > deltaX * 2) {
              g.isTopEdgePull = false;
              setIsScreenObscured(true);
              handleTriggerViolation('Menarik Panel Notifikasi Atas Saat Ujian Berlangsung');
            }
          }
        };

        const onKeyDownSensor = (e) => {
          const keyName = String(e.key || '');
          const keyCodeNum = Number(e.keyCode || e.which || 0);
          const isHardwareVolumeOrCapture =
            keyName === 'PrintScreen' ||
            keyName === 'VolumeDown' ||
            keyName === 'VolumeUp' ||
            keyName === 'AudioVolumeDown' ||
            keyName === 'AudioVolumeUp' ||
            keyName === 'Power' ||
            keyCodeNum === 44 ||
            keyCodeNum === 174 ||
            keyCodeNum === 175 ||
            (e.metaKey && e.shiftKey && ['3', '4', '5', 's'].includes(keyName.toLowerCase())) ||
            (e.ctrlKey && e.shiftKey && ['s'].includes(keyName.toLowerCase()));

          // Jika tombol fisik Volume / Screenshot ditekan -> Langsung Hitamkan & Blur-kan Layar + Munculkan Peringatan (Tanpa Pelanggaran)
          if (isHardwareVolumeOrCapture) {
            setIsScreenObscured(true);
            handleTriggerScreenshotWarning(`Tombol Fisik Perangkat / Screenshot (${keyName || 'Volume/Power'})`);
            return;
          }

          if (
            keyName === 'F12' ||
            (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(keyName.toLowerCase())) ||
            (e.ctrlKey && ['c', 'v', 'x', 'u', 'p', 's'].includes(keyName.toLowerCase())) ||
            (e.altKey && keyName === 'Tab')
          ) {
            e.preventDefault();
            setIsScreenObscured(true);
            handleTriggerViolation(`Tombol Pintasan Terlarang (${e.ctrlKey ? 'Ctrl+' : ''}${keyName})`);
          }
        };

        const onKeyUpSensor = (e) => {
          const keyName = String(e.key || '');
          const keyCodeNum = Number(e.keyCode || e.which || 0);
          if (
            keyName === 'PrintScreen' ||
            keyName === 'VolumeDown' ||
            keyName === 'AudioVolumeDown' ||
            keyCodeNum === 44 ||
            keyCodeNum === 174
          ) {
            setIsScreenObscured(true);
            handleTriggerScreenshotWarning('Tombol Fisik Screenshot / Volume Perangkat');
          }
        };

        const onBeforePrint = () => {
          setIsScreenObscured(true);
          handleTriggerScreenshotWarning('Percobaan Cetak / Simpan Halaman Soal');
        };

        const onCopyPaste = (e) => {
          e.preventDefault();
          handleTriggerViolation('Percobaan Copy-Paste Teks Soal / Jawaban');
        };

        document.addEventListener('visibilitychange', onVisibilityChange);
        window.addEventListener('blur', onWindowBlur);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', onVisualViewportResize);
        }
        document.addEventListener('fullscreenchange', onFullscreenChange);
        document.addEventListener('touchstart', onTouchStartSensor, { passive: true });
        document.addEventListener('touchmove', onTouchMoveSensor, { passive: true });
        window.addEventListener('keydown', onKeyDownSensor);
        window.addEventListener('keyup', onKeyUpSensor);
        window.addEventListener('beforeprint', onBeforePrint);
        document.addEventListener('copy', onCopyPaste);
        document.addEventListener('cut', onCopyPaste);

          window.removeEventListener('blur', onWindowBlur);
          if (window.visualViewport) {
            window.visualViewport.removeEventListener('resize', onVisualViewportResize);
