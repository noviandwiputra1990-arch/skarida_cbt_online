    // Resolver cerdas untuk menentukan sumber URL gambar (DataURL Base64, URL eksternal, atau nama file)
    const resolveImageSrc = (fileVal, previewVal) => {
      const candidate = String(previewVal || fileVal || '').trim();
      if (!candidate) return '';
      if (candidate.startsWith('data:image') || candidate.startsWith('http://') || candidate.startsWith('https://') || candidate.startsWith('blob:')) {
        return candidate;
      }
      const strFile = String(fileVal || '').trim();
      if (strFile.startsWith('data:image') || strFile.startsWith('http://') || strFile.startsWith('https://') || strFile.startsWith('blob:')) {
        return strFile;
      }
      if (strFile) {
        return buildSvgDiagramPlaceholder(strFile);
      }
      return '';
    };

    // Helper Waktu Indonesia (WIB UTC+7, WITA UTC+8, WIT UTC+9)
    const ZONA_WAKTU_INDONESIA = [
      { id: 'WIB', label: 'WIB (Waktu Indonesia Barat • UTC+7)', tz: 'Asia/Jakarta', offsetHours: 7 },
      { id: 'WITA', label: 'WITA (Waktu Indonesia Tengah • UTC+8)', tz: 'Asia/Makassar', offsetHours: 8 },
      { id: 'WIT', label: 'WIT (Waktu Indonesia Timur • UTC+9)', tz: 'Asia/Jayapura', offsetHours: 9 }
    ];

    const getIndonesianDateTimeLocal = (zona = 'WIB', addMinutes = 0) => {
      const zObj = ZONA_WAKTU_INDONESIA.find(z => z.id === zona) || ZONA_WAKTU_INDONESIA[0];
      const now = new Date(Date.now() + addMinutes * 60000);
      const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
      const idTime = new Date(utcMs + zObj.offsetHours * 3600000);
      const pad = (n) => String(n).padStart(2, '0');
      return `${idTime.getFullYear()}-${pad(idTime.getMonth() + 1)}-${pad(idTime.getDate())}T${pad(idTime.getHours())}:${pad(idTime.getMinutes())}`;
    };

    const getCurrentIndonesianClock = (zona = 'WIB') => {
      const zObj = ZONA_WAKTU_INDONESIA.find(z => z.id === zona) || ZONA_WAKTU_INDONESIA[0];
      try {
        const formatter = new Intl.DateTimeFormat('id-ID', {
          timeZone: zObj.tz,
          weekday: 'short',
          day: '2-digit',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });
        return `${formatter.format(new Date()).replace(/\./g, ':')} ${zObj.id}`;
      } catch (_) {
        return `${getIndonesianDateTimeLocal(zona).replace('T', ' ')} ${zObj.id}`;
      }
    };

    const formatJadwalIndonesia = (isoDateTimeStr, zona = 'WIB') => {
      if (!isoDateTimeStr) return '-';
      const clean = String(isoDateTimeStr).trim().replace(' ', 'T');
      const d = new Date(clean);
      if (isNaN(d.getTime())) return `${String(isoDateTimeStr).replace('T', ' ')} ${zona}`;
      const bulanIndo = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const hariIndo = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
      const pad = (n) => String(n).padStart(2, '0');
      return `${hariIndo[d.getDay()]}, ${pad(d.getDate())} ${bulanIndo[d.getMonth()]} ${d.getFullYear()} • ${pad(d.getHours())}:${pad(d.getMinutes())} ${zona}`;
    };

    // Helper pencocokan apakah Kelas atau Peserta termasuk dalam ketetapan Paket Bank Soal Mapel
    const getPaketTargetScope = (pkt, allMasterKelas = []) => {
      if (!pkt) return { tingkat: 'ALL', mode: 'semua', allowedClassNames: [], allowedJurusanCodes: [] };
      const tingkatPaket = String(pkt.tingkat || pkt.kelas || 'X').trim().toUpperCase();
      const rawJurusanStr = String(pkt.jurusan || 'Semua Jurusan').trim();
      const customList = Array.isArray(pkt.custom_items) && pkt.custom_items.length > 0
        ? pkt.custom_items.map(x => String(x).trim()).filter(Boolean)
        : rawJurusanStr.split(',').map(x => String(x).trim()).filter(Boolean);

      const mode = pkt.mode_sasaran || (
        rawJurusanStr === 'Semua Jurusan'
          ? 'semua'
          : customList.some(item => allMasterKelas.some(k => k.nama_kelas === item))
          ? 'custom_kelas'
          : customList.length > 1
          ? 'custom_jurusan'
          : 'jurusan'
      );

      const classesInTingkat = allMasterKelas.filter(
        k => (k.tingkat || inferTingkatFromKelas(k.nama_kelas, 'X')) === tingkatPaket
      );

      if (mode === 'semua' || rawJurusanStr === 'Semua Jurusan') {
        return {
          tingkat: tingkatPaket,
          mode: 'semua',
          allowedClassNames: classesInTingkat.map(k => k.nama_kelas),
          allowedJurusanCodes: [...new Set(classesInTingkat.map(k => k.kode_jurusan))]
        };
      }

      if (mode === 'custom_kelas') {
        const matchedClasses = classesInTingkat.filter(k => customList.includes(k.nama_kelas));
        const finalClassNames = matchedClasses.length > 0 ? matchedClasses.map(k => k.nama_kelas) : customList;
        const finalJurusanCodes = [...new Set(
          allMasterKelas.filter(k => finalClassNames.includes(k.nama_kelas)).map(k => k.kode_jurusan)
        )];
        return {
          tingkat: tingkatPaket,
          mode: 'custom_kelas',
          allowedClassNames: finalClassNames,
          allowedJurusanCodes: finalJurusanCodes
        };
      }

      if (mode === 'custom_jurusan') {
        const matchedClasses = classesInTingkat.filter(k => customList.includes(k.kode_jurusan));
        return {
          tingkat: tingkatPaket,
          mode: 'custom_jurusan',
          allowedClassNames: matchedClasses.map(k => k.nama_kelas),
          allowedJurusanCodes: customList
        };
      }

      // Mode 1 jurusan spesifik (misal: DPIB)
      const singleJur = customList[0] || rawJurusanStr;
      const matchedClasses = classesInTingkat.filter(
        k => k.kode_jurusan === singleJur || k.nama_kelas === singleJur
      );
      return {
        tingkat: tingkatPaket,
        mode: 'jurusan',
        allowedClassNames: matchedClasses.map(k => k.nama_kelas),
        allowedJurusanCodes: [singleJur]
      };
    };

    const isStudentInPaketScope = (student, pkt, allMasterKelas = []) => {
      if (!pkt || !student) return true;
      const scope = getPaketTargetScope(pkt, allMasterKelas);
      const stuTingkat = String(student.tingkat || inferTingkatFromKelas(student.kelas, 'X')).trim().toUpperCase();
      const stuKelas = String(student.kelas || '').trim();
      const stuJurusan = String(student.jurusan || '').trim().toUpperCase();

      if (scope.tingkat && scope.tingkat !== 'ALL' && stuTingkat !== scope.tingkat) {
        return false;
      }
      if (scope.mode === 'semua') {
        return true;
      }
      if (scope.mode === 'custom_kelas') {
        return scope.allowedClassNames.includes(stuKelas);
      }
      if (scope.mode === 'custom_jurusan' || scope.mode === 'jurusan') {
        if (scope.allowedClassNames.length > 0 && scope.allowedClassNames.includes(stuKelas)) return true;
        return scope.allowedJurusanCodes.map(j => j.toUpperCase()).includes(stuJurusan);
      }
      return true;
    };

    const generateExamToken = () => {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 4; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return `SKR-${code}`;
    };

    const formatMinutesSeconds = (totalSeconds) => {
      const sec = Math.max(0, Number(totalSeconds) || 0);
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    };

    const formatTimer = (totalSeconds) => {
      const sec = Math.max(0, Number(totalSeconds) || 0);
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    };

    const hitungDurasiAktual = (mulai, selesai) => {
      if (!mulai || !selesai) return '-';
      const d1 = new Date(mulai.replace(' ', 'T'));
      const d2 = new Date(selesai.replace(' ', 'T'));
      const diffMs = d2 - d1;
      if (isNaN(diffMs) || diffMs <= 0) return '-';
      const totalMenit = Math.floor(diffMs / 60000);
      const detik = Math.floor((diffMs % 60000) / 1000);
      return `${totalMenit} Menit ${detik} Detik`;
    };

    // =========================================================================
    // ENGINE RENDERER & EDITOR TEKS KAYA (BOLD, ITALIC, UNDERLINE, ENTER & RUMUS MATEMATIKA)
    // =========================================================================
    const MATH_TEMPLATES = [
      { label: 'a/b Pecahan', code: '$\\frac{a}{b}$', title: 'Rumus Pecahan' },
      { label: '√x Akar', code: '$\\sqrt{x}$', title: 'Akar Kuadrat' },
      { label: 'ⁿ√x Akar n', code: '$\\sqrt[n]{x}$', title: 'Akar Pangkat n' },
      { label: 'xⁿ Pangkat', code: '$x^{2}$', title: 'Pangkat / Eksponen' },
      { label: 'xₙ Indeks', code: '$x_{1}$', title: 'Subscript / Indeks' },
      { label: '∫ Integral', code: '$\\int_{a}^{b} x \\, dx$', title: 'Integral Tentu' },
      { label: '∑ Sigma', code: '$\\sum_{i=1}^{n} x_i$', title: 'Notasi Sigma' },
      { label: 'lim Limit', code: '$\\lim_{x \\to 0} f(x)$', title: 'Limit Fungsi' },
      { label: 'ᵃlog b', code: '$^{a}\\log(b)$', title: 'Logaritma' },
      { label: 'sin/cos', code: '$\\sin(\\theta) + \\cos(\\theta)$', title: 'Trigonometri' },
      { label: 'Matriks 2×2', code: '$\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix}$', title: 'Matriks 2x2' },
    ];

    const MATH_SYMBOLS = [
      '±', '×', '÷', '=', '≠', '≈', '≤', '≥', '<', '>',
      '√', '∛', '²', '³', '⁴', 'π', '°', '%', '∞', '∆',
      'θ', 'α', 'β', 'γ', 'λ', 'μ', 'Ω', '∈', '∉', '⊂',
      '∪', '∩', '∅', '⇒', '⇔', '⊥', '∥', '∠', '∴', '∵'
    ];

    // =========================================================================
    // DETEKTOR & KONVERTER OTOMATIS RUMUS MICROSOFT WORD (OMML, MATHML & UNICODEMATH)
    // =========================================================================
    const GREEK_UNICODE_MAP = {
      'α': '\\alpha ', 'β': '\\beta ', 'γ': '\\gamma ', 'δ': '\\delta ', 'ε': '\\varepsilon ',
      'ζ': '\\zeta ', 'η': '\\eta ', 'θ': '\\theta ', 'ϑ': '\\vartheta ', 'ι': '\\iota ',
      'κ': '\\kappa ', 'λ': '\\lambda ', 'μ': '\\mu ', 'ν': '\\nu ', 'ξ': '\\xi ',
      'π': '\\pi ', 'ρ': '\\rho ', 'σ': '\\sigma ', 'τ': '\\tau ', 'υ': '\\upsilon ',
      'φ': '\\varphi ', 'ϕ': '\\phi ', 'χ': '\\chi ', 'ψ': '\\psi ', 'ω': '\\omega ',
      'Γ': '\\Gamma ', 'Δ': '\\Delta ', '∆': '\\Delta ', 'Θ': '\\Theta ', 'Λ': '\\Lambda ',
      'Ξ': '\\Xi ', 'Π': '\\Pi ', 'Σ': '\\Sigma ', 'Φ': '\\Phi ', 'Ψ': '\\Psi ', 'Ω': '\\Omega '
    };

    const SUPERSCRIPT_CHAR_MAP = {
      '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9',
      '⁺': '+', '⁻': '-', '⁼': '=', '⁽': '(', '⁾': ')', 'ⁿ': 'n', 'ⁱ': 'i'
    };

    const SUBSCRIPT_CHAR_MAP = {
      '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9',
      '₊': '+', '₋': '-', '₌': '=', '₍': '(', '₎': ')', 'ₐ': 'a', 'ₑ': 'e', 'ₒ': 'o', 'ₓ': 'x', 'ᵢ': 'i', 'ⱼ': 'j', 'ₖ': 'k', 'ₙ': 'n', 'ₘ': 'm'
    };

    // Menormalkan huruf/angka khusus Mathematical Alphanumeric dari Microsoft Word (U+1D400 - U+1D7FF)
    const normalizeWordMathUnicodeChars = (input) => {
      if (!input) return { text: '', hadWordMathFont: false };
      let hadWordMathFont = false;
      const chars = Array.from(String(input));
      const out = chars.map((ch) => {
        const cp = ch.codePointAt(0);
        if (!cp) return ch;

        // Mathematical Alphanumeric Symbols (sering dihasilkan saat copy rumus dari MS Word)
        if (cp >= 0x1D400 && cp <= 0x1D7FF) {
          hadWordMathFont = true;
          // Bold, Italic, Bold-Italic Latin (A-Z, a-z)
          const latinRanges = [
            [0x1D400, 0x1D419, 65], [0x1D41A, 0x1D433, 97], // Bold
            [0x1D434, 0x1D44D, 65], [0x1D44E, 0x1D467, 97], // Italic
            [0x1D468, 0x1D481, 65], [0x1D482, 0x1D49B, 97], // Bold Italic
            [0x1D49C, 0x1D4B5, 65], [0x1D4B6, 0x1D4CF, 97], // Script
            [0x1D5A0, 0x1D5B9, 65], [0x1D5BA, 0x1D5D3, 97], // Sans-serif
            [0x1D608, 0x1D621, 65], [0x1D622, 0x1D63B, 97]  // Sans-serif Italic
          ];
          for (const [start, end, base] of latinRanges) {
            if (cp >= start && cp <= end) return String.fromCharCode(base + (cp - start));
          }
          // Mathematical Digits (0-9)
          const digitRanges = [0x1D7CE, 0x1D7D8, 0x1D7E2, 0x1D7EC, 0x1D7F6];
          for (const dStart of digitRanges) {
            if (cp >= dStart && cp <= dStart + 9) return String.fromCharCode(48 + (cp - dStart));
          }
          // Mathematical Italic Greek lowercase (𝛼 - 𝜔)
          if (cp >= 0x1D6FC && cp <= 0x1D714) {
            const greekList = ['α','β','γ','δ','ε','ζ','η','θ','ι','κ','λ','μ','ν','ξ','ο','π','ρ','ς','σ','τ','υ','φ','χ','ψ','ω'];
            return greekList[cp - 0x1D6FC] || ch;
          }
          // Mathematical Italic Greek uppercase (𝛢 - 𝛺)
          if (cp >= 0x1D6E2 && cp <= 0x1D6FA) {
            const greekUpper = ['Α','Β','Γ','Δ','Ε','Ζ','Η','Θ','Ι','Κ','Λ','Μ','Ν','Ξ','Ο','Π','Ρ','Θ','Σ','Τ','Υ','Φ','Χ','Ψ','Ω'];
            return greekUpper[cp - 0x1D6E2] || ch;
          }
        }
        if (cp === 0x210E) { hadWordMathFont = true; return 'h'; } // Planck constant italic h dari Word
        if (cp === 0x2212) return '-'; // Minus sign Word
        if (cp === 0x2215 || cp === 0x2044) { hadWordMathFont = true; return '/'; } // Fraction slash Word
        if (cp === 0x2592) { hadWordMathFont = true; return ' '; } // Word n-ary placeholder ▒
        return ch;
      });
      return { text: out.join(''), hadWordMathFont };
    };

    // Mengonversi ekspresi Linear / UnicodeMath dari Microsoft Word menjadi LaTeX KaTeX
    const convertWordLinearExprToLatex = (rawExpr) => {
      if (!rawExpr) return '';
      let s = normalizeWordMathUnicodeChars(rawExpr).text;

      // Bersihkan kurung grup khusus Word Equation (〖 dan 〗)
      s = s.replace(/〖/g, '{').replace(/〗/g, '}').replace(/▒/g, ' ');

      // Konversi rangkaian karakter superscript Unicode (misal x²⁺¹ -> x^{2+1})
      s = s.replace(/([⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻⁼⁽⁾ⁿⁱ]+)/g, (match) => {
        const mapped = Array.from(match).map(c => SUPERSCRIPT_CHAR_MAP[c] || c).join('');
        return `^{${mapped}}`;
      });

      // Konversi rangkaian karakter subscript Unicode (misal x₁₊₂ -> x_{1+2})
      s = s.replace(/([₀₁₂₃₄₅₆₇₈₉₊₋₌₍₎ₐₑₒₓᵢⱼₖₙₘ]+)/g, (match) => {
        const mapped = Array.from(match).map(c => SUBSCRIPT_CHAR_MAP[c] || c).join('');
        return `_{${mapped}}`;
      });

      // Integral, Sigma, Limit khas Word: ∫_a^b, ∑_(i=1)^n, lim_(x→0)
      s = s.replace(/∫_(\([^()]+\)|\{[^{}]+\}|[^\s^]+)\^(\([^()]+\)|\{[^{}]+\}|[^\s]+)/g, (_, sub, sup) => {
        const cleanSub = sub.replace(/^[\(\{]|[\)\}]$/g, '');
        const cleanSup = sup.replace(/^[\(\{]|[\)\}]$/g, '');
        return `\\int_{${cleanSub}}^{${cleanSup}} `;
      });
      s = s.replace(/∫/g, '\\int ');

      s = s.replace(/∑_(\([^()]+\)|\{[^{}]+\}|[^\s^]+)\^(\([^()]+\)|\{[^{}]+\}|[^\s]+)/g, (_, sub, sup) => {
        const cleanSub = sub.replace(/^[\(\{]|[\)\}]$/g, '');
        const cleanSup = sup.replace(/^[\(\{]|[\)\}]$/g, '');
        return `\\sum_{${cleanSub}}^{${cleanSup}} `;
      });
      s = s.replace(/∑/g, '\\sum ');

      s = s.replace(/\blim_(\([^()]+\)|\{[^{}]+\}|[^\s]+)/gi, (_, sub) => {
        const cleanSub = sub.replace(/^[\(\{]|[\)\}]$/g, '').replace(/->|→/g, '\\to ');
        return `\\lim_{${cleanSub}} `;
      });

      // Akar pangkat & Akar kuadrat dari Word: √(x+1), ∛(x), ∜(x), √x
      s = s.replace(/∛\(([^()]+)\)/g, '\\sqrt[3]{$1}')
           .replace(/∛\{([^{}]+)\}/g, '\\sqrt[3]{$1}')
           .replace(/∛([a-zA-Z0-9]+)/g, '\\sqrt[3]{$1}')
           .replace(/∜\(([^()]+)\)/g, '\\sqrt[4]{$1}')
           .replace(/∜([a-zA-Z0-9]+)/g, '\\sqrt[4]{$1}')
           .replace(/√\(([^()]+)\)/g, '\\sqrt{$1}')
           .replace(/√\{([^{}]+)\}/g, '\\sqrt{$1}')
           .replace(/√([a-zA-Z0-9]+)/g, '\\sqrt{$1}');

      // Pecahan bersarang / kurung dari Word: (a+b)/(c+d) atau {a+b}/{c+d}
      s = s.replace(/\(([^()]+)\)\s*\/\s*\(([^()]+)\)/g, '\\frac{$1}{$2}');
      s = s.replace(/\{([^{}]+)\}\s*\/\s*\{([^{}]+)\}/g, '\\frac{$1}{$2}');
      s = s.replace(/\(([^()]+)\)\s*\/\s*([a-zA-Z0-9_^{}]+)/g, '\\frac{$1}{$2}');
      s = s.replace(/([a-zA-Z0-9_^{}]+)\s*\/\s*\(([^()]+)\)/g, '\\frac{$1}{$2}');

      // Pangkat & Subscript dengan kurung biasa dari Word: x^(2n+1) atau x_(i+1)
      s = s.replace(/\^\(([^()]+)\)/g, '^{$1}');
      s = s.replace(/_\(([^()]+)\)/g, '_{$1}');

      // Simbol operator & relasi matematika
      s = s.replace(/±/g, '\\pm ')
           .replace(/×/g, '\\times ')
           .replace(/÷/g, '\\div ')
           .replace(/⋅|∙/g, '\\cdot ')
           .replace(/≤/g, '\\le ')
           .replace(/≥/g, '\\ge ')
           .replace(/≠/g, '\\ne ')
           .replace(/≈/g, '\\approx ')
           .replace(/∞/g, '\\infty ')
           .replace(/→|->/g, '\\to ')
           .replace(/⇒/g, '\\Rightarrow ')
           .replace(/⇔/g, '\\Leftrightarrow ')
           .replace(/⊥/g, '\\perp ')
           .replace(/∥/g, '\\parallel ')
           .replace(/∠/g, '\\angle ');

      // Huruf Yunani
      Object.keys(GREEK_UNICODE_MAP).forEach((gk) => {
        s = s.split(gk).join(GREEK_UNICODE_MAP[gk]);
      });

      return s.trim();
    };

    // Parser rekursif XML OMML (<m:oMath>) & MathML (<math>) dari Clipboard Microsoft Word ke LaTeX
    const parseWordMathXmlNodeToLatex = (node) => {
      if (!node) return '';
      if (node.nodeType === 3) {
        return convertWordLinearExprToLatex(node.nodeValue || '');
      }
      if (node.nodeType !== 1) return '';

      const rawTag = (node.tagName || node.nodeName || '').toLowerCase();
      const tag = rawTag.includes(':') ? rawTag.split(':')[1] : rawTag;

      const getChildByLocalName = (parent, localNames) => {
        const list = Array.isArray(localNames) ? localNames : [localNames];
        for (const ch of Array.from(parent.childNodes || [])) {
          if (ch.nodeType === 1) {
            const t = (ch.tagName || ch.nodeName || '').toLowerCase();
            const shortT = t.includes(':') ? t.split(':')[1] : t;
            if (list.includes(shortT)) return ch;
          }
        }
        return null;
      };

      const getChildrenByLocalName = (parent, localName) => {
        return Array.from(parent.childNodes || []).filter(ch => {
          if (ch.nodeType !== 1) return false;
          const t = (ch.tagName || ch.nodeName || '').toLowerCase();
          const shortT = t.includes(':') ? t.split(':')[1] : t;
          return shortT === localName;
        });
      };

      const childrenLatex = () => Array.from(node.childNodes || []).map(parseWordMathXmlNodeToLatex).join('');

      // Abaikan properti metadata XML Word (rPr, fPr, radPr, sSupPr, dPr, ctrlPr, dll.)
      if (tag.endsWith('pr') || tag === 'argpr' || tag === 'annotation') return '';

      // 1. Pecahan Word OMML (<m:f>) & MathML (<mfrac>)
      if (tag === 'f' || tag === 'mfrac') {
        const num = getChildByLocalName(node, 'num') || node.children?.[0];
        const den = getChildByLocalName(node, 'den') || node.children?.[1];
        return `\\frac{${parseWordMathXmlNodeToLatex(num)}}{${parseWordMathXmlNodeToLatex(den)}}`;
      }

      // 2. Akar Word OMML (<m:rad>) & MathML (<msqrt>, <mroot>)
      if (tag === 'rad') {
        const deg = getChildByLocalName(node, 'deg');
        const base = getChildByLocalName(node, 'e');
        const degStr = parseWordMathXmlNodeToLatex(deg).trim();
        const baseStr = parseWordMathXmlNodeToLatex(base).trim();
        return degStr ? `\\sqrt[${degStr}]{${baseStr}}` : `\\sqrt{${baseStr}}`;
      }
      if (tag === 'msqrt') return `\\sqrt{${childrenLatex()}}`;
      if (tag === 'mroot') {
        const base = node.children?.[0];
        const deg = node.children?.[1];
        return `\\sqrt[${parseWordMathXmlNodeToLatex(deg)}]{${parseWordMathXmlNodeToLatex(base)}}`;
      }

      // 3. Pangkat & Subscript Word OMML (sSup, sSub, sSubSup) & MathML (msup, msub, msubsup)
      if (tag === 'ssup' || tag === 'msup') {
        const base = getChildByLocalName(node, 'e') || node.children?.[0];
        const sup = getChildByLocalName(node, 'sup') || node.children?.[1];
        return `{${parseWordMathXmlNodeToLatex(base)}}^{${parseWordMathXmlNodeToLatex(sup)}}`;
      }
      if (tag === 'ssub' || tag === 'msub') {
        const base = getChildByLocalName(node, 'e') || node.children?.[0];
        const sub = getChildByLocalName(node, 'sub') || node.children?.[1];
        return `{${parseWordMathXmlNodeToLatex(base)}}_{${parseWordMathXmlNodeToLatex(sub)}}`;
      }
      if (tag === 'ssubsup' || tag === 'msubsup' || tag === 'munderover') {
        const base = getChildByLocalName(node, 'e') || node.children?.[0];
        const sub = getChildByLocalName(node, 'sub') || node.children?.[1];
        const sup = getChildByLocalName(node, 'sup') || node.children?.[2];
        return `{${parseWordMathXmlNodeToLatex(base)}}_{${parseWordMathXmlNodeToLatex(sub)}}^{${parseWordMathXmlNodeToLatex(sup)}}`;
      }

      // 4. Integral / Sigma / N-ary Word OMML (<m:nary>)
      if (tag === 'nary') {
        const naryPr = getChildByLocalName(node, 'narypr');
        const chrNode = naryPr ? getChildByLocalName(naryPr, 'chr') : null;
        const chrVal = chrNode ? (chrNode.getAttribute('m:val') || chrNode.getAttribute('val') || '∫') : '∫';
        let op = '\\int';
        if (chrVal.includes('∑')) op = '\\sum';
        else if (chrVal.includes('∏')) op = '\\prod';
        const sub = parseWordMathXmlNodeToLatex(getChildByLocalName(node, 'sub')).trim();
        const sup = parseWordMathXmlNodeToLatex(getChildByLocalName(node, 'sup')).trim();
        const body = parseWordMathXmlNodeToLatex(getChildByLocalName(node, 'e')).trim();
        return `${op}${sub ? `_{${sub}}` : ''}${sup ? `^{${sup}}` : ''} ${body}`;
      }

      // 5. Fungsi Matematika Word OMML (<m:func>: sin, cos, tan, log, lim) & Limit (<m:limLow>)
      if (tag === 'func') {
        const fName = parseWordMathXmlNodeToLatex(getChildByLocalName(node, 'fname')).trim();
        const body = parseWordMathXmlNodeToLatex(getChildByLocalName(node, 'e')).trim();
        return `${fName} {${body}}`;
      }
      if (tag === 'limlow' || tag === 'munder') {
        const base = getChildByLocalName(node, 'e') || node.children?.[0];
        const lim = getChildByLocalName(node, 'lim') || node.children?.[1];
        return `{${parseWordMathXmlNodeToLatex(base)}}_{${parseWordMathXmlNodeToLatex(lim)}}`;
      }

      // 6. Kurung Delimiter & Matriks Word OMML (<m:d>, <m:m>) & MathML (<mfenced>, <mtable>)
      if (tag === 'd' || tag === 'mfenced') {
        const dPr = getChildByLocalName(node, 'dpr');
        const begNode = dPr ? getChildByLocalName(dPr, 'begchr') : null;
        const endNode = dPr ? getChildByLocalName(dPr, 'endchr') : null;
        const begChr = begNode ? (begNode.getAttribute('m:val') || begNode.getAttribute('val') || '(') : (node.getAttribute('open') || '(');
        const endChr = endNode ? (endNode.getAttribute('m:val') || endNode.getAttribute('val') || ')') : (node.getAttribute('close') || ')');
        const eNodes = getChildrenByLocalName(node, 'e');
        const inner = eNodes.length > 0 ? eNodes.map(parseWordMathXmlNodeToLatex).join(', ') : childrenLatex();
        return `\\left${begChr === '{' ? '\\{' : begChr} ${inner} \\right${endChr === '}' ? '\\}' : endChr}`;
      }
      if (tag === 'm' || tag === 'mtable') {
        const rows = getChildrenByLocalName(node, tag === 'm' ? 'mr' : 'mtr');
        const rowsLatex = rows.map(r => {
          const cells = getChildrenByLocalName(r, tag === 'm' ? 'e' : 'mtd');
          return cells.map(parseWordMathXmlNodeToLatex).join(' & ');
        }).join(' \\\\ ');
        return `\\begin{matrix} ${rowsLatex} \\end{matrix}`;
      }

      // 7. Bar / Aksen / Vektor di atas huruf (<m:bar>, <m:acc>, <mover>)
      if (tag === 'bar' || tag === 'mover') {
        const base = getChildByLocalName(node, 'e') || node.children?.[0];
        return `\\overline{${parseWordMathXmlNodeToLatex(base)}}`;
      }
      if (tag === 'acc') {
        const base = getChildByLocalName(node, 'e');
        return `\\vec{${parseWordMathXmlNodeToLatex(base)}}`;
      }

      return childrenLatex();
    };

    // Mengolah HTML Clipboard dari Microsoft Word menjadi teks soal + tag format + rumus LaTeX ($...$)
    const parseWordClipboardHtml = (htmlData, plainData) => {
      if (!htmlData) return null;

      // Buka komentar kondisional MS Word Equation (<!--[if gte msEquation 12]><m:oMath>...</m:oMath><![endif]-->)
      let cleanedHtml = htmlData
        .replace(/<!--\[if[^\]]*msEquation[^\]]*\]>([\s\S]*?)<!\[endif\]-->/gi, '$1')
        .replace(/<!--\[if[^\]]*\]>[\s\S]*?<!\[endif\]-->/gi, '');

      const hasWordMathTags = /<(\w+:)?(oMath|oMathPara|math)\b/i.test(cleanedHtml);
      const hasWordFormatting = /mso-|urn:schemas-microsoft-com|<(\w+:)?(oMath|math)|<(b|strong|i|em|u|sup|sub)\b/i.test(cleanedHtml);

      if (!hasWordMathTags && !hasWordFormatting) return null;

      try {
        const parser = new DOMParser();
        const doc = parser.parseFromString(cleanedHtml, 'text/html');

        // Hapus style, meta, xml head, dan gambar fallback persamaan Word yang rusak
        doc.querySelectorAll('style, meta, link, script, xml, title, v\\:shape, v\\:imagedata').forEach(el => el.remove());

        const walkDom = (node) => {
          if (!node) return '';
          if (node.nodeType === 3) {
            const raw = node.nodeValue || '';
            const norm = normalizeWordMathUnicodeChars(raw);
            if (norm.hadWordMathFont) {
              return `$${convertWordLinearExprToLatex(raw)}$`;
            }
            return norm.text;
          }
          if (node.nodeType !== 1) return '';

          const rawTag = (node.tagName || node.nodeName || '').toLowerCase();
          const tag = rawTag.includes(':') ? rawTag.split(':')[1] : rawTag;

          // Jika bertemu blok Equation Microsoft Word (<m:oMath> atau <math>)
          if (tag === 'omath' || tag === 'omathpara' || tag === 'math') {
            const latex = parseWordMathXmlNodeToLatex(node).replace(/\s+/g, ' ').trim();
            return latex ? ` $${latex}$ ` : '';
          }

          // Abaikan gambar lokal file:/// dari clipboard Word
          if (tag === 'img') return '';

          const inner = Array.from(node.childNodes || []).map(walkDom).join('');
          if (!inner.trim() && tag !== 'br') return '';

          const styleAttr = (node.getAttribute('style') || '').toLowerCase();

          if (tag === 'b' || tag === 'strong' || styleAttr.includes('font-weight:bold') || styleAttr.includes('font-weight: bold')) {
            return `<b>${inner}</b>`;
          }
          if (tag === 'i' || tag === 'em' || styleAttr.includes('font-style:italic') || styleAttr.includes('font-style: italic')) {
            return `<i>${inner}</i>`;
          }
          if (tag === 'u' || styleAttr.includes('text-decoration:underline') || styleAttr.includes('text-decoration: underline')) {
            return `<u>${inner}</u>`;
          }
          if (tag === 'sup' || styleAttr.includes('vertical-align:super') || styleAttr.includes('vertical-align: super')) {
            return `<sup>${inner}</sup>`;
          }
          if (tag === 'sub' || styleAttr.includes('vertical-align:sub') || styleAttr.includes('vertical-align: sub')) {
            return `<sub>${inner}</sub>`;
          }
          if (tag === 'br') return '\n';
          if (tag === 'p' || tag === 'div' || tag === 'tr' || tag === 'li') {
            return `${inner.trim()}\n`;
          }
          return inner;
        };

        let result = walkDom(doc.body)
          .replace(/\$\s*\$/g, ' ')
          .replace(/[ \t]+\n/g, '\n')
          .replace(/\n{3,}/g, '\n\n')
          .trim();

        return result || null;
      } catch (err) {
        return null;
      }
    };

    // Mendeteksi rumus/ekspresi matematika dari teks biasa (ketikan langsung atau paste plain-text dari Word)
    const autoUpgradeWordMathInPlainText = (rawStr) => {
      if (!rawStr) return '';
      let str = String(rawStr);

      // Lindungi blok $...$ yang sudah ada
      const existingMath = [];
      str = str.replace(/\$\$?[\s\S]+?\$\$?/g, (m) => {
        existingMath.push(m);
        return `@@EXISTING_MATH_${existingMath.length - 1}@@`;
      });

      // 1. Jika terdapat karakter Unicode Mathematical Alphanumeric khas Word (𝑥, 𝑦, 𝑎, 𝑏, dll.)
      str = str.replace(/([\uD835][\uDC00-\uDFFF]|[〖〗▒√∛∜∫∑])+/g, (seg) => {
        return convertWordLinearExprToLatex(seg);
      });

      // 2. Deteksi otomatis pola rumus Word tanpa tanda $ (Akar, Pecahan kurung, Integral, Sigma, Limit, Logaritma)
      // Pola Akar: √(x+2) atau √25
      str = str.replace(/(∛|∜|√)\s*(\([^()]+\)|\{[^{}]+\}|[a-zA-Z0-9_^{}+-]+)/g, (match) => {
        return `$${convertWordLinearExprToLatex(match)}$`;
      });

      // Pola Pecahan Kurung: (2x + 3)/(x - 1)
      str = str.replace(/\(([^()\n]+)\)\s*\/\s*\(([^()\n]+)\)/g, (_, num, den) => {
        return `$\\frac{${convertWordLinearExprToLatex(num)}}{${convertWordLinearExprToLatex(den)}}$`;
      });

      // Pola Limit, Sigma, Integral: lim_(x->0), ∑_(i=1)^n, ∫_a^b
      str = str.replace(/\b(lim)_(\([^()]+\)|\{[^{}]+\}|[^\s]+)/gi, (match) => {
        return `$${convertWordLinearExprToLatex(match)}$`;
      });
      str = str.replace(/(∫|∑)_(\([^()]+\)|\{[^{}]+\}|[^\s^]+)\^(\([^()]+\)|\{[^{}]+\}|[^\s]+)/g, (match) => {
        return `$${convertWordLinearExprToLatex(match)}$`;
      });

      // Pola perintah LaTeX yang diketik/paste tanpa tanda $ (misal: \frac{a}{b}, \sqrt{x})
      str = str.replace(/(\\(?:frac|sqrt|int|sum|lim|sin|cos|tan|log|alpha|beta|gamma|theta|pi|infty|le|ge|ne|pm|times|div)\b(?:\s*\[[^\]]*\])?(?:\s*\{[^{}]*\})*)/g, (match) => {
        return `$${match}$`;
      });

      // Kembalikan blok $...$ yang sudah ada
      str = str.replace(/@@EXISTING_MATH_(\d+)@@/g, (_, idx) => existingMath[Number(idx)] || '');
      return str;
    };

    const renderRichMathHtml = (rawText) => {
      if (rawText === null || rawText === undefined || rawText === '') return '';
      // Deteksi otomatis rumus & simbol dari Microsoft Word sebelum dirender
      let str = autoUpgradeWordMathInPlainText(String(rawText));

      // 1. Amankan blok rumus LaTeX $$...$$ dan $...$ agar tidak terganggu sanitasi HTML
      const mathTokens = [];
      str = str.replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => {
        const idx = mathTokens.length;
        const cleanTex = convertWordLinearExprToLatex(tex);
        let rendered = `$$${cleanTex}$$`;
        if (window.katex) {
          try {
            rendered = window.katex.renderToString(cleanTex.trim(), { displayMode: true, throwOnError: false });
          } catch (_) {}
        }
        mathTokens.push(rendered);
        return `@@MATH_TOKEN_${idx}@@`;
      });

      str = str.replace(/\$([^\$\n]+?)\$/g, (_, tex) => {
        const idx = mathTokens.length;
        const cleanTex = convertWordLinearExprToLatex(tex);
        let rendered = `$${cleanTex}$`;
        if (window.katex) {
          try {
            rendered = window.katex.renderToString(cleanTex.trim(), { displayMode: false, throwOnError: false });
          } catch (_) {}
        }
        mathTokens.push(rendered);
        return `@@MATH_TOKEN_${idx}@@`;
      });

      // 2. Escape karakter HTML berbahaya selain tag format yang diizinkan (<b>, <i>, <u>, <sup>, <sub>, <br>)
      str = str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // 3. Kembalikan tag format yang diizinkan (Bold, Italic, Underline, Sup, Sub, Br)
      str = str
        .replace(/&lt;(\/?(b|strong|i|em|u|sup|sub))&gt;/gi, '<$1>')
        .replace(/&lt;br\s*\/?&gt;/gi, '<br/>');

      // Dukungan sintaks cepat **tebal** dan __garis bawah__
      str = str
        .replace(/\*\*([^\*]+)\*\*/g, '<b>$1</b>')
        .replace(/__([^_]+)__/g, '<u>$1</u>');

      // 4. Ubah karakter Enter (\n) menjadi ganti baris <br/>
      str = str.replace(/\r?\n/g, '<br/>');

      // 5. Kembalikan token rumus matematika KaTeX
      str = str.replace(/@@MATH_TOKEN_(\d+)@@/g, (_, i) => mathTokens[Number(i)] || '');

      return str;
    };

    function RichMathText({ text, className = '', placeholder = '' }) {
      if (!text && placeholder) {
        return <span className={`text-slate-500 italic ${className}`}>{placeholder}</span>;
      }
      return (
        <div
          className={`rich-math-content whitespace-pre-line break-words leading-relaxed ${className}`}
          dangerouslySetInnerHTML={{ __html: renderRichMathHtml(text) }}
        />
      );
    }

    function RichMathEditor({
      value,
      onChange,
      placeholder = 'Ketik atau Paste soal & rumus langsung dari Microsoft Word (Tekan Enter untuk baris baru)...',
      rows = 3,
      compact = false,
      label = null,
      rightSlot = null
    }) {
      const textareaRef = useRef(null);
      const [showMathPanel, setShowMathPanel] = useState(false);
      const [wordDetectedBadge, setWordDetectedBadge] = useState(false);

      const wrapSelection = (openTag, closeTag, defaultText = 'teks') => {
        const el = textareaRef.current;
        const currentVal = String(value ?? '');
        if (!el) {
          onChange(`${currentVal}${openTag}${defaultText}${closeTag}`);
          return;
        }
        const start = el.selectionStart ?? currentVal.length;
        const end = el.selectionEnd ?? currentVal.length;
        const selected = currentVal.slice(start, end) || defaultText;
        const nextVal = currentVal.slice(0, start) + openTag + selected + closeTag + currentVal.slice(end);
        onChange(nextVal);
        setTimeout(() => {
          el.focus();
          el.setSelectionRange(start + openTag.length, start + openTag.length + selected.length);
        }, 10);
      };

      const insertAtCursor = (snippet) => {
        const el = textareaRef.current;
        const currentVal = String(value ?? '');
        if (!el) {
          onChange(`${currentVal}${snippet}`);
          return;
        }
        const start = el.selectionStart ?? currentVal.length;
        const end = el.selectionEnd ?? currentVal.length;
        const nextVal = currentVal.slice(0, start) + snippet + currentVal.slice(end);
        onChange(nextVal);
        setTimeout(() => {
          el.focus();
          const cursorPos = start + snippet.length;
          el.setSelectionRange(cursorPos, cursorPos);
        }, 10);
      };

      // Handler Paste Pintar: Otomatis menangkap Equation / Simbol / Format dari Microsoft Word
      const handlePasteFromWord = (e) => {
        if (!e.clipboardData) return;
        const htmlData = e.clipboardData.getData('text/html');
        const plainData = e.clipboardData.getData('text/plain');

        // 1. Cek apakah clipboard berisi HTML Equation / Format dari Microsoft Word
        const parsedFromHtml = parseWordClipboardHtml(htmlData, plainData);
        if (parsedFromHtml) {
          e.preventDefault();
          insertAtCursor(parsedFromHtml);
          setWordDetectedBadge(true);
          setTimeout(() => setWordDetectedBadge(false), 4000);
          return;
        }

        // 2. Cek apakah plain text mengandung karakter/pola UnicodeMath dari Microsoft Word
        if (plainData) {
          const normCheck = normalizeWordMathUnicodeChars(plainData);
          const hasLinearMath = /(√|∛|∜|∫|∑|〖|〗|▒|\([^()]+\)\s*\/\s*\([^()]+\)|\blim_)/i.test(plainData);
          if (normCheck.hadWordMathFont || hasLinearMath) {
            e.preventDefault();
            const upgraded = autoUpgradeWordMathInPlainText(normCheck.text);
            insertAtCursor(upgraded);
            setWordDetectedBadge(true);
            setTimeout(() => setWordDetectedBadge(false), 4000);
          }
        }
      };

      const handleKeyDown = (e) => {
        // Shortcut Ctrl+B (Bold), Ctrl+I (Italic), Ctrl+U (Underline)
        if (e.ctrlKey || e.metaKey) {
          const k = e.key.toLowerCase();
          if (k === 'b') {
            e.preventDefault();
            wrapSelection('<b>', '</b>', 'teks tebal');
          } else if (k === 'i') {
            e.preventDefault();
            wrapSelection('<i>', '</i>', 'teks miring');
          } else if (k === 'u') {
            e.preventDefault();
            wrapSelection('<u>', '</u>', 'garis bawah');
          }
        }
        // Tombol Enter tetap berjalan alami membuat baris baru di dalam textarea
        if (e.key === 'Enter') {
          e.stopPropagation();
        }
      };

      const hasFormattingOrMath = Boolean(
        value && (/(\$|\\[a-zA-Z]+|<\/?(b|i|u|sup|sub)>|\n|[√∛∜∫∑±×÷≤≥≠≈∞πθ°²³⁴]|[\uD835][\uDC00-\uDFFF]|\([^()]+\)\/\([^()]+\))/i.test(String(value)))
      );

      return (
        <div className="space-y-1.5 w-full">
          {(label || rightSlot) && (
            <div className="flex flex-wrap justify-between items-center gap-2">
              {label}
              {rightSlot}
            </div>
          )}

          {/* Toolbar Format Teks (B, I, U, Pangkat, Subscript) & Auto-Converter Rumus Microsoft Word */}
          <div className="bg-slate-900 border border-slate-700 rounded-xl overflow-hidden focus-within:border-indigo-500 transition">
            <div className="flex flex-wrap items-center justify-between gap-1 px-2 py-1.5 bg-slate-950/90 border-b border-slate-800 text-[11px]">
              <div className="flex flex-wrap items-center gap-1">
                <button
                  type="button"
                  onClick={() => wrapSelection('<b>', '</b>', 'tebal')}
                  className="px-2 py-1 rounded-lg bg-slate-800 hover:bg-indigo-600 text-white font-black border border-slate-700 transition"
                  title="Tebal / Bold (Ctrl+B)"
                >
                  B
                </button>
                <button
                  type="button"
                  onClick={() => wrapSelection('<i>', '</i>', 'miring')}
                  className="px-2 py-1 rounded-lg bg-slate-800 hover:bg-indigo-600 text-white italic font-serif font-bold border border-slate-700 transition"
                  title="Miring / Italic (Ctrl+I)"
                >
                  I
                </button>
                <button
                  type="button"
                  onClick={() => wrapSelection('<u>', '</u>', 'garis bawah')}
                  className="px-2 py-1 rounded-lg bg-slate-800 hover:bg-indigo-600 text-white underline font-bold border border-slate-700 transition"
                  title="Garis Bawah / Underline (Ctrl+U)"
                >
                  U
                </button>
                <span className="h-4 w-px bg-slate-800 mx-0.5" />
                <button
                  type="button"
                  onClick={() => wrapSelection('<sup>', '</sup>', '2')}
                  className="px-2 py-1 rounded-lg bg-slate-800 hover:bg-sky-600 text-sky-300 hover:text-white font-bold border border-slate-700 transition"
                  title="Pangkat Atas / Superscript (X²)"
                >
                  X²
                </button>
                <button
                  type="button"
                  onClick={() => wrapSelection('<sub>', '</sub>', '1')}
                  className="px-2 py-1 rounded-lg bg-slate-800 hover:bg-sky-600 text-sky-300 hover:text-white font-bold border border-slate-700 transition"
                  title="Indeks Bawah / Subscript (X₂)"
                >
                  X₂
                </button>
                <span className="h-4 w-px bg-slate-800 mx-0.5" />
                <button
                  type="button"
                  onClick={() => setShowMathPanel(!showMathPanel)}
                  className={`px-2.5 py-1 rounded-lg font-extrabold flex items-center gap-1 border transition ${
                    showMathPanel
                      ? 'bg-amber-500 text-slate-950 border-amber-400'
                      : 'bg-amber-500/15 hover:bg-amber-500/30 text-amber-300 border-amber-500/30'
                  }`}
                  title="Buka Panel Rumus & Simbol Matematika"
                >
                  <span>∑ Rumus & Simbol</span>
                </button>
                <button
                  type="button"
                  onClick={() => {
                    const currentVal = String(value ?? '');
                    if (!currentVal.trim()) return;
                    const el = textareaRef.current;
                    if (el && el.selectionStart !== el.selectionEnd) {
                      const s = el.selectionStart;
                      const e = el.selectionEnd;
                      const sel = currentVal.slice(s, e);
                      const converted = `$${convertWordLinearExprToLatex(sel)}$`;
                      onChange(currentVal.slice(0, s) + converted + currentVal.slice(e));
                    } else {
                      onChange(autoUpgradeWordMathInPlainText( normalizeWordMathUnicodeChars(currentVal).text ));
                    }
                    setWordDetectedBadge(true);
                    setTimeout(() => setWordDetectedBadge(false), 3500);
                  }}
                  className="px-2.5 py-1 rounded-lg bg-emerald-500/15 hover:bg-emerald-600 text-emerald-300 hover:text-white border border-emerald-500/30 font-extrabold transition"
                  title="Konversi ekspresi rumus dari Microsoft Word (Sorot teks rumus atau klik langsung)"
                >
                  ✨ Deteksi Rumus Word
                </button>
              </div>
              <div className="flex items-center gap-2 pr-1">
                {wordDetectedBadge ? (
                  <span className="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-[10px] font-bold animate-pulse">
                    ✓ Rumus MS Word Terdeteksi!
                  </span>
                ) : (
                  <span className="text-[10px] text-sky-400 font-semibold hidden sm:inline">
                    Support Copy-Paste Equation MS Word
                  </span>
                )}
              </div>
            </div>

            {/* Panel Interaktif Rumus (LaTeX/KaTeX) & Simbol Matematika */}
            {showMathPanel && (
              <div className="p-2.5 bg-slate-950/95 border-b border-slate-800 space-y-2 text-[11px]">
                <div className="p-2 rounded-lg bg-indigo-950/50 border border-indigo-500/30 text-[10px] text-indigo-200 leading-relaxed">
                  💡 <b>Tips Copy-Paste Microsoft Word:</b> Bapak/Ibu Guru dapat langsung menyalin (<b>Ctrl+C</b>) soal berisi <i>Equation</i> atau simbol dari <b>Microsoft Word</b> lalu menempelkannya (<b>Ctrl+V</b>) ke kotak di bawah. Sistem otomatis membaca pecahan, akar, pangkat, limit, integral, dan simbol Word.
                </div>
                <div>
                  <div className="text-[10px] font-bold uppercase text-amber-400 mb-1">
                    Klik Template Rumus Matematika (Otomatis Dirender):
                  </div>
                  <div className="flex flex-wrap gap-1">
                    {MATH_TEMPLATES.map((tpl, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => insertAtCursor(tpl.code)}
                        title={tpl.title}
                        className="px-2 py-1 rounded-lg bg-slate-900 hover:bg-indigo-600 text-indigo-200 hover:text-white border border-slate-700 font-mono text-[11px] font-bold transition"
                      >
                        {tpl.label}
                      </button>
                    ))}
                  </div>
                </div>
                <div>
                  <div className="text-[10px] font-bold uppercase text-sky-400 mb-1">
                    Klik Simbol Matematika / Sains Cepat:
                  </div>
                  <div className="flex flex-wrap gap-1">
                    {MATH_SYMBOLS.map((sym, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => insertAtCursor(sym)}
                        className="w-7 h-7 rounded-lg bg-slate-900 hover:bg-sky-600 text-white border border-slate-800 font-bold text-xs flex items-center justify-center transition"
                      >
                        {sym}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* Area Input Multiline (Mendukung Paste Equation MS Word, Enter, Bold/Italic/Underline) */}
            <textarea
              ref={textareaRef}
              rows={compact ? 2 : rows}
              value={value || ''}
              onPaste={handlePasteFromWord}
              onKeyDown={handleKeyDown}
              onChange={e => onChange(e.target.value)}
              placeholder={placeholder}
              className="w-full bg-slate-900 px-3 py-2 text-white text-xs outline-none resize-y leading-relaxed font-sans"
            />
          </div>

          {/* Pratinjau Langsung (Live Preview) Hasil Deteksi Rumus MS Word, Format Teks & Enter */}
          {hasFormattingOrMath && (
            <div className="px-3 py-2 rounded-xl bg-slate-900/90 border border-indigo-500/30 text-xs">
              <div className="text-[10px] font-bold uppercase text-indigo-400 mb-1 flex items-center justify-between">
                <span>Pratinjau Hasil Deteksi Rumus Word & Format Teks:</span>
              </div>
              <RichMathText text={value} className="text-slate-100 text-xs" />
            </div>
          )}
        </div>
      );
    }

    function SidebarBtn({ active, onClick, icon: Icon, label, desc, accent = 'indigo' }) {
      const colorMap = {
        emerald: active ? 'bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/30' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 group-hover:bg-emerald-500/20',
        amber: active ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/30' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20 group-hover:bg-amber-500/20',
        sky: active ? 'bg-sky-500 text-slate-950 shadow-lg shadow-sky-500/30' : 'bg-sky-500/10 text-sky-400 border border-sky-500/20 group-hover:bg-sky-500/20',
        violet: active ? 'bg-violet-500 text-white shadow-lg shadow-violet-500/30' : 'bg-violet-500/10 text-violet-400 border border-violet-500/20 group-hover:bg-violet-500/20',
        rose: active ? 'bg-rose-500 text-white shadow-lg shadow-rose-500/30' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20 group-hover:bg-rose-500/20',
        indigo: active ? 'bg-indigo-500 text-white shadow-lg shadow-indigo-500/30' : 'bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 group-hover:bg-indigo-500/20',
      };
      return (
        <button
          onClick={onClick}
          className={`group w-full flex items-center gap-3 px-3 py-2.5 rounded-2xl text-left transition-all duration-200 ${

            if (Array.isArray(d.paket_soal)) {
              setPaketSoal(d.paket_soal.map(p => ({

            if (Array.isArray(d.master_soal)) {
              setMasterSoal(d.master_soal.map(s => {
                const rawOpsi = Array.isArray(s.opsi)
                  ? s.opsi
                  : [String(s.opsi_a ?? ''), String(s.opsi_b ?? ''), String(s.opsi_c ?? ''), String(s.opsi_d ?? ''), String(s.opsi_e ?? '')];
                const rawGbrOpsi = Array.isArray(s.gambar_opsi)
                  ? s.gambar_opsi
                  : [s.gambar_a || null, s.gambar_b || null, s.gambar_c || null, s.gambar_d || null, s.gambar_e || null];
                const rawPrevOpsi = Array.isArray(s.preview_gambar_opsi)
                  ? s.preview_gambar_opsi
                  : rawGbrOpsi.map(g => (String(g || '').startsWith('data:image') || String(g || '').startsWith('http')) ? String(g) : '');
                const mainFile = s.file_gambar_soal || null;
                const mainPrev = s.preview_gambar_soal || ((String(mainFile || '').startsWith('data:image') || String(mainFile || '').startsWith('http')) ? String(mainFile) : '');

                return {
                  ...s,
                  tipe_soal: String(s.tipe_soal || 'PG'),
                  kategori_kognitif: String(s.kategori_kognitif || 'MoTS'),
                  teks_pertanyaan: String(s.teks_pertanyaan || ''),

                  bobot_skor: Number(s.bobot_skor) || 0,
                  file_gambar_soal: mainFile ? getCleanFileName(mainFile, 'gambar_soal.jpg') : (mainPrev ? 'gambar_soal.jpg' : null),
                  preview_gambar_soal: mainPrev,
                  opsi: rawOpsi,
                  gambar_opsi: rawGbrOpsi.map((g, i) => g ? getCleanFileName(g, `opsi_${String.fromCharCode(65 + i)}.jpg`) : (rawPrevOpsi[i] ? `opsi_${String.fromCharCode(65 + i)}.jpg` : null)),
                  preview_gambar_opsi: rawPrevOpsi
                };
              }));
            }
            if (Array.isArray(d.sesi_ujian)) {
              setSesiUjian(d.sesi_ujian.map(s => {
                let parsedIds = [];
                try { parsedIds = JSON.parse(s.peserta_ids_json || '[]'); } catch (_) {}
                const parseBool = (val, def = true) => {
                  if (val === undefined || val === null || val === '') return def;
                  if (typeof val === 'boolean') return val;
                  return String(val).toUpperCase() === 'TRUE' || String(val) === '1';
                };
                return {
                  ...s,
                  nama_sesi_spesifik: String(s.nama_sesi_spesifik || ''),
                  waktu_buka: String(s.waktu_buka || ''),
                  waktu_tutup: String(s.waktu_tutup || ''),
                  zona_waktu: String(s.zona_waktu || 'WIB'),
                  durasi_menit: Number(s.durasi_menit) || 60,
                  minimal_menit_submit: Number(s.minimal_menit_submit) || 15,
                  is_acak_soal: parseBool(s.is_acak_soal, true),
                  is_proctoring_active: parseBool(s.is_proctoring_active, true),
                  enable_watermark: parseBool(s.enable_watermark, true),
                  require_token: parseBool(s.require_token, true),
                  token: String(s.token || ''),
                  limit_soal_pg: Number(s.limit_soal_pg) || 25,
                  limit_soal_uraian: Number(s.limit_soal_uraian) || 5,
                  peserta_ids: Array.isArray(s.peserta_ids) ? s.peserta_ids : parsedIds
                };
              }));
            }
            if (Array.isArray(d.peserta_ujian)) {
              const logsAll = Array.isArray(d.log_pelanggaran) ? d.log_pelanggaran : [];
              const jawabanAll = Array.isArray(d.jawaban_siswa) ? d.jawaban_siswa : [];
              setPesertaUjian(d.peserta_ujian.map(pu => {
                let parsedDetailUraian = {};
                try {
                  parsedDetailUraian = typeof pu.detail_uraian === 'object' && pu.detail_uraian !== null
                    ? pu.detail_uraian
                    : JSON.parse(pu.detail_skor_uraian_json || '{}');
                } catch (_) {}

                let parsedPgMap = {};
                try {
                  parsedPgMap = typeof pu.jawaban_pg_siswa === 'object' && pu.jawaban_pg_siswa !== null
                    ? pu.jawaban_pg_siswa
                    : JSON.parse(pu.jawaban_pg_siswa_json || '{}');
                } catch (_) {}

                const jawabanPesertaRows = jawabanAll.filter(
                  j => String(j.id_peserta_ujian) === String(pu.id_peserta_ujian)
                );
                const pgMapFromSheet = { ...parsedPgMap };
                jawabanPesertaRows.forEach(jRow => {
                  const idSoalKey = jRow.id_soal;
                  if (!idSoalKey) return;
                  if (String(jRow.tipe_soal || 'PG').toUpperCase() === 'PG') {
                    if (jRow.jawaban_pg) pgMapFromSheet[idSoalKey] = String(jRow.jawaban_pg).trim().toUpperCase();
                  } else {
                    if (!parsedDetailUraian[idSoalKey]) {
                      parsedDetailUraian[idSoalKey] = {
                        id_soal: idSoalKey,
                        jawaban: String(jRow.jawaban_uraian || ''),
                        skor: Number(jRow.skor_didapat) || 0
                      };
                    }
                  }
                });

                return {
                  ...pu,
                  waktu_mulai: pu.waktu_mulai ? String(pu.waktu_mulai) : null,
                  waktu_selesai: pu.waktu_selesai ? String(pu.waktu_selesai) : null,
                  jumlah_pelanggaran: Number(pu.jumlah_pelanggaran) || 0,
                  jml_terjawab: pu.jml_terjawab !== undefined && pu.jml_terjawab !== '' ? Number(pu.jml_terjawab) : undefined,
                  jml_benar_pg: pu.jml_benar_pg !== undefined && pu.jml_benar_pg !== '' ? Number(pu.jml_benar_pg) : undefined,
                  jml_salah_pg: pu.jml_salah_pg !== undefined && pu.jml_salah_pg !== '' ? Number(pu.jml_salah_pg) : undefined,
                  skor_pg: Number(pu.skor_pg) || 0,
                  skor_uraian: Number(pu.skor_uraian) || 0,
                  jawaban_pg_siswa: pgMapFromSheet,
                  detail_uraian: parsedDetailUraian,
                  log_pelanggaran: logsAll.filter(lg => String(lg.id_peserta_ujian) === String(pu.id_peserta_ujian))
                };
              }));
            }
            if (!silent) triggerToast('Tersinkronisasi', 'Data real berhasil dimuat dari Google Sheets.');
          }
        } catch (err) {
          if (!silent) triggerToast('Gagal Memuat Database', 'Periksa koneksi internet atau URL Google Apps Script.', 'warning');
        }
        setIsSyncing(false);
      };

        fetchAllFromSheets(true);

      const [soalFilterMapel, setSoalFilterMapel] = useState('ALL');
