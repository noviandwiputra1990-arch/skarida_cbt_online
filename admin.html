    const formatTimer = (totalSeconds) => {
      const sec = Math.max(0, Number(totalSeconds) || 0);
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    };

    const hitungDurasiAktual = (mulai, selesai) => {
      if (!mulai || !selesai) return '-';
      const d1 = new Date(mulai.replace(' ', 'T'));
      const d2 = new Date(selesai.replace(' ', 'T'));
      const diffMs = d2 - d1;
      if (isNaN(diffMs) || diffMs <= 0) return '-';
      const totalMenit = Math.floor(diffMs / 60000);
      const detik = Math.floor((diffMs % 60000) / 1000);
      return `${totalMenit} Menit ${detik} Detik`;
    };

    function AdminDashboardApp() {
      const [activeTab, setActiveTab] = useState('command-center');
      const [toast, setToast] = useState(null);
      const [serverSeconds, setServerSeconds] = useState(4125);
      const [scriptUrl, setScriptUrl] = useState(() => {
        const saved = safeGetStorage('skarida_script_url', '');
        if (saved && saved.trim() !== '') return saved.trim();
        safeSetStorage('skarida_script_url', DEFAULT_SCRIPT_URL);
        return DEFAULT_SCRIPT_URL;
      });
      const [showApiModal, setShowApiModal] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);

      useEffect(() => {
        let link = document.querySelector("link[rel~='icon']");
        if (!link) {
          link = document.createElement('link');
          link.rel = 'icon';
          document.head.appendChild(link);
        }
        link.href = LOGO_DATA_URI;
      }, []);

      useEffect(() => {
        const timer = setInterval(() => {
          setServerSeconds(prev => (prev > 0 ? prev - 1 : 3600));
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const triggerToast = (title, message, type = 'success') => {
        setToast({ title, message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const [masterUjian, setMasterUjian] = useState(INITIAL_MASTER_UJIAN);
      const [masterJurusan, setMasterJurusan] = useState(INITIAL_MASTER_JURUSAN);
      const [masterKelas, setMasterKelas] = useState(INITIAL_MASTER_KELAS);
      const [users, setUsers] = useState(INITIAL_USERS);
      const [staffUsers, setStaffUsers] = useState(INITIAL_STAFF_USERS);
      const [paketSoal, setPaketSoal] = useState(INITIAL_PAKET);
      const [masterSoal, setMasterSoal] = useState(INITIAL_SOAL);
      const [sesiUjian, setSesiUjian] = useState(INITIAL_SESI);
      const [pesertaUjian, setPesertaUjian] = useState(INITIAL_PESERTA_UJIAN);

      // Sinkronisasi ke Google Sheets jika URL tersedia
      const syncToSheets = async (payload) => {
        if (!scriptUrl) return;
        try {
          await fetch(scriptUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
        } catch (err) {
          console.error(err);
        }
      };

      // Tarik seluruh data dari 11 Sheet Google Sheets saat halaman Admin dibuka
      const fetchAllFromSheets = async (silent = false) => {
        if (!scriptUrl) return;
        setIsSyncing(true);
        try {
          const res = await fetch(`${scriptUrl}?action=initAll`);
          const json = await res.json();
          if (json.status === 'success' && json.data) {
            const d = json.data;
            if (Array.isArray(d.master_ujian) && d.master_ujian.length > 0) {
              setMasterUjian(d.master_ujian.map(u => ({
                ...u,
                nama_ujian: String(u.nama_ujian || ''),
                kode: String(u.kode_ujian || u.kode || '')
              })));
            }
            if (Array.isArray(d.master_jurusan) && d.master_jurusan.length > 0) {
              setMasterJurusan(d.master_jurusan.map(j => ({
                ...j,
                kode_jurusan: String(j.kode_jurusan || ''),
                nama_jurusan: String(j.nama_jurusan || '')
              })));
            }
            if (Array.isArray(d.master_kelas) && d.master_kelas.length > 0) {
              setMasterKelas(d.master_kelas.map(k => ({
                ...k,
                kode_jurusan: String(k.kode_jurusan || ''),
                nama_kelas: String(k.nama_kelas || ''),
                tingkat: String(k.tingkat || 'X')
              })));
            }
            if (Array.isArray(d.users_peserta) && d.users_peserta.length > 0) {
              setUsers(d.users_peserta.map(u => ({
                ...u,
                username_nisn: String(u.username_nisn || ''),
                nama_lengkap: String(u.nama_lengkap || ''),
                agama: String(u.agama || 'Islam'),
                kelas: String(u.kelas || ''),
                jurusan: String(u.jurusan || ''),
                password_plain: String(u.password_plain || '')
              })));
            }
            if (Array.isArray(d.users_staff) && d.users_staff.length > 0) {
              setStaffUsers(d.users_staff.map(st => ({
                ...st,
                username_nip: String(st.username_nip || ''),
                nama_lengkap: String(st.nama_lengkap || ''),
                role: String(st.role || 'guru'),
                mapel_jabatan: String(st.mapel_jabatan || ''),
                password_plain: String(st.password_plain || ''),
                status: String(st.status || 'Aktif')
              })));
            }
            if (Array.isArray(d.paket_soal) && d.paket_soal.length > 0) {
              setPaketSoal(d.paket_soal.map(p => ({
                ...p,
                mata_pelajaran: String(p.mata_pelajaran || ''),
                kelas: String(p.kelas || 'X'),
                jurusan: String(p.jurusan || ''),
                guru: String(p.nama_guru || p.guru || '')
              })));
            }
            if (Array.isArray(d.master_soal) && d.master_soal.length > 0) {
              setMasterSoal(d.master_soal.map(s => ({
                ...s,
                tipe_soal: String(s.tipe_soal || 'PG'),
                kategori_kognitif: String(s.kategori_kognitif || 'MoTS'),
                teks_pertanyaan: String(s.teks_pertanyaan || ''),
                jumlah_opsi: Number(s.jumlah_opsi) || 0,
                bobot_skor: Number(s.bobot_skor) || 0,
                opsi: Array.isArray(s.opsi) ? s.opsi : [String(s.opsi_a ?? ''), String(s.opsi_b ?? ''), String(s.opsi_c ?? ''), String(s.opsi_d ?? ''), String(s.opsi_e ?? '')],
                gambar_opsi: Array.isArray(s.gambar_opsi) ? s.gambar_opsi : [s.gambar_a || null, s.gambar_b || null, s.gambar_c || null, s.gambar_d || null, s.gambar_e || null]
              })));
            }
            if (Array.isArray(d.sesi_ujian) && d.sesi_ujian.length > 0) {
              setSesiUjian(d.sesi_ujian.map(s => {
                let parsedIds = [];
                try { parsedIds = JSON.parse(s.peserta_ids_json || '[]'); } catch (_) {}
                return {
                  ...s,
                  nama_sesi_spesifik: String(s.nama_sesi_spesifik || ''),
                  waktu_buka: String(s.waktu_buka || '2026-11-16T07:30'),
                  waktu_tutup: String(s.waktu_tutup || '2026-11-16T09:30'),
                  durasi_menit: Number(s.durasi_menit) || 60,
                  minimal_menit_submit: Number(s.minimal_menit_submit) || 15,
                  peserta_ids: Array.isArray(s.peserta_ids) ? s.peserta_ids : parsedIds
                };
              }));
            }
            if (Array.isArray(d.peserta_ujian) && d.peserta_ujian.length > 0) {
              const logsAll = Array.isArray(d.log_pelanggaran) ? d.log_pelanggaran : [];
              setPesertaUjian(d.peserta_ujian.map(pu => ({
                ...pu,
                waktu_mulai: pu.waktu_mulai ? String(pu.waktu_mulai) : null,
                waktu_selesai: pu.waktu_selesai ? String(pu.waktu_selesai) : null,
                jumlah_pelanggaran: Number(pu.jumlah_pelanggaran) || 0,
                skor_pg: Number(pu.skor_pg) || 0,
                skor_uraian: Number(pu.skor_uraian) || 0,
                log_pelanggaran: logsAll.filter(lg => String(lg.id_peserta_ujian) === String(pu.id_peserta_ujian))
              })));
            }
            if (!silent) triggerToast('Tersinkronisasi', 'Data terbaru berhasil dimuat dari Google Sheets.');
          }
        } catch (err) {
          if (!silent) triggerToast('Mode Cadangan Lokal', 'Menggunakan data pratinjau lokal.', 'warning');
        }
        setIsSyncing(false);
      };

      useEffect(() => {
        fetchAllFromSheets(true);
      }, [scriptUrl]);

      const [staffFilterRole, setStaffFilterRole] = useState('ALL');
      const [staffSearch, setStaffSearch] = useState('');
      const [staffModal, setStaffModal] = useState(null);

      const [ccFilterMapel, setCcFilterMapel] = useState('ALL');
      const [ccFilterSesi, setCcFilterSesi] = useState('ALL');

      const [akunFilterJurusan, setAkunFilterJurusan] = useState('ALL');
      const [akunFilterKelas, setAkunFilterKelas] = useState('ALL');
      const [akunFilterAgama, setAkunFilterAgama] = useState('ALL');
      const [akunSearch, setAkunSearch] = useState('');

      const [soalFilterMapel, setSoalFilterMapel] = useState('ALL');
      const [soalFilterKelas, setSoalFilterKelas] = useState('ALL');
      const [soalFilterJurusan, setSoalFilterJurusan] = useState('ALL');
      const [selectedPaketId, setSelectedPaketId] = useState(INITIAL_PAKET[0].id_paket);

      const [sesiSearch, setSesiSearch] = useState('');
      const [sesiFilterTanggal, setSesiFilterTanggal] = useState('');

      const [enrollFilterJurusan, setEnrollFilterJurusan] = useState('ALL');
      const [enrollFilterKelas, setEnrollFilterKelas] = useState('ALL');
      const [enrollFilterAgama, setEnrollFilterAgama] = useState('ALL');

      const [raporFilterMapel, setRaporFilterMapel] = useState('ALL');
      const [raporFilterKelas, setRaporFilterKelas] = useState('ALL');
      const [selectedPesertaKoreksi, setSelectedPesertaKoreksi] = useState(null);

      const [ujianModal, setUjianModal] = useState(null);
      const [jurusanModal, setJurusanModal] = useState(null);
      const [kelasModal, setKelasModal] = useState(null);
      const [editUserModal, setEditUserModal] = useState(null);
      const [paketModal, setPaketModal] = useState(null);
      const [soalModal, setSoalModal] = useState(null);
      const [previewSoalModal, setPreviewSoalModal] = useState(null);
      const [sesiModal, setSesiModal] = useState(null);
      const [showKartuModal, setShowKartuModal] = useState(false);
      const [showBeritaAcaraModal, setShowBeritaAcaraModal] = useState(false);
      const [showMobileSimulator, setShowMobileSimulator] = useState(false);
      const [simState, setSimState] = useState({
        statusJadwal: 'sudah_buka',
        minimalMenitSubmit: 45,
        menitBerjalan: 20,
        strikes: 0,
        showStrikePopup: false,
        lastViolationType: '',
        isForceSubmitted: false,
        forceSubmitReason: ''
      });

      const triggerSimViolation = (violationLabel) => {
        const nextStrike = simState.strikes + 1;
        if (nextStrike >= 4) {
          setSimState({
            ...simState,
            strikes: nextStrike,
            showStrikePopup: false,
            lastViolationType: violationLabel,
            isForceSubmitted: true,
            forceSubmitReason: `Pelanggaran Ke-4 (${violationLabel}) — Melewati Batas Peringatan Ke-3`
          });
        } else {
          setSimState({
            ...simState,
            strikes: nextStrike,
            showStrikePopup: true,
            lastViolationType: violationLabel,
            isForceSubmitted: false
          });
        }
      };

      const filteredCommandPeserta = useMemo(() => {
        return pesertaUjian.filter(pu => {
          const sesi = sesiUjian.find(s => s.id_sesi === pu.id_sesi);
          const paket = paketSoal.find(p => p.id_paket === sesi?.id_paket);
          if (ccFilterMapel !== 'ALL' && paket?.mata_pelajaran !== ccFilterMapel) return false;
          if (ccFilterSesi !== 'ALL' && String(pu.id_sesi) !== String(ccFilterSesi)) return false;
          return true;
        });
      }, [pesertaUjian, sesiUjian, paketSoal, ccFilterMapel, ccFilterSesi]);

      const ccStats = useMemo(() => {
        const selesai = filteredCommandPeserta.filter(p => p.status_pengerjaan === 'selesai').length;
        const sedang = filteredCommandPeserta.filter(p => p.status_pengerjaan === 'sedang_mengerjakan').length;
        const belum = filteredCommandPeserta.filter(p => p.status_pengerjaan === 'belum').length;
        const dihentikan = filteredCommandPeserta.filter(p => p.status_pengerjaan === 'dihentikan_sistem').length;
        const total = Math.max(1, filteredCommandPeserta.length);
        return { selesai, sedang, belum, dihentikan, total };
      }, [filteredCommandPeserta]);

      const filteredUsers = useMemo(() => {
        return users.filter(u => {
          if (akunFilterJurusan !== 'ALL' && u.jurusan !== akunFilterJurusan) return false;
          if (akunFilterKelas !== 'ALL' && u.kelas !== akunFilterKelas) return false;
          if (akunFilterAgama !== 'ALL' && u.agama !== akunFilterAgama) return false;
          if (akunSearch.trim()) {
            const q = akunSearch.toLowerCase();
            if (!u.nama_lengkap.toLowerCase().includes(q) && !u.username_nisn.toLowerCase().includes(q)) return false;
          }
          return true;
        });
      }, [users, akunFilterJurusan, akunFilterKelas, akunFilterAgama, akunSearch]);

      const filteredStaffUsers = useMemo(() => {
        return staffUsers.filter(st => {
          if (staffFilterRole !== 'ALL' && st.role !== staffFilterRole) return false;
          if (staffSearch.trim()) {
            const q = staffSearch.toLowerCase();
            if (!st.nama_lengkap.toLowerCase().includes(q) && !st.username_nip.toLowerCase().includes(q) && !st.mapel_jabatan.toLowerCase().includes(q)) return false;
          }
          return true;
        });
      }, [staffUsers, staffFilterRole, staffSearch]);

      const filteredPaketSoal = useMemo(() => {
        return paketSoal.filter(p => {
          if (soalFilterMapel !== 'ALL' && p.mata_pelajaran !== soalFilterMapel) return false;
          if (soalFilterKelas !== 'ALL' && p.kelas !== soalFilterKelas) return false;
          if (soalFilterJurusan !== 'ALL' && p.jurusan !== soalFilterJurusan) return false;
          return true;
        });
      }, [paketSoal, soalFilterMapel, soalFilterKelas, soalFilterJurusan]);

      const filteredSesi = useMemo(() => {
        return sesiUjian.filter(s => {
          const uj = masterUjian.find(u => u.id_ujian === s.id_ujian);
          const pkt = paketSoal.find(p => p.id_paket === s.id_paket);
          if (sesiSearch.trim()) {
            const q = sesiSearch.toLowerCase();
            if (!s.nama_sesi_spesifik.toLowerCase().includes(q) && !uj?.nama_ujian.toLowerCase().includes(q) && !pkt?.mata_pelajaran.toLowerCase().includes(q)) return false;
          }
          if (sesiFilterTanggal && !s.waktu_buka.startsWith(sesiFilterTanggal)) return false;
          return true;
        });
      }, [sesiUjian, masterUjian, paketSoal, sesiSearch, sesiFilterTanggal]);

      const availableEnrollStudents = useMemo(() => {
        if (!sesiModal) return [];
        return users.filter(u => {
          if (sesiModal.peserta_ids.includes(u.id_user)) return false;
          if (enrollFilterJurusan !== 'ALL' && u.jurusan !== enrollFilterJurusan) return false;
          if (enrollFilterKelas !== 'ALL' && u.kelas !== enrollFilterKelas) return false;
          if (enrollFilterAgama !== 'ALL' && u.agama !== enrollFilterAgama) return false;
          return true;
        });
      }, [users, sesiModal, enrollFilterJurusan, enrollFilterKelas, enrollFilterAgama]);

      const selectedEnrollStudents = useMemo(() => {
        if (!sesiModal) return [];
        return users.filter(u => sesiModal.peserta_ids.includes(u.id_user));
      }, [users, sesiModal]);

      const filteredRaporPeserta = useMemo(() => {
        return pesertaUjian.filter(pu => {
          const u = users.find(usr => usr.id_user === pu.id_user);
          const sesi = sesiUjian.find(s => s.id_sesi === pu.id_sesi);
          const paket = paketSoal.find(p => p.id_paket === sesi?.id_paket);
          if (raporFilterMapel !== 'ALL' && paket?.mata_pelajaran !== raporFilterMapel) return false;
          if (raporFilterKelas !== 'ALL' && u?.kelas !== raporFilterKelas) return false;
          return true;
        });
      }, [pesertaUjian, users, sesiUjian, paketSoal, raporFilterMapel, raporFilterKelas]);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-200 flex flex-col lg:flex-row">
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 max-w-sm animate-bounce">
              <div className={`flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border backdrop-blur-md ${
                toast.type === 'warning' ? 'bg-amber-950/95 border-amber-500 text-amber-100' : 'bg-emerald-950/95 border-emerald-500 text-emerald-100'
              }`}>
                <CheckCircle2 className="w-5 h-5 text-emerald-400 shrink-0" />
                <div>
                  <p className="font-bold text-sm">{toast.title}</p>
                  <p className="text-xs opacity-90">{toast.message}</p>
                </div>
              </div>
            </div>
          )}

          {/* SIDEBAR */}
          <aside className="w-full lg:w-72 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0">
            <div className="p-5 border-b border-slate-800 flex items-center gap-3">
              <SkaridaLogo className="w-12 h-12" />
              <div>
                <h1 className="font-extrabold text-white tracking-tight text-lg">SKARIDA CBT</h1>
                <p className="text-[10px] font-bold text-sky-400 uppercase tracking-widest">SMK Negeri 2 Tegalsari</p>
                <p className="text-[9px] text-slate-400 font-semibold">Dashboard Admin & Guru</p>
              </div>
            </div>

            <div className="p-3 space-y-1 flex-1 overflow-y-auto">
              <div className="px-3 py-1.5 text-[10px] font-bold uppercase tracking-widest text-slate-500">Live Monitoring</div>
              <SidebarBtn active={activeTab === 'command-center'} onClick={() => setActiveTab('command-center')} icon={Activity} label="Command Center" desc="Analitik & Anti-Cheat 3-Strike" />

              <div className="px-3 pt-4 pb-1.5 text-[10px] font-bold uppercase tracking-widest text-slate-500">Data Master</div>
              <SidebarBtn active={activeTab === 'master-ujian'} onClick={() => setActiveTab('master-ujian')} icon={Award} label="Manajemen Ujian" desc="Master Jenis & Nama Ujian" />
              <SidebarBtn active={activeTab === 'master-jurusan'} onClick={() => setActiveTab('master-jurusan')} icon={Building2} label="Manajemen Jurusan" desc="Kompetensi Keahlian SMK" />
              <SidebarBtn active={activeTab === 'master-kelas'} onClick={() => setActiveTab('master-kelas')} icon={GraduationCap} label="Manajemen Kelas" desc="Rombel Terhubung Jurusan" />

              <div className="px-3 pt-4 pb-1.5 text-[10px] font-bold uppercase tracking-widest text-slate-500">Persiapan Ujian</div>
              <SidebarBtn active={activeTab === 'manajemen-staff'} onClick={() => setActiveTab('manajemen-staff')} icon={ShieldCheck} label="User Admin & Guru" desc="CRUD Akun Admin & Guru Mapel" />
              <SidebarBtn active={activeTab === 'akun'} onClick={() => setActiveTab('akun')} icon={Users} label="Akun Peserta" desc="Dapodik, Filter Agama & Kartu" />
              <SidebarBtn active={activeTab === 'bank-soal'} onClick={() => setActiveTab('bank-soal')} icon={BookOpen} label="Bank Soal" desc="Auto-Load Soal & Opsi Gambar" />

            </div>

            <div className="p-4 border-t border-slate-800 bg-slate-900/50 space-y-2">

                {activeTab === 'master-jurusan' && <><Building2 className="w-5 h-5 text-indigo-400" /> Manajemen Master Jurusan</>}
                {activeTab === 'master-kelas' && <><GraduationCap className="w-5 h-5 text-indigo-400" /> Manajemen Master Kelas</>}

                {activeTab === 'akun' && <><Users className="w-5 h-5 text-indigo-400" /> Manajemen Akun Peserta</>}
                {activeTab === 'bank-soal' && <><BookOpen className="w-5 h-5 text-indigo-400" /> Bank Soal Multimedia & Opsi Dinamis</>}
                {activeTab === 'sesi' && <><CalendarClock className="w-5 h-5 text-indigo-400" /> Konfigurasi Sesi & Drag-Drop Enrollment</>}

                >
                  <Smartphone className="w-4 h-4" /> Simulator Proteksi HP (3-Strike)
                </button>
                <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg">
                  <Clock className="w-4 h-4 text-emerald-400" />
                  <span className="font-mono text-xs font-bold text-emerald-400">{formatTimer(serverSeconds)}</span>
                </div>

            </header>

            <div className="p-6 space-y-6">
              {/* 1. COMMAND CENTER */}
              {activeTab === 'command-center' && (
                <div className="space-y-6">
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-wrap items-end gap-4 justify-between">
                    <div className="flex flex-wrap items-end gap-4 flex-1">

                        <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Filter Mata Pelajaran</label>
                        <select value={ccFilterMapel} onChange={e => { setCcFilterMapel(e.target.value); setCcFilterSesi('ALL'); }} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                          <option value="ALL">Semua Mata Pelajaran</option>

                      <RefreshCw className={`w-3.5 h-3.5 ${isSyncing ? 'animate-spin text-sky-400' : ''}`} /> {isSyncing ? 'Menyinkronkan...' : 'Refresh dari Google Sheets'}
                    </button>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    {/* Doughnut Chart */}
                    <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col justify-between">

                      </div>
                      <div className="flex items-center gap-6 my-auto py-2">

                          <svg className="w-full h-full -rotate-90" viewBox="0 0 36 36">

                        }}
                        placeholder={`Opsi ${h}`}
                        className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white"
                      />
                    </div>
                  );
                })}
                <button
                  onClick={() => {
                    const item = { ...soalModal, id_soal: soalModal.id_soal || Date.now() };
                    if (soalModal.id_soal) {
                      setMasterSoal(masterSoal.map(s => s.id_soal === item.id_soal ? item : s));
                    } else {
                      setMasterSoal([...masterSoal, item]);
                    }
                    setSoalModal(null);
                    triggerToast('Soal Disimpan', 'Butir soal berhasil disimpan.');
                  }}
                  className="w-full py-2.5 bg-indigo-600 text-white font-bold rounded-xl"
                >
                  Simpan Butir Soal
                </button>
              </div>
            </SimpleModal>
          )}

          {/* MODAL PREVIEW SOAL */}
          {previewSoalModal && (
            <SimpleModal title="Preview Butir Soal" onClose={() => setPreviewSoalModal(null)}>
              <div className="space-y-3 text-xs">
                <p className="text-white font-semibold">{previewSoalModal.teks_pertanyaan}</p>
                {previewSoalModal.tipe_soal === 'PG' && (previewSoalModal.opsi || []).slice(0, previewSoalModal.jumlah_opsi || 4).map((op, idx) => (
                  <div key={idx} className="p-2 rounded-lg bg-slate-950 border border-slate-800">
                    {String.fromCharCode(65 + idx)}. {op}
                  </div>
                ))}
              </div>
            </SimpleModal>
          )}

          {/* MODAL KONFIGURASI SESI */}
          {sesiModal && (
            <SimpleModal title={sesiModal.id_sesi ? 'Edit Sesi Ujian' : 'Tambah Sesi Ujian'} onClose={() => setSesiModal(null)}>
              <div className="space-y-3 text-xs">
                <input type="text" value={sesiModal.nama_sesi_spesifik} onChange={e => setSesiModal({ ...sesiModal, nama_sesi_spesifik: e.target.value })} placeholder="Nama Sesi Spesifik" className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-[10px] text-slate-400 mb-1">Waktu Buka</label>
                    <input type="datetime-local" value={sesiModal.waktu_buka} onChange={e => setSesiModal({ ...sesiModal, waktu_buka: e.target.value })} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-2 py-1.5 text-white" />
                  </div>
                  <div>
                    <label className="block text-[10px] text-slate-400 mb-1">Waktu Tutup</label>
                    <input type="datetime-local" value={sesiModal.waktu_tutup} onChange={e => setSesiModal({ ...sesiModal, waktu_tutup: e.target.value })} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-2 py-1.5 text-white" />
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-[10px] text-slate-400 mb-1">Durasi (Menit)</label>
                    <input type="number" value={sesiModal.durasi_menit} onChange={e => setSesiModal({ ...sesiModal, durasi_menit: Number(e.target.value) })} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-white" />
                  </div>
                  <div>
                    <label className="block text-[10px] text-amber-400 mb-1">Minimal Submit (Menit)</label>
                    <input type="number" value={sesiModal.minimal_menit_submit} onChange={e => setSesiModal({ ...sesiModal, minimal_menit_submit: Number(e.target.value) })} className="w-full bg-slate-950 border border-amber-500/40 rounded-xl px-3 py-1.5 text-amber-300" />
                  </div>
                </div>
                <button
                  onClick={() => {
                    const item = { ...sesiModal, id_sesi: sesiModal.id_sesi || Date.now() };
                    if (sesiModal.id_sesi) {
                      setSesiUjian(sesiUjian.map(s => s.id_sesi === item.id_sesi ? item : s));
                    } else {
                      setSesiUjian([...sesiUjian, item]);
                    }
                    setSesiModal(null);
                    triggerToast('Sesi Disimpan', 'Konfigurasi sesi ujian berhasil disimpan.');
                  }}
                  className="w-full py-2.5 bg-indigo-600 text-white font-bold rounded-xl"
                >
                  Simpan Konfigurasi Sesi
                </button>
              </div>
            </SimpleModal>
          )}

          {/* MODAL CETAK KARTU LOGIN */}
          {showKartuModal && (
            <SimpleModal title="Preview Cetak Kartu Login Peserta" onClose={() => setShowKartuModal(false)}>
              <div className="space-y-2.5 max-h-[60vh] overflow-y-auto bg-white text-slate-900 p-3 rounded-xl text-xs">
                {filteredUsers.map(u => (
                  <div key={u.id_user} className="border border-slate-800 rounded-lg p-2.5">
                    <div className="font-bold text-center border-b pb-1 mb-1">KARTU LOGIN SKARIDA CBT — SMKN 2 TEGALSARI</div>
                    <div>Nama: <b>{u.nama_lengkap}</b></div>
                    <div>NISN: <b className="font-mono text-indigo-700">{u.username_nisn}</b> | Pass: <b className="font-mono text-red-600">{u.password_plain}</b></div>
                  </div>
                ))}
              </div>
            </SimpleModal>
          )}

          {/* MODAL BERITA ACARA */}
          {showBeritaAcaraModal && (
            <SimpleModal title="Preview PDF Berita Acara & Audit Pelanggaran" onClose={() => setShowBeritaAcaraModal(false)}>
              <div className="space-y-2 max-h-[60vh] overflow-y-auto bg-white text-slate-900 p-4 rounded-xl text-xs">
                <div className="font-black text-center border-b-2 border-slate-900 pb-2">
                  SMK NEGERI 2 TEGALSARI - BANYUWANGI<br />BERITA ACARA & AUDIT HASIL UJIAN SKARIDA CBT
                </div>
                {filteredRaporPeserta.map(pu => {
                  const u = users.find(usr => usr.id_user === pu.id_user);
                  return (
                    <div key={pu.id_peserta_ujian} className="border-b py-1.5 flex justify-between">
                      <span><b>{u?.nama_lengkap}</b> ({hitungDurasiAktual(pu.waktu_mulai, pu.waktu_selesai)})</span>
                      <span>Pelanggaran: {pu.jumlah_pelanggaran}x | Nilai: <b>{Number(pu.skor_pg) + Number(pu.skor_uraian)}</b></span>
                    </div>
                  );
                })}
              </div>
            </SimpleModal>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminDashboardApp />);
  </script>
</body>
</html>
