    const inferTingkatFromKelas = (namaKelas, fallback = 'X') => {

    // =========================================================================

    const MATH_TEMPLATES = [

    // =========================================================================

    const GREEK_UNICODE_MAP = {
      'α': '\\alpha ', 'β': '\\beta ', 'γ': '\\gamma ', 'δ': '\\delta ', 'ε': '\\varepsilon ',
      'ζ': '\\zeta ', 'η': '\\eta ', 'θ': '\\theta ', 'ϑ': '\\vartheta ', 'ι': '\\iota ',

    const SUPERSCRIPT_CHAR_MAP = {
      '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9',
      '⁺': '+', '⁻': '-', '⁼': '=', '⁽': '(', '⁾': ')', 'ⁿ': 'n', 'ⁱ': 'i'

    const SUBSCRIPT_CHAR_MAP = {
      '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9',

    // Menormalkan huruf/angka khusus Mathematical Alphanumeric dari Microsoft Word (U+1D400 - U+1D7FF)
    const normalizeWordMathUnicodeChars = (input) => {
      if (!input) return { text: '', hadWordMathFont: false };
      let hadWordMathFont = false;
      const chars = Array.from(String(input));
      const out = chars.map((ch) => {
        const cp = ch.codePointAt(0);
        if (!cp) return ch;

        // Mathematical Alphanumeric Symbols (sering dihasilkan saat copy rumus dari MS Word)
        if (cp >= 0x1D400 && cp <= 0x1D7FF) {
          hadWordMathFont = true;
          // Bold, Italic, Bold-Italic Latin (A-Z, a-z)
          const latinRanges = [
            [0x1D400, 0x1D419, 65], [0x1D41A, 0x1D433, 97], // Bold
            [0x1D434, 0x1D44D, 65], [0x1D44E, 0x1D467, 97], // Italic
            [0x1D468, 0x1D481, 65], [0x1D482, 0x1D49B, 97], // Bold Italic
            [0x1D49C, 0x1D4B5, 65], [0x1D4B6, 0x1D4CF, 97], // Script
            [0x1D5A0, 0x1D5B9, 65], [0x1D5BA, 0x1D5D3, 97], // Sans-serif
            [0x1D608, 0x1D621, 65], [0x1D622, 0x1D63B, 97]  // Sans-serif Italic
          ];
          for (const [start, end, base] of latinRanges) {
            if (cp >= start && cp <= end) return String.fromCharCode(base + (cp - start));
          }
          // Mathematical Digits (0-9)
          const digitRanges = [0x1D7CE, 0x1D7D8, 0x1D7E2, 0x1D7EC, 0x1D7F6];
          for (const dStart of digitRanges) {
            if (cp >= dStart && cp <= dStart + 9) return String.fromCharCode(48 + (cp - dStart));
          }
          // Mathematical Italic Greek lowercase (𝛼 - 𝜔)
          if (cp >= 0x1D6FC && cp <= 0x1D714) {
            const greekList = ['α','β','γ','δ','ε','ζ','η','θ','ι','κ','λ','μ','ν','ξ','ο','π','ρ','ς','σ','τ','υ','φ','χ','ψ','ω'];
            return greekList[cp - 0x1D6FC] || ch;
          }
          // Mathematical Italic Greek uppercase (𝛢 - 𝛺)
          if (cp >= 0x1D6E2 && cp <= 0x1D6FA) {
            const greekUpper = ['Α','Β','Γ','Δ','Ε','Ζ','Η','Θ','Ι','Κ','Λ','Μ','Ν','Ξ','Ο','Π','Ρ','Θ','Σ','Τ','Υ','Φ','Χ','Ψ','Ω'];
            return greekUpper[cp - 0x1D6E2] || ch;
          }
        }
        if (cp === 0x210E) { hadWordMathFont = true; return 'h'; } // Planck constant italic h dari Word
        if (cp === 0x2212) return '-'; // Minus sign Word
        if (cp === 0x2215 || cp === 0x2044) { hadWordMathFont = true; return '/'; } // Fraction slash Word
        if (cp === 0x2592) { hadWordMathFont = true; return ' '; } // Word n-ary placeholder ▒
        return ch;
      });
      return { text: out.join(''), hadWordMathFont };
    };

    // Mengonversi ekspresi Linear / UnicodeMath dari Microsoft Word menjadi LaTeX KaTeX
    const convertWordLinearExprToLatex = (rawExpr) => {
      if (!rawExpr) return '';
      let s = normalizeWordMathUnicodeChars(rawExpr).text;

      // Bersihkan kurung grup khusus Word Equation (〖 dan 〗)
      s = s.replace(/〖/g, '{').replace(/〗/g, '}').replace(/▒/g, ' ');

      // Konversi rangkaian karakter superscript Unicode (misal x²⁺¹ -> x^{2+1})
      s = s.replace(/([⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻⁼⁽⁾ⁿⁱ]+)/g, (match) => {
        const mapped = Array.from(match).map(c => SUPERSCRIPT_CHAR_MAP[c] || c).join('');
        return `^{${mapped}}`;
      });

      // Konversi rangkaian karakter subscript Unicode (misal x₁₊₂ -> x_{1+2})
      s = s.replace(/([₀₁₂₃₄₅₆₇₈₉₊₋₌₍₎ₐₑₒₓᵢⱼₖₙₘ]+)/g, (match) => {
        const mapped = Array.from(match).map(c => SUBSCRIPT_CHAR_MAP[c] || c).join('');
        return `_{${mapped}}`;
      });

      // Integral, Sigma, Limit khas Word: ∫_a^b, ∑_(i=1)^n, lim_(x→0)
      s = s.replace(/∫_(\([^()]+\)|\{[^{}]+\}|[^\s^]+)\^(\([^()]+\)|\{[^{}]+\}|[^\s]+)/g, (_, sub, sup) => {
        const cleanSub = sub.replace(/^[\(\{]|[\)\}]$/g, '');
        const cleanSup = sup.replace(/^[\(\{]|[\)\}]$/g, '');
        return `\\int_{${cleanSub}}^{${cleanSup}} `;
      });
      s = s.replace(/∫/g, '\\int ');

      s = s.replace(/∑_(\([^()]+\)|\{[^{}]+\}|[^\s^]+)\^(\([^()]+\)|\{[^{}]+\}|[^\s]+)/g, (_, sub, sup) => {
        const cleanSub = sub.replace(/^[\(\{]|[\)\}]$/g, '');
        const cleanSup = sup.replace(/^[\(\{]|[\)\}]$/g, '');
        return `\\sum_{${cleanSub}}^{${cleanSup}} `;
      });
      s = s.replace(/∑/g, '\\sum ');

      s = s.replace(/\blim_(\([^()]+\)|\{[^{}]+\}|[^\s]+)/gi, (_, sub) => {
        const cleanSub = sub.replace(/^[\(\{]|[\)\}]$/g, '').replace(/->|→/g, '\\to ');
        return `\\lim_{${cleanSub}} `;
      });

      // Akar pangkat & Akar kuadrat dari Word: √(x+1), ∛(x), ∜(x), √x
      s = s.replace(/∛\(([^()]+)\)/g, '\\sqrt[3]{$1}')
           .replace(/∛\{([^{}]+)\}/g, '\\sqrt[3]{$1}')
           .replace(/∛([a-zA-Z0-9]+)/g, '\\sqrt[3]{$1}')
           .replace(/∜\(([^()]+)\)/g, '\\sqrt[4]{$1}')
           .replace(/∜([a-zA-Z0-9]+)/g, '\\sqrt[4]{$1}')
           .replace(/√\(([^()]+)\)/g, '\\sqrt{$1}')
           .replace(/√\{([^{}]+)\}/g, '\\sqrt{$1}')
           .replace(/√([a-zA-Z0-9]+)/g, '\\sqrt{$1}');

      // Pecahan bersarang / kurung dari Word: (a+b)/(c+d) atau {a+b}/{c+d}
      s = s.replace(/\(([^()]+)\)\s*\/\s*\(([^()]+)\)/g, '\\frac{$1}{$2}');
      s = s.replace(/\{([^{}]+)\}\s*\/\s*\{([^{}]+)\}/g, '\\frac{$1}{$2}');
      s = s.replace(/\(([^()]+)\)\s*\/\s*([a-zA-Z0-9_^{}]+)/g, '\\frac{$1}{$2}');
      s = s.replace(/([a-zA-Z0-9_^{}]+)\s*\/\s*\(([^()]+)\)/g, '\\frac{$1}{$2}');

      // Pangkat & Subscript dengan kurung biasa dari Word: x^(2n+1) atau x_(i+1)
      s = s.replace(/\^\(([^()]+)\)/g, '^{$1}');
      s = s.replace(/_\(([^()]+)\)/g, '_{$1}');

      // Simbol operator & relasi matematika
      s = s.replace(/±/g, '\\pm ')
           .replace(/×/g, '\\times ')
           .replace(/÷/g, '\\div ')
           .replace(/⋅|∙/g, '\\cdot ')
           .replace(/≤/g, '\\le ')
           .replace(/≥/g, '\\ge ')
           .replace(/≠/g, '\\ne ')
           .replace(/≈/g, '\\approx ')
           .replace(/∞/g, '\\infty ')
           .replace(/→|->/g, '\\to ')
           .replace(/⇒/g, '\\Rightarrow ')
           .replace(/⇔/g, '\\Leftrightarrow ')
           .replace(/⊥/g, '\\perp ')
           .replace(/∥/g, '\\parallel ')
           .replace(/∠/g, '\\angle ');

    // Parser rekursif XML OMML (<m:oMath>) & MathML (<math>) dari Clipboard Microsoft Word ke LaTeX
    const parseWordMathXmlNodeToLatex = (node) => {
      if (!node) return '';
      if (node.nodeType === 3) {
        return convertWordLinearExprToLatex(node.nodeValue || '');
      }
      if (node.nodeType !== 1) return '';

      const rawTag = (node.tagName || node.nodeName || '').toLowerCase();
      const tag = rawTag.includes(':') ? rawTag.split(':')[1] : rawTag;

      const getChildByLocalName = (parent, localNames) => {
        const list = Array.isArray(localNames) ? localNames : [localNames];
        for (const ch of Array.from(parent.childNodes || [])) {
          if (ch.nodeType === 1) {
            const t = (ch.tagName || ch.nodeName || '').toLowerCase();
            const shortT = t.includes(':') ? t.split(':')[1] : t;
            if (list.includes(shortT)) return ch;
          }
        }
        return null;
      };

      const getChildrenByLocalName = (parent, localName) => {
        return Array.from(parent.childNodes || []).filter(ch => {
          if (ch.nodeType !== 1) return false;
          const t = (ch.tagName || ch.nodeName || '').toLowerCase();
          const shortT = t.includes(':') ? t.split(':')[1] : t;
          return shortT === localName;
        });
      };

      const childrenLatex = () => Array.from(node.childNodes || []).map(parseWordMathXmlNodeToLatex).join('');

      // Abaikan properti metadata XML Word (rPr, fPr, radPr, sSupPr, dPr, ctrlPr, dll.)
      if (tag.endsWith('pr') || tag === 'argpr' || tag === 'annotation') return '';

      // 1. Pecahan Word OMML (<m:f>) & MathML (<mfrac>)
      if (tag === 'f' || tag === 'mfrac') {
        const num = getChildByLocalName(node, 'num') || node.children?.[0];
        const den = getChildByLocalName(node, 'den') || node.children?.[1];
        return `\\frac{${parseWordMathXmlNodeToLatex(num)}}{${parseWordMathXmlNodeToLatex(den)}}`;
      }

      // 2. Akar Word OMML (<m:rad>) & MathML (<msqrt>, <mroot>)
      if (tag === 'rad') {
        const deg = getChildByLocalName(node, 'deg');
        const base = getChildByLocalName(node, 'e');
        const degStr = parseWordMathXmlNodeToLatex(deg).trim();
        const baseStr = parseWordMathXmlNodeToLatex(base).trim();
        return degStr ? `\\sqrt[${degStr}]{${baseStr}}` : `\\sqrt{${baseStr}}`;
      }
      if (tag === 'msqrt') return `\\sqrt{${childrenLatex()}}`;
      if (tag === 'mroot') {
        const base = node.children?.[0];
        const deg = node.children?.[1];
        return `\\sqrt[${parseWordMathXmlNodeToLatex(deg)}]{${parseWordMathXmlNodeToLatex(base)}}`;
      }

      // 3. Pangkat & Subscript Word OMML (sSup, sSub, sSubSup) & MathML (msup, msub, msubsup)
      if (tag === 'ssup' || tag === 'msup') {
        const base = getChildByLocalName(node, 'e') || node.children?.[0];
        const sup = getChildByLocalName(node, 'sup') || node.children?.[1];
        return `{${parseWordMathXmlNodeToLatex(base)}}^{${parseWordMathXmlNodeToLatex(sup)}}`;
      }
      if (tag === 'ssub' || tag === 'msub') {
        const base = getChildByLocalName(node, 'e') || node.children?.[0];
        const sub = getChildByLocalName(node, 'sub') || node.children?.[1];
        return `{${parseWordMathXmlNodeToLatex(base)}}_{${parseWordMathXmlNodeToLatex(sub)}}`;
      }
      if (tag === 'ssubsup' || tag === 'msubsup' || tag === 'munderover') {
        const base = getChildByLocalName(node, 'e') || node.children?.[0];
        const sub = getChildByLocalName(node, 'sub') || node.children?.[1];
        const sup = getChildByLocalName(node, 'sup') || node.children?.[2];
        return `{${parseWordMathXmlNodeToLatex(base)}}_{${parseWordMathXmlNodeToLatex(sub)}}^{${parseWordMathXmlNodeToLatex(sup)}}`;
      }

      // 4. Integral / Sigma / N-ary Word OMML (<m:nary>)
      if (tag === 'nary') {
        const naryPr = getChildByLocalName(node, 'narypr');
        const chrNode = naryPr ? getChildByLocalName(naryPr, 'chr') : null;
        const chrVal = chrNode ? (chrNode.getAttribute('m:val') || chrNode.getAttribute('val') || '∫') : '∫';
        let op = '\\int';
        if (chrVal.includes('∑')) op = '\\sum';
        else if (chrVal.includes('∏')) op = '\\prod';
        const sub = parseWordMathXmlNodeToLatex(getChildByLocalName(node, 'sub')).trim();
        const sup = parseWordMathXmlNodeToLatex(getChildByLocalName(node, 'sup')).trim();
        const body = parseWordMathXmlNodeToLatex(getChildByLocalName(node, 'e')).trim();
        return `${op}${sub ? `_{${sub}}` : ''}${sup ? `^{${sup}}` : ''} ${body}`;
      }

      // 5. Fungsi Matematika Word OMML (<m:func>: sin, cos, tan, log, lim) & Limit (<m:limLow>)
      if (tag === 'func') {
        const fName = parseWordMathXmlNodeToLatex(getChildByLocalName(node, 'fname')).trim();
        const body = parseWordMathXmlNodeToLatex(getChildByLocalName(node, 'e')).trim();
        return `${fName} {${body}}`;
      }
      if (tag === 'limlow' || tag === 'munder') {
        const base = getChildByLocalName(node, 'e') || node.children?.[0];
        const lim = getChildByLocalName(node, 'lim') || node.children?.[1];
        return `{${parseWordMathXmlNodeToLatex(base)}}_{${parseWordMathXmlNodeToLatex(lim)}}`;
      }

      // 6. Kurung Delimiter & Matriks Word OMML (<m:d>, <m:m>) & MathML (<mfenced>, <mtable>)
      if (tag === 'd' || tag === 'mfenced') {
        const dPr = getChildByLocalName(node, 'dpr');
        const begNode = dPr ? getChildByLocalName(dPr, 'begchr') : null;
        const endNode = dPr ? getChildByLocalName(dPr, 'endchr') : null;
        const begChr = begNode ? (begNode.getAttribute('m:val') || begNode.getAttribute('val') || '(') : (node.getAttribute('open') || '(');
        const endChr = endNode ? (endNode.getAttribute('m:val') || endNode.getAttribute('val') || ')') : (node.getAttribute('close') || ')');
        const eNodes = getChildrenByLocalName(node, 'e');
        const inner = eNodes.length > 0 ? eNodes.map(parseWordMathXmlNodeToLatex).join(', ') : childrenLatex();
        return `\\left${begChr === '{' ? '\\{' : begChr} ${inner} \\right${endChr === '}' ? '\\}' : endChr}`;
      }
      if (tag === 'm' || tag === 'mtable') {
        const rows = getChildrenByLocalName(node, tag === 'm' ? 'mr' : 'mtr');
        const rowsLatex = rows.map(r => {
          const cells = getChildrenByLocalName(r, tag === 'm' ? 'e' : 'mtd');
          return cells.map(parseWordMathXmlNodeToLatex).join(' & ');
        }).join(' \\\\ ');
        return `\\begin{matrix} ${rowsLatex} \\end{matrix}`;
      }

      // 7. Bar / Aksen / Vektor di atas huruf (<m:bar>, <m:acc>, <mover>)
      if (tag === 'bar' || tag === 'mover') {
        const base = getChildByLocalName(node, 'e') || node.children?.[0];
        return `\\overline{${parseWordMathXmlNodeToLatex(base)}}`;
      }
      if (tag === 'acc') {
        const base = getChildByLocalName(node, 'e');
        return `\\vec{${parseWordMathXmlNodeToLatex(base)}}`;
      }

      return childrenLatex();
    };

    // Mengolah HTML Clipboard dari Microsoft Word menjadi teks soal + tag format + rumus LaTeX ($...$)
    const parseWordClipboardHtml = (htmlData, plainData) => {
      if (!htmlData) return null;

      // Buka komentar kondisional MS Word Equation (<!--[if gte msEquation 12]><m:oMath>...</m:oMath><![endif]-->)
      let cleanedHtml = htmlData
        .replace(/<!--\[if[^\]]*msEquation[^\]]*\]>([\s\S]*?)<!\[endif\]-->/gi, '$1')
        .replace(/<!--\[if[^\]]*\]>[\s\S]*?<!\[endif\]-->/gi, '');

      const hasWordMathTags = /<(\w+:)?(oMath|oMathPara|math)\b/i.test(cleanedHtml);
      const hasWordFormatting = /mso-|urn:schemas-microsoft-com|<(\w+:)?(oMath|math)|<(b|strong|i|em|u|sup|sub)\b/i.test(cleanedHtml);

      if (!hasWordMathTags && !hasWordFormatting) return null;

      try {
        const parser = new DOMParser();
        const doc = parser.parseFromString(cleanedHtml, 'text/html');

        // Hapus style, meta, xml head, dan gambar fallback persamaan Word yang rusak
        doc.querySelectorAll('style, meta, link, script, xml, title, v\\:shape, v\\:imagedata').forEach(el => el.remove());

        const walkDom = (node) => {
          if (!node) return '';
          if (node.nodeType === 3) {
            const raw = node.nodeValue || '';
            const norm = normalizeWordMathUnicodeChars(raw);
            if (norm.hadWordMathFont) {
              return `$${convertWordLinearExprToLatex(raw)}$`;
            }
            return norm.text;
          }
          if (node.nodeType !== 1) return '';

          const rawTag = (node.tagName || node.nodeName || '').toLowerCase();
          const tag = rawTag.includes(':') ? rawTag.split(':')[1] : rawTag;

          // Jika bertemu blok Equation Microsoft Word (<m:oMath> atau <math>)
          if (tag === 'omath' || tag === 'omathpara' || tag === 'math') {
            const latex = parseWordMathXmlNodeToLatex(node).replace(/\s+/g, ' ').trim();
            return latex ? ` $${latex}$ ` : '';
          }

          // Abaikan gambar lokal file:/// dari clipboard Word
          if (tag === 'img') return '';

          const inner = Array.from(node.childNodes || []).map(walkDom).join('');
          if (!inner.trim() && tag !== 'br') return '';

          const styleAttr = (node.getAttribute('style') || '').toLowerCase();

          if (tag === 'b' || tag === 'strong' || styleAttr.includes('font-weight:bold') || styleAttr.includes('font-weight: bold')) {
            return `<b>${inner}</b>`;
          }
          if (tag === 'i' || tag === 'em' || styleAttr.includes('font-style:italic') || styleAttr.includes('font-style: italic')) {
            return `<i>${inner}</i>`;
          }
          if (tag === 'u' || styleAttr.includes('text-decoration:underline') || styleAttr.includes('text-decoration: underline')) {
            return `<u>${inner}</u>`;
          }
          if (tag === 'sup' || styleAttr.includes('vertical-align:super') || styleAttr.includes('vertical-align: super')) {
            return `<sup>${inner}</sup>`;
          }
          if (tag === 'sub' || styleAttr.includes('vertical-align:sub') || styleAttr.includes('vertical-align: sub')) {
            return `<sub>${inner}</sub>`;
          }
          if (tag === 'br') return '\n';
          if (tag === 'p' || tag === 'div' || tag === 'tr' || tag === 'li') {
            return `${inner.trim()}\n`;
          }
          return inner;
        };

        let result = walkDom(doc.body)
          .replace(/\$\s*\$/g, ' ')
          .replace(/[ \t]+\n/g, '\n')
          .replace(/\n{3,}/g, '\n\n')
          .trim();

        return result || null;
      } catch (err) {
        return null;
      }
    };

    // Mendeteksi rumus/ekspresi matematika dari teks biasa (ketikan langsung atau paste plain-text dari Word)
    const autoUpgradeWordMathInPlainText = (rawStr) => {
      if (!rawStr) return '';
      let str = String(rawStr);

      // Lindungi blok $...$ yang sudah ada
      const existingMath = [];
      str = str.replace(/\$\$?[\s\S]+?\$\$?/g, (m) => {
        existingMath.push(m);
        return `@@EXISTING_MATH_${existingMath.length - 1}@@`;
      });

      // 1. Jika terdapat karakter Unicode Mathematical Alphanumeric khas Word (𝑥, 𝑦, 𝑎, 𝑏, dll.)
      str = str.replace(/([\uD835][\uDC00-\uDFFF]|[〖〗▒√∛∜∫∑])+/g, (seg) => {
        return convertWordLinearExprToLatex(seg);
      });

      // 2. Deteksi otomatis pola rumus Word tanpa tanda $ (Akar, Pecahan kurung, Integral, Sigma, Limit, Logaritma)
      // Pola Akar: √(x+2) atau √25
      str = str.replace(/(∛|∜|√)\s*(\([^()]+\)|\{[^{}]+\}|[a-zA-Z0-9_^{}+-]+)/g, (match) => {
        return `$${convertWordLinearExprToLatex(match)}$`;
      });

      // Pola Pecahan Kurung: (2x + 3)/(x - 1)
      str = str.replace(/\(([^()\n]+)\)\s*\/\s*\(([^()\n]+)\)/g, (_, num, den) => {
        return `$\\frac{${convertWordLinearExprToLatex(num)}}{${convertWordLinearExprToLatex(den)}}$`;
      });

      // Pola Limit, Sigma, Integral: lim_(x->0), ∑_(i=1)^n, ∫_a^b
      str = str.replace(/\b(lim)_(\([^()]+\)|\{[^{}]+\}|[^\s]+)/gi, (match) => {
        return `$${convertWordLinearExprToLatex(match)}$`;
      });
      str = str.replace(/(∫|∑)_(\([^()]+\)|\{[^{}]+\}|[^\s^]+)\^(\([^()]+\)|\{[^{}]+\}|[^\s]+)/g, (match) => {
        return `$${convertWordLinearExprToLatex(match)}$`;
      });

      // Pola perintah LaTeX yang diketik/paste tanpa tanda $ (misal: \frac{a}{b}, \sqrt{x})
      str = str.replace(/(\\(?:frac|sqrt|int|sum|lim|sin|cos|tan|log|alpha|beta|gamma|theta|pi|infty|le|ge|ne|pm|times|div)\b(?:\s*\[[^\]]*\])?(?:\s*\{[^{}]*\})*)/g, (match) => {
        return `$${match}$`;
      });

      // Kembalikan blok $...$ yang sudah ada
      str = str.replace(/@@EXISTING_MATH_(\d+)@@/g, (_, idx) => existingMath[Number(idx)] || '');
      return str;
    };

    const renderRichMathHtml = (rawText) => {
      if (rawText === null || rawText === undefined || rawText === '') return '';
      // Deteksi otomatis rumus & simbol dari Microsoft Word sebelum dirender
      let str = autoUpgradeWordMathInPlainText(String(rawText));

      // 1. Amankan blok rumus LaTeX $$...$$ dan $...$ agar tidak terganggu sanitasi HTML
      const mathTokens = [];
      str = str.replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => {
        const idx = mathTokens.length;
        const cleanTex = convertWordLinearExprToLatex(tex);
        let rendered = `$$${cleanTex}$$`;
        if (window.katex) {
          try {
            rendered = window.katex.renderToString(cleanTex.trim(), { displayMode: true, throwOnError: false });
          } catch (_) {}
        }
        mathTokens.push(rendered);
        return `@@MATH_TOKEN_${idx}@@`;
      });

      str = str.replace(/\$([^\$\n]+?)\$/g, (_, tex) => {
        const idx = mathTokens.length;
        const cleanTex = convertWordLinearExprToLatex(tex);
        let rendered = `$${cleanTex}$`;
        if (window.katex) {
          try {
            rendered = window.katex.renderToString(cleanTex.trim(), { displayMode: false, throwOnError: false });
          } catch (_) {}
        }
        mathTokens.push(rendered);
        return `@@MATH_TOKEN_${idx}@@`;
      });

      // 2. Escape karakter HTML berbahaya selain tag format yang diizinkan (<b>, <i>, <u>, <sup>, <sub>, <br>)
      str = str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // 3. Kembalikan tag format yang diizinkan (Bold, Italic, Underline, Sup, Sub, Br)
      str = str
        .replace(/&lt;(\/?(b|strong|i|em|u|sup|sub))&gt;/gi, '<$1>')
        .replace(/&lt;br\s*\/?&gt;/gi, '<br/>');

      // Dukungan sintaks cepat **tebal** dan __garis bawah__
      str = str
        .replace(/\*\*([^\*]+)\*\*/g, '<b>$1</b>')
        .replace(/__([^_]+)__/g, '<u>$1</u>');

      // 4. Ubah karakter Enter (\n) menjadi ganti baris <br/>
      str = str.replace(/\r?\n/g, '<br/>');

      // 5. Kembalikan token rumus matematika KaTeX
      str = str.replace(/@@MATH_TOKEN_(\d+)@@/g, (_, i) => mathTokens[Number(i)] || '');

      return str;
    };

    function RichMathText({ text, className = '', placeholder = '' }) {

        const el = textareaRef.current;
        const currentVal = String(value ?? '');
        if (!el) {
          onChange(`${currentVal}${openTag}${defaultText}${closeTag}`);
          return;
        }
        const start = el.selectionStart ?? currentVal.length;
        const end = el.selectionEnd ?? currentVal.length;
        const selected = currentVal.slice(start, end) || defaultText;
        const nextVal = currentVal.slice(0, start) + openTag + selected + closeTag + currentVal.slice(end);
        onChange(nextVal);
        setTimeout(() => {
          el.focus();
          el.setSelectionRange(start + openTag.length, start + openTag.length + selected.length);
        }, 10);
      };

      const insertAtCursor = (snippet) => {
        const el = textareaRef.current;
        const currentVal = String(value ?? '');
        if (!el) {
          onChange(`${currentVal}${snippet}`);
          return;
        }
        const start = el.selectionStart ?? currentVal.length;
        const end = el.selectionEnd ?? currentVal.length;
        const nextVal = currentVal.slice(0, start) + snippet + currentVal.slice(end);

        // 1. Cek apakah clipboard berisi HTML Equation / Format dari Microsoft Word

          e.preventDefault();
          insertAtCursor(parsedFromHtml);
          setWordDetectedBadge(true);

          return;

        // 2. Cek apakah plain text mengandung karakter/pola UnicodeMath dari Microsoft Word

          const hasLinearMath = /(√|∛|∜|∫|∑|〖|〗|▒|\([^()]+\)\s*\/\s*\([^()]+\)|\blim_)/i.test(plainData);

            wrapSelection('<u>', '</u>', 'garis bawah');
          }

        if (e.key === 'Enter') {
          e.stopPropagation();
        }
      };

      const hasFormattingOrMath = Boolean(
        value && (/(\$|\\[a-zA-Z]+|<\/?(b|i|u|sup|sub)>|\n|[√∛∜∫∑±×÷≤≥≠≈∞πθ°²³⁴]|[\uD835][\uDC00-\uDFFF]|\([^()]+\)\/\([^()]+\))/i.test(String(value)))
      );

      return (
        <div className="space-y-1.5 w-full">
          {(label || rightSlot) && (
            <div className="flex flex-wrap justify-between items-center gap-2">
              {label}

          <div className="bg-slate-900 border border-slate-700 rounded-xl overflow-hidden focus-within:border-indigo-500 transition">
            <div className="flex flex-wrap items-center justify-between gap-1 px-2 py-1.5 bg-slate-950/90 border-b border-slate-800 text-[11px]">
              <div className="flex flex-wrap items-center gap-1">
                <button
                  type="button"
                  onClick={() => wrapSelection('<b>', '</b>', 'tebal')}
                  className="px-2 py-1 rounded-lg bg-slate-800 hover:bg-indigo-600 text-white font-black border border-slate-700 transition"
                  title="Tebal / Bold (Ctrl+B)"
                >
                  B
                </button>
                <button
                  type="button"
                  onClick={() => wrapSelection('<i>', '</i>', 'miring')}
                  className="px-2 py-1 rounded-lg bg-slate-800 hover:bg-indigo-600 text-white italic font-serif font-bold border border-slate-700 transition"
                  title="Miring / Italic (Ctrl+I)"
                >

                <button
                  type="button"

                  title="Garis Bawah / Underline (Ctrl+U)"
                >
                  U
                </button>
                <span className="h-4 w-px bg-slate-800 mx-0.5" />
                <button
                  type="button"
                  onClick={() => wrapSelection('<sup>', '</sup>', '2')}
                  className="px-2 py-1 rounded-lg bg-slate-800 hover:bg-sky-600 text-sky-300 hover:text-white font-bold border border-slate-700 transition"
                  title="Pangkat Atas / Superscript (X²)"
                >
                  X²
                </button>
                <button
                  type="button"
                  onClick={() => wrapSelection('<sub>', '</sub>', '1')}
                  className="px-2 py-1 rounded-lg bg-slate-800 hover:bg-sky-600 text-sky-300 hover:text-white font-bold border border-slate-700 transition"
                  title="Indeks Bawah / Subscript (X₂)"
                >
                  X₂
                </button>
                <span className="h-4 w-px bg-slate-800 mx-0.5" />
                <button
                  type="button"
                  onClick={() => setShowMathPanel(!showMathPanel)}
                  className={`px-2.5 py-1 rounded-lg font-extrabold flex items-center gap-1 border transition ${
                    showMathPanel
                      ? 'bg-amber-500 text-slate-950 border-amber-400'
                      : 'bg-amber-500/15 hover:bg-amber-500/30 text-amber-300 border-amber-500/30'
                  }`}
                  title="Buka Panel Rumus & Simbol Matematika"
                >
                  <span>∑ Rumus & Simbol</span>
                </button>
                <button
                  type="button"
                  onClick={() => {
                    const currentVal = String(value ?? '');
                    if (!currentVal.trim()) return;
                    const el = textareaRef.current;
                    if (el && el.selectionStart !== el.selectionEnd) {
                      const s = el.selectionStart;
                      const e = el.selectionEnd;
                      const sel = currentVal.slice(s, e);
                      const converted = `$${convertWordLinearExprToLatex(sel)}$`;
                      onChange(currentVal.slice(0, s) + converted + currentVal.slice(e));
                    } else {
                      onChange(autoUpgradeWordMathInPlainText( normalizeWordMathUnicodeChars(currentVal).text ));
                    }
                    setWordDetectedBadge(true);
                    setTimeout(() => setWordDetectedBadge(false), 3500);
                  }}
                  className="px-2.5 py-1 rounded-lg bg-emerald-500/15 hover:bg-emerald-600 text-emerald-300 hover:text-white border border-emerald-500/30 font-extrabold transition"
                  title="Konversi ekspresi rumus dari Microsoft Word (Sorot teks rumus atau klik langsung)"
                >
                  ✨ Deteksi Rumus Word

              </div>
              <div className="flex items-center gap-2 pr-1">
                {wordDetectedBadge ? (
                  <span className="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-[10px] font-bold animate-pulse">
                    ✓ Rumus MS Word Terdeteksi!

                    Support Copy-Paste Equation MS Word

            {/* Panel Interaktif Rumus (LaTeX/KaTeX) & Simbol Matematika */}

                </div>
                <div>
                  <div className="text-[10px] font-bold uppercase text-amber-400 mb-1">

                  <div className="flex flex-wrap gap-1">
                    {MATH_TEMPLATES.map((tpl, idx) => (
                      <button

                        onClick={() => insertAtCursor(tpl.code)}
                        title={tpl.title}
                        className="px-2 py-1 rounded-lg bg-slate-900 hover:bg-indigo-600 text-indigo-200 hover:text-white border border-slate-700 font-mono text-[11px] font-bold transition"
                      >

                      </button>

                  </div>
                </div>
                <div>
                  <div className="text-[10px] font-bold uppercase text-sky-400 mb-1">

            {/* Area Input Multiline (Mendukung Paste Equation MS Word, Enter, Bold/Italic/Underline) */}
            <textarea

            />

            </div>
          )}
        </div>
      );
    }

                    <label className="block font-bold text-emerald-400 mb-1">Waktu Buka</label>
                    <input type="datetime-local" value={sesiModal.waktu_buka} onChange={e => setSesiModal({ ...sesiModal, waktu_buka: e.target.value })} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-2 py-1.5 text-white" />
                  </div>
                  <div>
                    <label className="block font-bold text-rose-400 mb-1">Waktu Tutup</label>
                    <input type="datetime-local" value={sesiModal.waktu_tutup} onChange={e => setSesiModal({ ...sesiModal, waktu_tutup: e.target.value })} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-2 py-1.5 text-white" />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-300 mb-1">Durasi (Menit)</label>
                    <input type="number" value={sesiModal.durasi_menit} onChange={e => setSesiModal({ ...sesiModal, durasi_menit: Number(e.target.value) })} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-white font-mono" />
                  </div>
                  <div>
                    <label className="block font-bold text-amber-400 mb-1">Min. Submit (Menit)</label>
                    <input type="number" value={sesiModal.minimal_menit_submit} onChange={e => setSesiModal({ ...sesiModal, minimal_menit_submit: Number(e.target.value) })} className="w-full bg-slate-950 border border-amber-500 rounded-xl px-3 py-1.5 text-amber-300 font-mono" />
                  </div>
                </div>

                {/* Target Peserta Sesi */}
                <div className="p-3.5 rounded-2xl bg-slate-950 border border-slate-800 space-y-3">
                  <div className="font-bold text-sky-400 uppercase text-[11px]">Filter & Pilih Target Peserta Ujian</div>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    <select value={enrollFilterTingkat} onChange={e => setEnrollFilterTingkat(e.target.value)} className="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-white">
                      <option value="ALL">Semua Tingkat</option>
                      {TINGKAT_LIST.map(t => <option key={t} value={t}>Kelas {t}</option>)}
                    </select>
                    <select value={enrollFilterJurusan} onChange={e => setEnrollFilterJurusan(e.target.value)} className="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-white">
                      <option value="ALL">Semua Jurusan</option>
                      {masterJurusan.map(j => <option key={j.id_jurusan} value={j.kode_jurusan}>{j.kode_jurusan}</option>)}
                    </select>
                    <select value={enrollFilterKelas} onChange={e => setEnrollFilterKelas(e.target.value)} className="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-white">
                      <option value="ALL">Semua Kelas</option>
                      {masterKelas.map(k => <option key={k.id_kelas} value={k.nama_kelas}>{k.nama_kelas}</option>)}
                    </select>
                    <select value={enrollFilterAgama} onChange={e => setEnrollFilterAgama(e.target.value)} className="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-white">
                      <option value="ALL">Semua Agama</option>
                      {AGAMA_LIST.map(a => <option key={a} value={a}>{a}</option>)}
                    </select>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-2.5 max-h-44 overflow-y-auto space-y-1.5">
                      <div className="flex justify-between items-center text-[11px] font-bold text-slate-400 pb-1 border-b border-slate-800">
                        <span>Tersedia ({availableEnrollStudents.length})</span>
                        <button type="button" onClick={() => {
                          const addIds = availableEnrollStudents.map(u => u.id_user);
                          setSesiModal({ ...sesiModal, peserta_ids: [...new Set([...(sesiModal.peserta_ids || []), ...addIds])] });
                        }} className="text-indigo-400 hover:underline">+ Pilih Semua</button>
                      </div>
                      {availableEnrollStudents.map(u => (
                        <div key={u.id_user} className="flex justify-between items-center p-1.5 rounded-lg bg-slate-950 border border-slate-800">
                          <span>{u.nama_lengkap} <span className="text-slate-400">({u.kelas})</span></span>
                          <button type="button" onClick={() => setSesiModal({ ...sesiModal, peserta_ids: [...(sesiModal.peserta_ids || []), u.id_user] })} className="px-2 py-0.5 bg-indigo-600 text-white rounded font-bold">+</button>
                        </div>
                      ))}
                    </div>

                    <div className="bg-emerald-950/20 border border-emerald-500/30 rounded-xl p-2.5 max-h-44 overflow-y-auto space-y-1.5">
                      <div className="flex justify-between items-center text-[11px] font-bold text-emerald-300 pb-1 border-b border-emerald-500/20">
                        <span>Terpilih ({selectedEnrollStudents.length})</span>
                        <button type="button" onClick={() => setSesiModal({ ...sesiModal, peserta_ids: [] })} className="text-rose-400 hover:underline">Reset</button>
                      </div>
                      {selectedEnrollStudents.map(u => (
                        <div key={u.id_user} className="flex justify-between items-center p-1.5 rounded-lg bg-slate-900 border border-emerald-500/30">
                          <span>{u.nama_lengkap} <span className="text-emerald-400">({u.kelas})</span></span>
                          <button type="button" onClick={() => setSesiModal({ ...sesiModal, peserta_ids: (sesiModal.peserta_ids || []).filter(id => id !== u.id_user) })} className="px-2 py-0.5 bg-rose-600/30 text-rose-300 rounded font-bold">×</button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <button
                  onClick={() => {
                    const item = { ...sesiModal, id_sesi: sesiModal.id_sesi || Date.now(), peserta_ids_json: JSON.stringify(sesiModal.peserta_ids || []) };
                    if (sesiModal.id_sesi) {
                      setSesiUjian(sesiUjian.map(s => s.id_sesi === sesiModal.id_sesi ? item : s));
                      syncToSheets({ action: 'update', sheet: 'sesi_ujian', pkField: 'id_sesi', pkValue: item.id_sesi, data: item });
                    } else {
                      setSesiUjian([...sesiUjian, item]);
                      syncToSheets({ action: 'insert', sheet: 'sesi_ujian', data: item });
                    }
                    setSesiModal(null);
                    triggerToast('Tersimpan', 'Konfigurasi sesi berhasil disimpan.');
                  }}
                  className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl"
                >
                  Simpan Konfigurasi Sesi
                </button>
              </div>
            </SimpleModal>
          )}

          {/* MODAL KARTU LOGIN */}
          {showKartuModal && (
            <SimpleModal title="Cetak Kartu Login Peserta" onClose={() => setShowKartuModal(false)}>
              <div className="space-y-2.5 max-h-[60vh] overflow-y-auto bg-white text-slate-900 p-3 rounded-xl text-xs">
                {filteredUsers.map(u => (
                  <div key={u.id_user} className="border border-slate-800 rounded-lg p-2.5">
                    <div className="font-bold text-center border-b pb-1 mb-1">KARTU LOGIN SKARIDA CBT — SMKN 2 TEGALSARI</div>
                    <div>Nama: <b>{u.nama_lengkap}</b> (Tingkat {u.tingkat || inferTingkatFromKelas(u.kelas)} • {u.kelas})</div>
                    <div>NISN: <b className="font-mono text-indigo-700">{u.username_nisn}</b> | Pass: <b className="font-mono text-red-600">{u.password_plain}</b></div>
                  </div>
                ))}
              </div>
            </SimpleModal>
          )}

          {/* MODAL BERITA ACARA */}
          {showBeritaAcaraModal && (
            <SimpleModal title="Berita Acara Pelaksanaan Ujian" onClose={() => setShowBeritaAcaraModal(false)}>
              <div className="space-y-2 max-h-[60vh] overflow-y-auto bg-white text-slate-900 p-4 rounded-xl text-xs">
                <div className="font-black text-center border-b-2 border-slate-900 pb-2">
                  SMK NEGERI 2 TEGALSARI - BANYUWANGI<br />BERITA ACARA & AUDIT HASIL UJIAN SKARIDA CBT
                </div>
                {filteredRaporPeserta.map(pu => {
                  const u = users.find(usr => usr.id_user === pu.id_user);
                  return (
                    <div key={pu.id_peserta_ujian} className="border-b py-1.5 flex justify-between">
                      <span><b>{u?.nama_lengkap}</b> ({hitungDurasiAktual(pu.waktu_mulai, pu.waktu_selesai)})</span>
                      <span>Pelanggaran: {pu.jumlah_pelanggaran}x | Nilai: <b>{Number(pu.skor_pg) + Number(pu.skor_uraian)}</b></span>
                    </div>
                  );
                })}
              </div>
            </SimpleModal>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminDashboardApp />);
  </script>
</body>
</html>
