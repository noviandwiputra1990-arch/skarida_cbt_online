      });

      // Siklus Otomatis Regenerasi Token Ujian Setiap 30 Menit (1800 Detik)
      const rotateAllActiveTokens = (isAuto = true) => {
        const nowIso = new Date().toISOString();
        setSesiUjian(prevSesi => {
          let hasRotated = false;
          const updatedList = prevSesi.map(s => {
            if (!s.require_token) return s;
            hasRotated = true;
            const nextToken = generateExamToken();
            const updatedItem = {
              ...s,
              token: nextToken,
              token_updated_at: nowIso,
              peserta_ids_json: JSON.stringify(s.peserta_ids || [])
            };
            syncToSheets({
              action: 'update',
              sheet: 'sesi_ujian',
              pkField: 'id_sesi',
              pkValue: s.id_sesi,
              data: updatedItem
            });
            return updatedItem;
          });

          if (hasRotated) {
            setSesiModal(prevModal => {
              if (!prevModal || !prevModal.require_token) return prevModal;
              const match = updatedList.find(u => u.id_sesi === prevModal.id_sesi);
              return match ? { ...prevModal, token: match.token, token_updated_at: nowIso } : { ...prevModal, token: generateExamToken(), token_updated_at: nowIso };
            });
            setPreviewSesiModal(prevPreview => {
              if (!prevPreview || !prevPreview.require_token) return prevPreview;
              const match = updatedList.find(u => u.id_sesi === prevPreview.id_sesi);
              return match ? { ...prevPreview, token: match.token, token_updated_at: nowIso } : prevPreview;
            });
            triggerToast(
              isAuto ? 'Token Berganti Otomatis (30 Menit)' : 'Token Ujian Diperbarui',
              'Seluruh sesi ujian dengan Token ON telah mendapatkan kode token baru.'
            );
          }
          return updatedList;
        });
      };

      useEffect(() => {
        const rotTimer = setInterval(() => {
          setTokenRotationSeconds(prev => {
            if (prev <= 1) {
              rotateAllActiveTokens(true);
              return 1800;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(rotTimer);
      }, [scriptUrl]);

      const triggerSimViolation = (violationLabel) => {
        const nextStrike = simState.strikes + 1;
        if (nextStrike >= 4) {
          setSimState({ ...simState, strikes: nextStrike, showStrikePopup: false, lastViolationType: violationLabel, isForceSubmitted: true, forceSubmitReason: `Pelanggaran Ke-4 (${violationLabel})` });
        } else {
          setSimState({ ...simState, strikes: nextStrike, showStrikePopup: true, lastViolationType: violationLabel, isForceSubmitted: false });
        }
      };

      const filteredMasterKelas = useMemo(() => {
        return masterKelas.filter(k => {
          const t = k.tingkat || inferTingkatFromKelas(k.nama_kelas, 'X');
          if (kelasFilterTingkat !== 'ALL' && t !== kelasFilterTingkat) return false;
          if (kelasFilterJurusan !== 'ALL' && k.kode_jurusan !== kelasFilterJurusan) return false;
          return true;
        });
      }, [masterKelas, kelasFilterTingkat, kelasFilterJurusan]);

      // Deteksi daftar ID Sesi yang sedang berjalan (berdasarkan peserta yang sedang mengerjakan atau rentang jadwal aktif)
      const runningSessionIds = useMemo(() => {
        const now = new Date();
        const activeIds = new Set();

        sesiUjian.forEach(s => {
          const buka = s.waktu_buka ? new Date(String(s.waktu_buka).replace(' ', 'T')) : null;
          const tutup = s.waktu_tutup ? new Date(String(s.waktu_tutup).replace(' ', 'T')) : null;
          const isWithinSchedule = buka && tutup && !isNaN(buka) && !isNaN(tutup) && now >= buka && now <= tutup;
          const hasWorkingParticipants = pesertaUjian.some(
            pu => String(pu.id_sesi) === String(s.id_sesi) && pu.status_pengerjaan === 'sedang_mengerjakan'
          );
          if (isWithinSchedule || hasWorkingParticipants) {
            activeIds.add(String(s.id_sesi));
          }
        });

        // Fallback: jika tidak ada sesi yang terdeteksi dari jam/peserta, gunakan sesi pertama agar tidak kosong
        if (activeIds.size === 0 && sesiUjian.length > 0) {
          activeIds.add(String(sesiUjian[0].id_sesi));
        }
        return activeIds;
      }, [sesiUjian, pesertaUjian]);

      const filteredCommandPeserta = useMemo(() => {
        return pesertaUjian.filter(pu => {
          const u = users.find(usr => String(usr.id_user) === String(pu.id_user));
          const sesi = sesiUjian.find(s => String(s.id_sesi) === String(pu.id_sesi));
          const paket = paketSoal.find(p => String(p.id_paket) === String(sesi?.id_paket));
          const tingkatSiswa = u ? (u.tingkat || inferTingkatFromKelas(u.kelas, 'X')) : (paket?.tingkat || paket?.kelas || 'X');
          const jurusanSiswa = u ? u.jurusan : (paket?.jurusan || '');

          if (ccFilterMapel !== 'ALL' && paket?.mata_pelajaran !== ccFilterMapel) return false;
          if (ccFilterTingkat !== 'ALL' && tingkatSiswa !== ccFilterTingkat) return false;
          if (ccFilterJurusan !== 'ALL' && jurusanSiswa !== ccFilterJurusan && !String(paket?.jurusan || '').includes(ccFilterJurusan)) return false;
          if (ccFilterSesi === 'ACTIVE_RUNNING') {
            if (!runningSessionIds.has(String(pu.id_sesi))) return false;
          } else if (ccFilterSesi !== 'ALL' && String(pu.id_sesi) !== String(ccFilterSesi)) {
            return false;
          }
          return true;
        });
      }, [pesertaUjian, users, sesiUjian, paketSoal, ccFilterMapel, ccFilterTingkat, ccFilterJurusan, ccFilterSesi, runningSessionIds]);

      const ccStats = useMemo(() => {
        // Hitung total target peserta dari sesi-sesi yang cocok dengan filter Command Center
        const matchingSessions = sesiUjian.filter(s => {
          const paket = paketSoal.find(p => String(p.id_paket) === String(s.id_paket));
          if (ccFilterMapel !== 'ALL' && paket?.mata_pelajaran !== ccFilterMapel) return false;
          if (ccFilterSesi === 'ACTIVE_RUNNING') {
            if (!runningSessionIds.has(String(s.id_sesi))) return false;
          } else if (ccFilterSesi !== 'ALL' && String(s.id_sesi) !== String(ccFilterSesi)) {
            return false;
          }
          return true;
        });

        const enrolledUserIds = new Set();
        matchingSessions.forEach(s => {
          (s.peserta_ids || []).forEach(uid => {
            const usr = users.find(u => String(u.id_user) === String(uid));
            if (usr) {
              const t = usr.tingkat || inferTingkatFromKelas(usr.kelas, 'X');
              if (ccFilterTingkat !== 'ALL' && t !== ccFilterTingkat) return;
              if (ccFilterJurusan !== 'ALL' && usr.jurusan !== ccFilterJurusan) return;
              enrolledUserIds.add(String(uid));
            }
          });
        });

        const selesaiNormal = filteredCommandPeserta.filter(p => p.status_pengerjaan === 'selesai').length;
        const dihentikan = filteredCommandPeserta.filter(p => p.status_pengerjaan === 'dihentikan_sistem').length;
        const selesaiTotal = selesaiNormal + dihentikan;
        const sedang = filteredCommandPeserta.filter(p => p.status_pengerjaan === 'sedang_mengerjakan').length;
        // Sudah Mengerjakan = seluruh peserta yang telah mulai mengerjakan (Sedang Mengerjakan + Selesai + Force Submit)
        const sudahMengerjakan = selesaiTotal + sedang;

        const targetTotal = Math.max(enrolledUserIds.size, filteredCommandPeserta.length);
        const belum = Math.max(
          filteredCommandPeserta.filter(p => p.status_pengerjaan === 'belum').length,
          targetTotal - sudahMengerjakan
        );
        const total = Math.max(1, targetTotal);

        return {
          targetTotal,
          sudahMengerjakan,
          selesai: selesaiNormal,
          selesaiTotal,
          sedang,
          belum,
          dihentikan,
          total
        };
      }, [filteredCommandPeserta, sesiUjian, paketSoal, users, ccFilterMapel, ccFilterTingkat, ccFilterJurusan, ccFilterSesi, runningSessionIds]);

      // KALKULASI DINAMIS CAPAIAN KOGNITIF (LoTS, MoTS, HoTS) BERDASARKAN JAWABAN PESERTA BERSTATUS "SELESAI"
      const ccCognitiveStats = useMemo(() => {
        const finishedParticipants = filteredCommandPeserta.filter(
          pu => pu.status_pengerjaan === 'selesai'
        );

        const buckets = {
          LoTS: { earned: 0, max: 0, correctCount: 0, totalItems: 0 },
          MoTS: { earned: 0, max: 0, correctCount: 0, totalItems: 0 },
          HoTS: { earned: 0, max: 0, correctCount: 0, totalItems: 0 }
        };

        finishedParticipants.forEach((pu) => {
          const sesi = sesiUjian.find(s => String(s.id_sesi) === String(pu.id_sesi));
          const soalPaket = masterSoal.filter(q => String(q.id_paket) === String(sesi?.id_paket));
          const questionsToEvaluate = soalPaket.length > 0 ? soalPaket : masterSoal;

          const totalBobotPGPaket = questionsToEvaluate
            .filter(q => q.tipe_soal === 'PG')
            .reduce((acc, q) => acc + (Number(q.bobot_skor) || 2), 0);

          const savedPgMap = pu.jawaban_pg_siswa || {};
          const hasExplicitPgMap = Object.keys(savedPgMap).length > 0;
          const fallbackPgRatio = totalBobotPGPaket > 0
            ? Math.min(1, Math.max(0, (Number(pu.skor_pg) || 0) / totalBobotPGPaket))
            : Math.min(1, Math.max(0, (Number(pu.skor_pg) || 0) / 100));

          questionsToEvaluate.forEach((soal) => {
            const rawKat = String(soal.kategori_kognitif || 'MoTS').trim().toUpperCase();
            const katKey = rawKat === 'LOTS' ? 'LoTS' : rawKat === 'HOTS' ? 'HoTS' : 'MoTS';
            const bobot = Number(soal.bobot_skor) || (soal.tipe_soal === 'Uraian' ? 10 : 2);

            buckets[katKey].max += bobot;
            buckets[katKey].totalItems += 1;

            if (soal.tipe_soal === 'PG') {
              const kunci = String(soal.kunci_jawaban || 'A').trim().toUpperCase();
              if (hasExplicitPgMap) {
                const ans = String(savedPgMap[soal.id_soal] || '').trim().toUpperCase();
                if (ans && ans === kunci) {
                  buckets[katKey].earned += bobot;
                  buckets[katKey].correctCount += 1;
                }
              } else {
                // Jika data berasal dari impor skor_pg tanpa rincian per nomor, proporsikan sesuai rasio skor_pg peserta
                const estimatedEarned = bobot * fallbackPgRatio;
                buckets[katKey].earned += estimatedEarned;
                if (fallbackPgRatio >= 0.6) buckets[katKey].correctCount += 1;
              }
            } else {
              // Soal Uraian: ambil dari detail_uraian[id_soal].skor yang dinilai guru
              const detailItem = pu.detail_uraian?.[soal.id_soal];
              let earnedEssay = 0;
              if (detailItem && detailItem.skor !== undefined) {
                earnedEssay = Math.min(bobot, Math.max(0, Number(detailItem.skor) || 0));
              } else {
                const allUraianInPaket = questionsToEvaluate.filter(q => q.tipe_soal === 'Uraian');
                const totalMaxUraian = allUraianInPaket.reduce((acc, q) => acc + (Number(q.bobot_skor) || 10), 0);
                earnedEssay = totalMaxUraian > 0
                  ? Math.min(bobot, ((Number(pu.skor_uraian) || 0) / totalMaxUraian) * bobot)
                  : 0;
              }
              buckets[katKey].earned += earnedEssay;
              if (earnedEssay >= bobot * 0.6) buckets[katKey].correctCount += 1;
            }
          });
        });

        const calcPct = (b) => (b.max > 0 ? Math.round((b.earned / b.max) * 100) : 0);
        const pctLoTS = calcPct(buckets.LoTS);
        const pctMoTS = calcPct(buckets.MoTS);
        const pctHoTS = calcPct(buckets.HoTS);

        // Titik pusat radar (100, 85); Puncak LoTS (100, 15); Kanan MoTS (175, 130); Kiri HoTS (25, 130)
        const rLoTS = finishedParticipants.length > 0 ? Math.max(0.08, pctLoTS / 100) : 0;
        const rMoTS = finishedParticipants.length > 0 ? Math.max(0.08, pctMoTS / 100) : 0;
        const rHoTS = finishedParticipants.length > 0 ? Math.max(0.08, pctHoTS / 100) : 0;

        const ptLoTS = `${(100).toFixed(1)},${(85 - 70 * rLoTS).toFixed(1)}`;
        const ptMoTS = `${(100 + 75 * rMoTS).toFixed(1)},${(85 + 45 * rMoTS).toFixed(1)}`;
        const ptHoTS = `${(100 - 75 * rHoTS).toFixed(1)},${(85 + 45 * rHoTS).toFixed(1)}`;

        return {
          finishedCount: finishedParticipants.length,
          LoTS: { ...buckets.LoTS, pct: pctLoTS },
          MoTS: { ...buckets.MoTS, pct: pctMoTS },
          HoTS: { ...buckets.HoTS, pct: pctHoTS },
          polygonPoints: `${ptLoTS} ${ptMoTS} ${ptHoTS}`
        };
      }, [filteredCommandPeserta, sesiUjian, masterSoal]);

      // KALKULASI DINAMIS DISTRIBUSI PELANGGARAN HP/WEB DARI LOG PELANGGARAN PESERTA
      const ccViolationDistribution = useMemo(() => {
        const categories = [
          { key: 'wa_bg', label: 'Buka Notifikasi WA / Background App', count: 0, color: 'bg-red-500' },
          { key: 'split', label: 'Split-Screen / Layar Belah HP', count: 0, color: 'bg-amber-500' },
          { key: 'tab', label: 'Pindah Tab (visibilitychange)', count: 0, color: 'bg-orange-500' },
          { key: 'fullscreen', label: 'Keluar Fullscreen / Gestur Back', count: 0, color: 'bg-indigo-500' },
          { key: 'clipboard', label: 'Percobaan Copy-Paste / Clipboard', count: 0, color: 'bg-emerald-500' }
        ];

        let totalLogs = 0;
        letviolatingStudents = 0;

        filteredCommandPeserta.forEach((pu) => {
          const logs = Array.isArray(pu.log_pelanggaran) ? pu.log_pelanggaran : [];
          if (logs.length > 0 || Number(pu.jumlah_pelanggaran) > 0) {
            letviolatingStudents += 1;
          }

          if (logs.length > 0) {
            logs.forEach((lg) => {
              totalLogs += 1;
              const txt = String(lg.jenis_pelanggaran || '').toLowerCase();
              if (txt.includes('split') || txt.includes('resolusi') || txt.includes('belah') || txt.includes('floating')) {
                categories[1].count += 1;
              } else if (txt.includes('tab') || txt.includes('visibility')) {
                categories[2].count += 1;
              } else if (txt.includes('fullscreen') || txt.includes('back') || txt.includes('keluar')) {
                categories[3].count += 1;
              } else if (txt.includes('copy') || txt.includes('paste') || txt.includes('clipboard')) {
                categories[4].count += 1;
              } else {
                categories[0].count += 1;
              }
            });
          } else if (Number(pu.jumlah_pelanggaran) > 0) {
            // Jika hanya angka jumlah_pelanggaran tanpa rincian array log
            const cnt = Number(pu.jumlah_pelanggaran) || 0;
            categories[0].count += cnt;
            totalLogs += cnt;
          }
        });

        const maxCount = Math.max(1, ...categories.map(c => c.count));
        return {
          totalLogs,
          violatingStudents: letviolatingStudents,
          items: categories.map(c => ({
            ...c,
            pct: c.count > 0 ? Math.max(10, Math.round((c.count / maxCount) * 100)) : 0
          }))
        };
      }, [filteredCommandPeserta]);

      const filteredUsers = useMemo(() => {
        const list = users.filter(u => {
          const t = u.tingkat || inferTingkatFromKelas(u.kelas, 'X');
          if (akunFilterTingkat !== 'ALL' && t !== akunFilterTingkat) return false;
          if (akunFilterJurusan !== 'ALL' && u.jurusan !== akunFilterJurusan) return false;
          if (akunFilterKelas !== 'ALL' && u.kelas !== akunFilterKelas) return false;
          if (akunFilterAgama !== 'ALL' && u.agama !== akunFilterAgama) return false;
          if (akunSearch.trim()) {
            const q = akunSearch.toLowerCase();
            if (!u.nama_lengkap.toLowerCase().includes(q) && !u.username_nisn.toLowerCase().includes(q)) return false;
          }
          return true;
        });

        return [...list].sort((a, b) => {
          if (akunSortBy === 'nama_asc') return String(a.nama_lengkap || '').localeCompare(String(b.nama_lengkap || ''), 'id');
          if (akunSortBy === 'nama_desc') return String(b.nama_lengkap || '').localeCompare(String(a.nama_lengkap || ''), 'id');
          if (akunSortBy === 'nisn_asc') return String(a.username_nisn || '').localeCompare(String(b.username_nisn || ''), 'id');
          if (akunSortBy === 'nisn_desc') return String(b.username_nisn || '').localeCompare(String(a.username_nisn || ''), 'id');
          if (akunSortBy === 'kelas_asc') return String(a.kelas || '').localeCompare(String(b.kelas || ''), 'id');
          if (akunSortBy === 'tingkat_asc') {
            const order = { X: 1, XI: 2, XII: 3 };
            const tA = order[a.tingkat || inferTingkatFromKelas(a.kelas, 'X')] || 9;
            const tB = order[b.tingkat || inferTingkatFromKelas(b.kelas, 'X')] || 9;
            return tA - tB || String(a.kelas || '').localeCompare(String(b.kelas || ''), 'id');
          }
          return 0;
        });
      }, [users, akunFilterTingkat, akunFilterJurusan, akunFilterKelas, akunFilterAgama, akunSearch, akunSortBy]);

      const filteredStaffUsers = useMemo(() => {
        return staffUsers.filter(st => {
          if (staffFilterRole !== 'ALL' && st.role !== staffFilterRole) return false;
          if (staffSearch.trim()) {
            const q = staffSearch.toLowerCase();
            if (!st.nama_lengkap.toLowerCase().includes(q) && !st.username_nip.toLowerCase().includes(q) && !st.mapel_jabatan.toLowerCase().includes(q)) return false;
          }
          return true;
        });
      }, [staffUsers, staffFilterRole, staffSearch]);

      const filteredPaketSoal = useMemo(() => {
        return paketSoal.filter(p => {
          const t = p.tingkat || p.kelas || 'X';
          if (soalFilterMapel !== 'ALL' && p.mata_pelajaran !== soalFilterMapel) return false;
          if (soalFilterTingkat !== 'ALL' && t !== soalFilterTingkat) return false;
          if (soalFilterJurusan !== 'ALL') {
            if (p.jurusan !== 'Semua Jurusan' && !String(p.jurusan || '').includes(soalFilterJurusan)) return false;
          }
          return true;
        });
      }, [paketSoal, soalFilterMapel, soalFilterTingkat, soalFilterJurusan]);

      const filteredSesi = useMemo(() => {
        return sesiUjian.filter(s => {
          const uj = masterUjian.find(u => u.id_ujian === s.id_ujian);
          const pkt = paketSoal.find(p => p.id_paket === s.id_paket);
          if (sesiSearch.trim()) {
            const q = sesiSearch.toLowerCase();
            if (!s.nama_sesi_spesifik.toLowerCase().includes(q) && !uj?.nama_ujian.toLowerCase().includes(q) && !pkt?.mata_pelajaran.toLowerCase().includes(q)) return false;
          }
          if (sesiFilterTanggal && !s.waktu_buka.startsWith(sesiFilterTanggal)) return false;
          return true;
        });
      }, [sesiUjian, masterUjian, paketSoal, sesiSearch, sesiFilterTanggal]);

      // Paket Bank Soal yang sedang dipilih di dalam Modal Konfigurasi Sesi
      const activeSesiPaketObj = useMemo(() => {
        if (!sesiModal) return null;
        return paketSoal.find(p => String(p.id_paket) === String(sesiModal.id_paket)) || null;
      }, [sesiModal, paketSoal]);

      const activeSesiPaketScope = useMemo(() => {
        return getPaketTargetScope(activeSesiPaketObj, masterKelas);
      }, [activeSesiPaketObj, masterKelas]);

      // Daftar kelas yang diizinkan oleh Paket Bank Soal Mapel pada Modal Sesi
      const allowedClassesForSesiModal = useMemo(() => {
        if (!activeSesiPaketObj) return masterKelas;
        return masterKelas.filter(k => {
          const kTingkat = String(k.tingkat || inferTingkatFromKelas(k.nama_kelas, 'X')).trim().toUpperCase();
          if (activeSesiPaketScope.tingkat !== 'ALL' && kTingkat !== activeSesiPaketScope.tingkat) return false;
          if (activeSesiPaketScope.mode === 'semua') return true;
          if (activeSesiPaketScope.mode === 'custom_kelas') {
            return activeSesiPaketScope.allowedClassNames.includes(k.nama_kelas);
          }
          return activeSesiPaketScope.allowedJurusanCodes.includes(k.kode_jurusan);
        });
      }, [activeSesiPaketObj, activeSesiPaketScope, masterKelas]);

      // Peserta yang tersedia di Modal Sesi OTOMATIS hanya berasal dari kelas yang ditetapkan pada Paket Bank Soal
      const availableEnrollStudents = useMemo(() => {
        if (!sesiModal) return [];
        const currentIds = sesiModal.peserta_ids || [];
        return users.filter(u => {
          if (currentIds.includes(u.id_user)) return false;
          // Wajib sesuai dengan kelas/tingkat/jurusan pada Paket Bank Soal Mapel
          if (!isStudentInPaketScope(u, activeSesiPaketObj, masterKelas)) return false;
          const t = u.tingkat || inferTingkatFromKelas(u.kelas, 'X');
          if (enrollFilterTingkat !== 'ALL' && t !== enrollFilterTingkat) return false;
          if (enrollFilterJurusan !== 'ALL' && u.jurusan !== enrollFilterJurusan) return false;
          if (enrollFilterKelas !== 'ALL' && u.kelas !== enrollFilterKelas) return false;
          if (enrollFilterAgama !== 'ALL' && u.agama !== enrollFilterAgama) return false;
          return true;
        });
      }, [users, sesiModal, activeSesiPaketObj, masterKelas, enrollFilterTingkat, enrollFilterJurusan, enrollFilterKelas, enrollFilterAgama]);

      const selectedEnrollStudents = useMemo(() => {
        if (!sesiModal) return [];
        const currentIds = sesiModal.peserta_ids || [];
        return users.filter(u => currentIds.includes(u.id_user));
      }, [users, sesiModal]);

      // Helper untuk menyiapkan state awal modal sesi berdasarkan Paket Soal yang dipilih
      const buildInitialSesiModalState = (targetPaketId) => {
        const pkt = paketSoal.find(p => String(p.id_paket) === String(targetPaketId)) || paketSoal[0];
        const matchingStudents = users.filter(u => isStudentInPaketScope(u, pkt, masterKelas));
        const soalPaket = masterSoal.filter(s => String(s.id_paket) === String(pkt?.id_paket));
        const pgCount = soalPaket.filter(s => s.tipe_soal === 'PG').length;
        const urCount = soalPaket.filter(s => s.tipe_soal === 'Uraian').length;

        setEnrollFilterTingkat('ALL');
        setEnrollFilterJurusan('ALL');
        setEnrollFilterKelas('ALL');
        setEnrollFilterAgama('ALL');

        return {
          id_sesi: null,
          id_ujian: masterUjian[0]?.id_ujian || 1,
          id_paket: pkt?.id_paket || 201,
          nama_sesi_spesifik: pkt ? `Ujian ${pkt.mata_pelajaran} (${pkt.jurusan})` : '',
          zona_waktu: zonaWaktuIndonesia || 'WIB',
          waktu_buka: getIndonesianDateTimeLocal(zonaWaktuIndonesia || 'WIB', 10),
          waktu_tutup: getIndonesianDateTimeLocal(zonaWaktuIndonesia || 'WIB', 100),
          durasi_menit: 90,
          minimal_menit_submit: 30,
          is_proctoring_active: true,
          enable_watermark: true,
          is_acak_soal: true,
          require_token: true,
          token: generateExamToken(),
          token_updated_at: new Date().toISOString(),
          limit_soal_pg: pgCount > 0 ? pgCount : 25,
          limit_soal_uraian: urCount > 0 ? urCount : 5,
          peserta_ids: matchingStudents.map(u => u.id_user)
        };
      };

      const filteredRaporPeserta = useMemo(() => {
        return pesertaUjian.filter(pu => {
          const u = users.find(usr => String(usr.id_user) === String(pu.id_user));
          const sesi = sesiUjian.find(s => String(s.id_sesi) === String(pu.id_sesi));
          const paket = paketSoal.find(p => String(p.id_paket) === String(sesi?.id_paket));
          const tingkatSiswa = u ? (u.tingkat || inferTingkatFromKelas(u.kelas, 'X')) : (paket?.tingkat || paket?.kelas || 'X');

          if (raporFilterMapel !== 'ALL' && paket?.mata_pelajaran !== raporFilterMapel) return false;
          if (raporFilterTingkat !== 'ALL' && tingkatSiswa !== raporFilterTingkat) return false;
          if (raporFilterKelas !== 'ALL' && u?.kelas !== raporFilterKelas) return false;
          return true;
        });
      }, [pesertaUjian, users, sesiUjian, paketSoal, raporFilterMapel, raporFilterTingkat, raporFilterKelas]);

      // Helper kalkulasi metrik detail hasil ujian per peserta (Jumlah Terjawab, Benar PG, Salah PG, Skor PG, Skor Uraian, Nilai)
      const getPesertaReportMetrics = (pu) => {
        const u = users.find(usr => String(usr.id_user) === String(pu.id_user));
        const sesi = sesiUjian.find(s => String(s.id_sesi) === String(pu.id_sesi));
        const paket = paketSoal.find(p => String(p.id_paket) === String(sesi?.id_paket));
        const soalPaket = masterSoal.filter(s => String(s.id_paket) === String(sesi?.id_paket));
        const pgQuestions = soalPaket.filter(s => s.tipe_soal === 'PG');
        const uraianQuestions = soalPaket.filter(s => s.tipe_soal === 'Uraian');

        const limitPG = Number(sesi?.limit_soal_pg) || pgQuestions.length || 25;
        const limitUraian = Number(sesi?.limit_soal_uraian) || uraianQuestions.length || 2;
        const totalSoalSesi = limitPG + limitUraian;

        const skorPG = Number(pu.skor_pg) || 0;
        const skorUraian = Number(pu.skor_uraian) || 0;
        const nilaiTotal = skorPG + skorUraian;

        // Hitung jumlah benar PG, salah PG, dan soal terjawab
        let jmlBenarPG = pu.jml_benar_pg;
        let jmlSalahPG = pu.jml_salah_pg;
        let jmlTerjawab = pu.jml_terjawab;

        if (jmlBenarPG === undefined || jmlBenarPG === null) {
          jmlBenarPG = limitPG > 0 ? Math.min(limitPG, Math.round((skorPG / 100) * limitPG)) : 0;
        }
        if (jmlSalahPG === undefined || jmlSalahPG === null) {
          jmlSalahPG = pu.status_pengerjaan === 'belum' ? 0 : Math.max(0, limitPG - jmlBenarPG);
        }
        if (jmlTerjawab === undefined || jmlTerjawab === null) {
          const terjawabUraian = uraianQuestions.length > 0
            ? uraianQuestions.filter(q => pu.detail_uraian?.[q.id_soal]?.jawaban || pu.jawaban_uraian_teks).length
            : (pu.jawaban_uraian_teks ? 1 : 0);
          jmlTerjawab = pu.status_pengerjaan === 'belum' ? 0 : Math.min(totalSoalSesi, jmlBenarPG + jmlSalahPG + terjawabUraian);
        }

        const maxBobotUraian = uraianQuestions.reduce((acc, q) => acc + (Number(q.bobot_skor) || 0), 0);

        return {
          user: u,
          sesi,
          paket,
          tingkat: u ? (u.tingkat || inferTingkatFromKelas(u.kelas, 'X')) : (paket?.tingkat || paket?.kelas || 'X'),
          jurusan: u?.jurusan || paket?.jurusan || '-',
          kelas: u?.kelas || '-',
          totalSoalSesi,
          limitPG,
          limitUraian,
          jmlTerjawab,
          jmlBenarPG,
          jmlSalahPG,
          skorPG,

      const handleReadImageFile = (file, onDone) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const rawDataUrl = ev.target.result;
          const img = new Image();
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              const MAX_W = 560;
              const MAX_H = 420;
              let w = img.width;
              let h = img.height;
              if (w > MAX_W || h > MAX_H) {
                const ratio = Math.min(MAX_W / w, MAX_H / h);
                w = Math.round(w * ratio);
                h = Math.round(h * ratio);
              }
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, w, h);
              ctx.drawImage(img, 0, 0, w, h);
              const compressed = canvas.toDataURL('image/jpeg', 0.72);
              onDone(file.name, compressed.length < rawDataUrl.length ? compressed : rawDataUrl);
            } catch (_) {
              onDone(file.name, rawDataUrl);
            }
          };
          img.onerror = () => onDone(file.name, rawDataUrl);
          img.src = rawDataUrl;
        };
        reader.readAsDataURL(file);
      };

        }
        // Fallback XML .xls jika pustaka XLSX tidak termuat
        const escapeXml = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        let xml = `<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="${escapeXml(sheetName)}"><Table>`;
        xml += `<Row>${headers.map(h => `<Cell><Data ss:Type="String">${escapeXml(h)}</Data></Cell>`).join('')}</Row>`;
        rowsAoA.forEach(r => {
          xml += `<Row>${r.map(c => `<Cell><Data ss:Type="${typeof c === 'number' ? 'Number' : 'String'}">${escapeXml(c)}</Data></Cell>`).join('')}</Row>`;
        });
        xml += `</Table></Worksheet></Workbook>`;
        const blob = new Blob([xml], { type: 'application/vnd.ms-excel' });

              triggerToast('Gagal Memuat Parser', 'Pustaka Excel belum siap, silakan muat ulang halaman.', 'warning');
              return;
            }
            const data = new Uint8Array(evt.target.result);
            const wb = window.XLSX.read(data, { type: 'array' });
            const firstSheet = wb.Sheets[wb.SheetNames[0]];
            const jsonRows = window.XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

            const importedSoal = [];
            jsonRows.forEach((row, idx) => {
              const norm = {};
              Object.keys(row).forEach(k => {
                norm[String(k).trim().toUpperCase().replace(/\s+/g, '_')] = row[k];
              });

              const pertanyaan = String(norm.TEKS_PERTANYAAN || norm.PERTANYAAN || norm.SOAL || '').trim();
              if (!pertanyaan) return;

              const rawTipe = String(norm.TIPE_SOAL || norm.TIPE || 'PG').trim().toUpperCase();
              const tipeSoal = rawTipe.includes('URAI') || rawTipe.includes('ESSAY') ? 'Uraian' : 'PG';

              const rawKog = String(norm.KATEGORI_KOGNITIF || norm.KOGNITIF || norm.LEVEL || 'MoTS').trim().toUpperCase();
              const kategoriKognitif = rawKog === 'HOTS' ? 'HoTS' : rawKog === 'LOTS' ? 'LoTS' : 'MoTS';

              const bobotSkor = Number(norm.BOBOT_SKOR || norm.BOBOT || (tipeSoal === 'Uraian' ? 10 : 2)) || 2;
              const jumlahOpsi = tipeSoal === 'Uraian' ? 0 : Math.min(5, Math.max(3, Number(norm.JUMLAH_OPSI || 5) || 5));

              const fileGbrSoal = String(norm.FILE_GAMBAR_SOAL || norm.GAMBAR_SOAL || '').trim() || null;
              const opsiArr = [
                String(norm.OPSI_A ?? '').trim(),
                String(norm.OPSI_B ?? '').trim(),
                String(norm.OPSI_C ?? '').trim(),
                String(norm.OPSI_D ?? '').trim(),
                String(norm.OPSI_E ?? '').trim()
              ];
              const gbrOpsiArr = [
                String(norm.GAMBAR_OPSI_A || norm.GAMBAR_A || '').trim() || null,
                String(norm.GAMBAR_OPSI_B || norm.GAMBAR_B || '').trim() || null,
                String(norm.GAMBAR_OPSI_C || norm.GAMBAR_C || '').trim() || null,
                String(norm.GAMBAR_OPSI_D || norm.GAMBAR_D || '').trim() || null,
                String(norm.GAMBAR_OPSI_E || norm.GAMBAR_E || '').trim() || null
              ];
              const prevOpsiArr = gbrOpsiArr.map(g => (g && (g.startsWith('data:image') || g.startsWith('http'))) ? g : '');
              const kunci = String(norm.KUNCI_JAWABAN || norm.KUNCI || (tipeSoal === 'PG' ? 'A' : '')).trim();

              importedSoal.push({
                id_soal: Date.now() + idx,
                id_paket: targetPaketId,
                tipe_soal: tipeSoal,
                kategori_kognitif: kategoriKognitif,
                bobot_skor: bobotSkor,
                jumlah_opsi: jumlahOpsi,
                teks_pertanyaan: pertanyaan,
                file_gambar_soal: fileGbrSoal,
                preview_gambar_soal: (fileGbrSoal && (fileGbrSoal.startsWith('data:image') || fileGbrSoal.startsWith('http'))) ? fileGbrSoal : '',
                opsi: opsiArr,
                opsi_a: opsiArr[0],
                opsi_b: opsiArr[1],
                opsi_c: opsiArr[2],
                opsi_d: opsiArr[3],
                opsi_e: opsiArr[4],
                gambar_opsi: gbrOpsiArr,
                preview_gambar_opsi: prevOpsiArr,
                gambar_a: gbrOpsiArr[0] || '',
                gambar_b: gbrOpsiArr[1] || '',
                gambar_c: gbrOpsiArr[2] || '',
                gambar_d: gbrOpsiArr[3] || '',
                gambar_e: gbrOpsiArr[4] || '',
                kunci_jawaban: tipeSoal === 'PG' ? kunci.toUpperCase().slice(0, 1) || 'A' : kunci
              });
            });

            if (importedSoal.length === 0) {
              triggerToast('Data Soal Kosong', 'Tidak ditemukan baris soal yang valid pada file Excel tersebut.', 'warning');
              return;
            }

            setMasterSoal(prev => [...prev, ...importedSoal]);
            syncToSheets({ action: 'bulkInsert', sheet: 'master_soal', rows: importedSoal });
            triggerToast('Impor Butir Soal Berhasil!', `${importedSoal.length} butir soal berhasil ditambahkan ke paket soal aktif.`);
          } catch (err) {
            triggerToast('Gagal Membaca File Excel', 'Pastikan menggunakan format dari tombol Unduh Template Soal.', 'warning');
          }
          e.target.value = '';
        };

                              triggerToast('Token Diperbarui', `Token baru untuk sesi ini: ${newTok}`);
                            }}
                            className="px-2.5 py-1 rounded-lg bg-amber-500 text-slate-950 font-extrabold text-[10px] hover:bg-amber-400 transition"
                          >
                            Acak Token
                          </button>
                        </div>
                      ) : (
                        <div className="text-[11px] text-slate-500 italic">Token Ujian: OFF (Tanpa Token)</div>
                      )}
                    </div>
                  </div>

                  {/* Daftar Nama Peserta Target */}
                  <div className="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden">
                    <div className="p-3.5 bg-slate-900/80 border-b border-slate-800 flex flex-wrap items-center justify-between gap-3">
                      <div className="flex items-center gap-2">
                        <Users className="w-4 h-4 text-sky-400" />
                        <h4 className="font-extrabold text-white text-xs">
                          Daftar Nama Peserta Target ({enrolledStudents.length} Siswa Terdaftar)
                        </h4>
                      </div>
                      <div className="flex items-center gap-2">
                        <div className="relative">
                          <Search className="w-3.5 h-3.5 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2" />
                          <input
                            type="text"
                            value={previewSesiSearch}
                            onChange={e => setPreviewSesiSearch(e.target.value)}
                            placeholder="Cari Nama / NISN / Kelas..."
                            className="bg-slate-950 border border-slate-700 rounded-xl pl-8 pr-3 py-1.5 text-xs text-white outline-none focus:border-sky-500"
                          />
                        </div>
                        <button
                          type="button"
                          onClick={() => {
                            const targetSesi = previewSesiModal;
                            setPreviewSesiModal(null);
                            setSesiModal({ ...targetSesi });
                          }}
                          className="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-[11px] flex items-center gap-1"
                        >
                          <Edit3 className="w-3 h-3" /> Edit Sesi & Peserta
                        </button>
                      </div>
                    </div>

                    <div className="max-h-72 overflow-y-auto">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-900/60 text-slate-400 uppercase text-[10px] sticky top-0">
                          <tr className="border-b border-slate-800">
                            <th className="p-2.5 pl-4 w-12">No</th>
                            <th className="p-2.5">NISN</th>
                            <th className="p-2.5">Nama Lengkap Peserta</th>
                            <th className="p-2.5">Tingkat</th>
                            <th className="p-2.5">Kelas & Jurusan</th>
                            <th className="p-2.5 pr-4">Agama</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/60">
                          {filteredTargetStudents.map((stu, idx) => {
                            const tVal = stu.tingkat || inferTingkatFromKelas(stu.kelas, 'X');
                            return (
                              <tr key={stu.id_user} className="hover:bg-slate-900/50">
                                <td className="p-2.5 pl-4 font-mono text-slate-400">{idx + 1}</td>
                                <td className="p-2.5 font-mono font-bold text-indigo-400">{stu.username_nisn}</td>
                                <td className="p-2.5 font-bold text-white">{stu.nama_lengkap}</td>
                                <td className="p-2.5">
                                  <span className="px-2 py-0.5 rounded bg-violet-500/20 text-violet-300 font-bold text-[10px]">
                                    Kelas {tVal}
                                  </span>
                                </td>
                                <td className="p-2.5 text-slate-200">{stu.kelas} <span className="text-sky-400">({stu.jurusan})</span></td>
                                <td className="p-2.5 pr-4 text-emerald-300 font-semibold">{stu.agama}</td>
                              </tr>
                            );
                          })}
                          {filteredTargetStudents.length === 0 && (
                            <tr>
                              <td colSpan={6} className="p-6 text-center text-slate-500">
                                Tidak ada peserta target yang ditemukan pada sesi ini.
                              </td>
                            </tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </SimpleModal>
            );
          })()}

          {/* MODAL KARTU LOGIN */}
          {showKartuModal && (
            <SimpleModal title="Cetak Kartu Login Peserta" onClose={() => setShowKartuModal(false)}>
              <div className="space-y-2.5 max-h-[60vh] overflow-y-auto bg-white text-slate-900 p-3 rounded-xl text-xs">
                {filteredUsers.map(u => (
                  <div key={u.id_user} className="border border-slate-800 rounded-lg p-2.5">
                    <div className="font-bold text-center border-b pb-1 mb-1">KARTU LOGIN SKARIDA CBT — SMKN 2 TEGALSARI</div>
                    <div>Nama: <b>{u.nama_lengkap}</b> (Tingkat {u.tingkat || inferTingkatFromKelas(u.kelas)} • {u.kelas})</div>
                    <div>NISN: <b className="font-mono text-indigo-700">{u.username_nisn}</b> | Pass: <b className="font-mono text-red-600">{u.password_plain}</b></div>
                  </div>
                ))}
              </div>
            </SimpleModal>
          )}

          {/* MODAL BERITA ACARA */}
          {showBeritaAcaraModal && (
            <SimpleModal title="Berita Acara Pelaksanaan Ujian" onClose={() => setShowBeritaAcaraModal(false)}>
              <div className="space-y-2 max-h-[60vh] overflow-y-auto bg-white text-slate-900 p-4 rounded-xl text-xs">
                <div className="font-black text-center border-b-2 border-slate-900 pb-2">
                  SMK NEGERI 2 TEGALSARI - BANYUWANGI<br />BERITA ACARA & AUDIT HASIL UJIAN SKARIDA CBT
                </div>
                {filteredRaporPeserta.map(pu => {
                  const u = users.find(usr => usr.id_user === pu.id_user);
                  return (
                    <div key={pu.id_peserta_ujian} className="border-b py-1.5 flex justify-between">
                      <span><b>{u?.nama_lengkap}</b> ({hitungDurasiAktual(pu.waktu_mulai, pu.waktu_selesai)})</span>
                      <span>Pelanggaran: {pu.jumlah_pelanggaran}x | Nilai: <b>{Number(pu.skor_pg) + Number(pu.skor_uraian)}</b></span>
                    </div>
                  );
                })}
              </div>
            </SimpleModal>
          )}

          {/* MODAL PREVIEW REKAP NILAI PER MAPEL & PER KELAS (DOWNLOAD PDF / EXCEL) */}
          {showRekapNilaiModal && (
            <SimpleModal
              title="Preview Rekapitulasi Nilai Per Mata Pelajaran & Per Kelas (Siap Download PDF / Excel)"
              onClose={() => setShowRekapNilaiModal(false)}
              maxWidth="max-w-6xl"
            >
              <div className="space-y-4 text-xs">
                {/* Bar Filter Interaktif & Tombol Download PDF / Excel di dalam Modal */}
                <div className="p-3.5 rounded-2xl bg-slate-950 border border-slate-800 flex flex-wrap items-end justify-between gap-3">
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5 flex-1 min-w-[280px]">
                    <div>
                      <label className="block text-[10px] font-bold uppercase text-indigo-400 mb-1">Pilih Mata Pelajaran</label>
                      <select
                        value={raporFilterMapel}
                        onChange={e => setRaporFilterMapel(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-semibold"
                      >
                        <option value="ALL">Semua Mata Pelajaran</option>
                        {[...new Set(paketSoal.map(p => p.mata_pelajaran))].map(m => (
                          <option key={m} value={m}>{m}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold uppercase text-violet-400 mb-1">Pilih Jenjang (Tingkat)</label>
                      <select
                        value={raporFilterTingkat}
                        onChange={e => {
                          setRaporFilterTingkat(e.target.value);
                          setRaporFilterKelas('ALL');
                        }}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-semibold"
                      >
                        <option value="ALL">Semua Jenjang (X, XI, XII)</option>
                        {TINGKAT_LIST.map(t => (
                          <option key={t} value={t}>Jenjang Kelas {t}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold uppercase text-sky-400 mb-1">Pilih Kelas</label>
                      <select
                        value={raporFilterKelas}
                        onChange={e => setRaporFilterKelas(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-semibold"
                      >
                        <option value="ALL">Semua Kelas</option>
                        {masterKelas
                          .filter(k => raporFilterTingkat === 'ALL' || (k.tingkat || inferTingkatFromKelas(k.nama_kelas, 'X')) === raporFilterTingkat)
                          .map(k => (
                            <option key={k.id_kelas} value={k.nama_kelas}>{k.nama_kelas} ({k.kode_jurusan})</option>
                          ))}
                      </select>
                    </div>
                  </div>

                  <div className="flex flex-wrap items-center gap-2 shrink-0">
                    <button
                      type="button"
                      disabled={isDownloadingPdf || groupedRekapNilai.length === 0}
                      onClick={handleDownloadRekapNilaiPdf}
                      className="px-4 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 disabled:opacity-50 text-white font-extrabold text-xs flex items-center gap-1.5 shadow-lg shadow-rose-600/25 transition"
                    >
                      <Download className="w-4 h-4" />
                      <span>{isDownloadingPdf ? 'Menyiapkan PDF...' : 'Download PDF (.pdf)'}</span>
                    </button>
                    <button
                      type="button"
                      disabled={groupedRekapNilai.length === 0}
                      onClick={handleDownloadRekapNilaiExcel}
                      className="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-extrabold text-xs flex items-center gap-1.5 shadow-lg shadow-emerald-600/25 transition"
                    >
                      <FileSpreadsheet className="w-4 h-4" />
                      <span>Download Excel (.xlsx)</span>
                    </button>
                  </div>
                </div>

                {/* Area Kertas Dokumen Preview Rekap Nilai (Yang Akan Dirender ke PDF) */}
                <div className="max-h-[65vh] overflow-y-auto rounded-2xl border border-slate-700 bg-slate-200 p-3 sm:p-5">
                  <div
                    id="rekap-nilai-pdf-print-area"
                    className="bg-white text-slate-900 p-6 rounded-xl shadow-md space-y-6 mx-auto"
                  >
                    {/* Kop Surat Resmi SMK Negeri 2 Tegalsari */}
                    <div className="flex items-center justify-between border-b-4 border-double border-slate-900 pb-3">
                      <div className="flex items-center gap-3.5">
                        <SkaridaLogo className="w-14 h-14" />
                        <div>
                          <div className="text-[11px] font-bold uppercase tracking-wider text-slate-700">
                            Pemerintah Provinsi Jawa Timur • Dinas Pendidikan
                          </div>
                          <div className="text-base font-black uppercase tracking-tight text-slate-950">
                            SMK NEGERI 2 TEGALSARI — BANYUWANGI
                          </div>
                          <div className="text-[11px] font-semibold text-slate-600">
                            Sistem Ujian Berbasis Komputer & Smartphone (SKARIDA CBT)
                          </div>
                        </div>
                      </div>
                      <div className="text-right text-[10px] text-slate-600 font-mono">
                        <div className="font-bold text-slate-900 uppercase">Dokumen Rekapitulasi Nilai Resmi</div>
                        <div>Dicetak: {indonesianClockStr}</div>
                        <div>Jml Kelompok Kelas: {groupedRekapNilai.length} Rombel</div>
                      </div>
                    </div>

                    {groupedRekapNilai.length === 0 ? (
                      <div className="py-12 text-center text-slate-500 font-semibold">
                        Tidak ada data nilai peserta untuk filter Mata Pelajaran dan Kelas yang dipilih.
                      </div>
                    ) : (
                      groupedRekapNilai.map((grp, gIdx) => (
                        <div key={grp.key} className={`space-y-3 ${gIdx > 0 ? 'pt-6 border-t-2 border-dashed border-slate-300' : ''}`}>
                          {/* Informasi Header Per Mapel & Per Kelas */}
                          <div className="bg-slate-100 border border-slate-300 rounded-lg p-3 flex flex-wrap items-center justify-between gap-3">
                            <div className="space-y-0.5">
                              <div className="text-[10px] font-extrabold uppercase text-indigo-700">
                                Rekapitulasi Nilai Per Mata Pelajaran & Kelas #{gIdx + 1}
                              </div>
                              <div className="text-sm font-black text-slate-900">
                                Mata Pelajaran: {grp.mata_pelajaran} — Kelas: {grp.kelas} (Jenjang Kelas {grp.tingkat} • Jurusan {grp.jurusan})
                              </div>
                              <div className="text-[11px] text-slate-600">
                                Guru Pengampu: <strong>{grp.guru}</strong> • Sesi Ujian: <strong>{grp.nama_sesi}</strong>
                              </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-2 text-[11px]">
                              <div className="px-2.5 py-1 rounded bg-white border border-slate-300">
                                Peserta: <strong className="text-slate-900">{grp.count} Siswa</strong>
                              </div>
                              <div className="px-2.5 py-1 rounded bg-sky-50 border border-sky-300 text-sky-900">
                                Rata-rata Kelas: <strong>{grp.avg}</strong>
                              </div>
                              <div className="px-2.5 py-1 rounded bg-emerald-50 border border-emerald-300 text-emerald-900">
                                Tertinggi: <strong>{grp.maxVal}</strong>
                              </div>
                              <div className="px-2.5 py-1 rounded bg-amber-50 border border-amber-300 text-amber-900">
                                Terendah: <strong>{grp.minVal}</strong>
                              </div>
                            </div>
                          </div>

                          {/* Tabel Nilai Siswa untuk Mapel & Kelas Ini */}
                          <table className="w-full border-collapse border border-slate-400 text-[11px]">
                            <thead>
                              <tr className="bg-slate-800 text-white uppercase text-[10px]">
                                <th className="border border-slate-400 p-2 text-center w-9">No</th>
                                <th className="border border-slate-400 p-2 text-left">Nama Peserta</th>
                                <th className="border border-slate-400 p-2 text-center">NISN</th>
                                <th className="border border-slate-400 p-2 text-center">Jurusan</th>
                                <th className="border border-slate-400 p-2 text-center">Kelas</th>
                                <th className="border border-slate-400 p-2 text-center">Jml Soal Terjawab</th>
                                <th className="border border-slate-400 p-2 text-center">Benar PG</th>
                                <th className="border border-slate-400 p-2 text-center">Salah PG</th>
                                <th className="border border-slate-400 p-2 text-center">Total Skor PG</th>
                                <th className="border border-slate-400 p-2 text-center">Total Skor Uraian</th>
                                <th className="border border-slate-400 p-2 text-center">Nilai Akhir</th>
                              </tr>
                            </thead>
                            <tbody>
                              {grp.items.map(({ pu, metrics: m }, sIdx) => (
                                <tr key={pu.id_peserta_ujian} className={sIdx % 2 === 0 ? 'bg-white' : 'bg-slate-50'}>
                                  <td className="border border-slate-300 p-1.5 text-center font-mono">{sIdx + 1}</td>
                                  <td className="border border-slate-300 p-1.5 font-bold text-slate-900">{m.user?.nama_lengkap || '-'}</td>
                                  <td className="border border-slate-300 p-1.5 text-center font-mono text-slate-700">{m.user?.username_nisn || '-'}</td>
                                  <td className="border border-slate-300 p-1.5 text-center font-semibold">{m.jurusan}</td>
                                  <td className="border border-slate-300 p-1.5 text-center font-semibold">{m.kelas}</td>
                                  <td className="border border-slate-300 p-1.5 text-center font-mono">{m.jmlTerjawab} / {m.totalSoalSesi}</td>
                                  <td className="border border-slate-300 p-1.5 text-center font-mono font-bold text-emerald-700">{m.jmlBenarPG}</td>
                                  <td className="border border-slate-300 p-1.5 text-center font-mono font-bold text-rose-700">{m.jmlSalahPG}</td>
                                  <td className="border border-slate-300 p-1.5 text-center font-mono font-bold text-sky-800">{m.skorPG}</td>
                                  <td className="border border-slate-300 p-1.5 text-center font-mono font-bold text-amber-800">{m.skorUraian}</td>
                                  <td className="border border-slate-300 p-1.5 text-center font-mono font-black text-slate-950 bg-emerald-50">{m.nilaiTotal}</td>
                                </tr>
                              ))}
                            </tbody>
                            <tfoot>
                              <tr className="bg-slate-200 font-bold text-slate-900 text-[11px]">
                                <td colSpan={10} className="border border-slate-400 p-1.5 text-right uppercase">
                                  Rata-Rata Nilai Kelas {grp.kelas} ({grp.mata_pelajaran})
                                </td>
                                <td className="border border-slate-400 p-1.5 text-center font-mono font-black text-indigo-900">
                                  {grp.avg}
                                </td>
                              </tr>
                            </tfoot>
                          </table>
                        </div>
                      ))
                    )}

                    {/* Blok Tanda Tangan Pengesahan */}
                    <div className="pt-6 grid grid-cols-2 gap-8 text-[11px] text-slate-800">
                      <div className="text-center space-y-12">
                        <div>Mengetahui,<br /><strong>Koordinator Proktor & Server CBT</strong></div>
                        <div className="font-bold underline">Administrator Server SKARIDA</div>
                      </div>
                      <div className="text-center space-y-12">
                        <div>Banyuwangi, {new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' })}<br /><strong>Guru Mata Pelajaran</strong></div>
                        <div className="font-bold underline">
                          {groupedRekapNilai.length === 1 ? groupedRekapNilai[0].guru : 'Tim Guru Mata Pelajaran'}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </SimpleModal>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminDashboardApp />);
  </script>
</body>
</html>
