    const LOGO_DATA_URI = `data:image/svg+xml;utf8,${encodeURIComponent(LOGO_SVG_RAW)}`;

    const isPreviewSandboxEnv = () => {
      if (typeof window === 'undefined') return true;
      const { protocol, hostname, pathname } = window.location;
      if (protocol === 'blob:' || protocol === 'about:' || protocol === 'data:') return true;
      if (!hostname || hostname.includes('usercontent.goog') || hostname.includes('webcontainer') || hostname.includes('codesandbox') || hostname.includes('stackblitz')) return true;
      if (pathname && pathname.includes('srcdoc')) return true;
      return false;
    };

    let cachedLogoResolvedSrc = isPreviewSandboxEnv() ? LOGO_DATA_URI : 'logo_skarida.png';

    function SkaridaLogo({ className = 'w-12 h-12' }) {
      const [logoSrc, setLogoSrc] = useState(cachedLogoResolvedSrc);
      return (
        <img
          src={logoSrc}
          onError={() => {
            cachedLogoResolvedSrc = LOGO_DATA_URI;
            setLogoSrc(LOGO_DATA_URI);
          }}
          alt="Logo SMK Negeri 2 Tegalsari"
          className={`${className} aspect-square object-contain shrink-0 drop-shadow-md select-none`}
        />
      );
    }

    function IndexLoginPortal() {
      const [loginRoleTab, setLoginRoleTab] = useState('siswa');
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [showPass, setShowPass] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [authenticatedSession, setAuthenticatedSession] = useState(null);
      const [serverTime, setServerTime] = useState('07:30:00 WIB');

      // State Koneksi Google Sheets API (Otomatis menggunakan DEFAULT_SCRIPT_URL)
      const [scriptUrl, setScriptUrl] = useState(() => {
        const saved = safeGetStorage('skarida_script_url', '');
        if (saved && saved.trim() !== '') return saved.trim();
        safeSetStorage('skarida_script_url', DEFAULT_SCRIPT_URL);
        return DEFAULT_SCRIPT_URL;
      });
      const [showApiModal, setShowApiModal] = useState(false);
      const [tempUrl, setTempUrl] = useState(scriptUrl);

      useEffect(() => {
        let link = document.querySelector("link[rel~='icon']");
        if (!link) {
          link = document.createElement('link');
          link.rel = 'icon';
          document.head.appendChild(link);
        }
        link.href = cachedLogoResolvedSrc;
      }, []);

      useEffect(() => {
        const timer = setInterval(() => {
          const now = new Date();
          const pad = n => String(n).padStart(2, '0');
          setServerTime(`${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())} WIB`);
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const switchRoleTab = (tab) => {
        setLoginRoleTab(tab);
        setErrorMsg('');
        setAuthenticatedSession(null);
        setUsername('');
        setPassword('');
      };

      const normalizeId = (val) => String(val ?? '').trim().replace(/^0+/, '');

      const completeLoginAndRedirect = (sessionPayload) => {
        safeSetStorage('skarida_cbt_session', JSON.stringify(sessionPayload));
        setAuthenticatedSession(sessionPayload);
        setIsSubmitting(false);
        setTimeout(() => {
          try {
            window.location.href = sessionPayload.targetFile;
          } catch (_) {}
        }, 400);
      };

      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        setIsSubmitting(true);

        const inputUser = username.trim();
        const inputPass = password.trim();

        // 1. Verifikasi ke Google Sheets (POST login & Fallback GET initAll bila NISN terpotong angka 0 di Sheets)
        if (scriptUrl) {
          try {
            const res = await fetch(scriptUrl, {
              method: 'POST',
              redirect: 'follow',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({
                action: 'login',
                roleType: loginRoleTab,
                username: inputUser,
                password: inputPass,
                forceLogin: true
              })
            });
            const result = await res.json();
            if (result && result.status === 'success' && result.user) {
              const sessionPayload = {
                id_user: result.user.id_user || result.user.id_staff,
                username: result.user.username_nisn || result.user.username_nip,
                nama: result.user.nama_lengkap,
                role: result.role || loginRoleTab,
                kelas: result.user.kelas || '-',
                jurusan: result.user.jurusan || '-',
                agama: result.user.agama || '-',
                jabatan: result.user.mapel_jabatan || 'Staff CBT',
                targetFile: loginRoleTab === 'siswa' ? 'siswa.html' : 'admin.html',
                loginTimestamp: serverTime
              };
              completeLoginAndRedirect(sessionPayload);
              return;
            }
          } catch (_) {
            // Lanjutkan ke pengecekan via GET initAll atau cadangan lokal jika POST terhalang CORS
          }

          try {
            const resGet = await fetch(`${scriptUrl}${scriptUrl.includes('?') ? '&' : '?'}action=initAll&_ts=${Date.now()}`, { redirect: 'follow' });
            const jsonGet = await resGet.json();
            if (jsonGet && jsonGet.status === 'success' && jsonGet.data) {
              const normalizeRow = (raw) => {
                const out = {};
                if (!raw || typeof raw !== 'object') return out;
                Object.keys(raw).forEach(k => {
                  out[k] = raw[k];
                  out[String(k).trim().toLowerCase().replace(/\s+/g, '_')] = raw[k];
                });
                return out;
              };
              if (loginRoleTab === 'siswa') {
                const listSiswa = (jsonGet.data.users_peserta || []).map(normalizeRow);
                const foundSiswa = listSiswa.find(u => {
                  const dbNisn = String(u.username_nisn || u.nisn || u.username || '').trim().replace(/^'/, '');
                  const dbPass = String(u.password_plain || u.password || u.password_opsional || '').trim();
                  return (dbNisn === inputUser || normalizeId(dbNisn) === normalizeId(inputUser)) && dbPass === inputPass;
                });
                if (foundSiswa) {
                  completeLoginAndRedirect({
                    id_user: foundSiswa.id_user || foundSiswa.id,
                    username: String(foundSiswa.username_nisn || foundSiswa.nisn || '').replace(/^'/, ''),
                    nama: foundSiswa.nama_lengkap || foundSiswa.nama,
                    role: 'siswa',
                    kelas: foundSiswa.kelas || '-',
                    jurusan: foundSiswa.jurusan || foundSiswa.kode_jurusan || '-',
                    agama: foundSiswa.agama || '-',
                    targetFile: 'siswa.html',
                    loginTimestamp: serverTime
                  });
                  return;
                }
              } else {
                const listStaff = (jsonGet.data.users_staff || []).map(normalizeRow);
                const foundStaff = listStaff.find(st => {
                  const dbNip = String(st.username_nip || st.username || st.nip || '').trim().replace(/^'/, '');
                  const dbPass = String(st.password_plain || st.password || '').trim();
                  return (dbNip.toLowerCase() === inputUser.toLowerCase() || normalizeId(dbNip) === normalizeId(inputUser)) && dbPass === inputPass;
                });
                if (foundStaff) {
                  completeLoginAndRedirect({
                    id_user: foundStaff.id_staff || foundStaff.id,
                    username: String(foundStaff.username_nip || foundStaff.username || '').replace(/^'/, ''),
                    nama: foundStaff.nama_lengkap || foundStaff.nama,
                    role: foundStaff.role || 'admin',
                    jabatan: foundStaff.mapel_jabatan || foundStaff.jabatan || 'Admin / Guru',
                    targetFile: 'admin.html',
                    loginTimestamp: serverTime
                  });
                  return;
                }
              }
            }
          } catch (_) {
            // Lanjutkan ke pengecekan cache database lokal
          }
        }

        // 2. Fallback ke Cache Database Real yang tersimpan di Browser (Tanpa Data Dummy)
        try {
          if (loginRoleTab === 'siswa') {
            const cachedUsers = JSON.parse(safeGetStorage('skarida_db_users', '[]'));
            const foundSiswa = cachedUsers.find(u =>
              (String(u.username_nisn).trim() === inputUser || normalizeId(u.username_nisn) === normalizeId(inputUser)) &&
              String(u.password_plain).trim() === inputPass
            );
            if (foundSiswa) {
              completeLoginAndRedirect({
                id_user: foundSiswa.id_user,
                username: foundSiswa.username_nisn,
                nama: foundSiswa.nama_lengkap,
                role: 'siswa',
                kelas: foundSiswa.kelas || '-',
                jurusan: foundSiswa.jurusan || '-',
                agama: foundSiswa.agama || '-',
                targetFile: 'siswa.html',
                loginTimestamp: serverTime
              });
              return;
            }
          } else {
            const cachedStaff = JSON.parse(safeGetStorage('skarida_db_staff', '[]'));
            const foundStaff = cachedStaff.find(st =>
              String(st.username_nip).trim().toLowerCase() === inputUser.toLowerCase() &&
              String(st.password_plain).trim() === inputPass
            );
            if (foundStaff) {
              completeLoginAndRedirect({
                id_user: foundStaff.id_staff,
                username: foundStaff.username_nip,
                nama: foundStaff.nama_lengkap,
                role: foundStaff.role || 'admin',
                jabatan: foundStaff.mapel_jabatan || 'Admin / Guru',
                targetFile: 'admin.html',
                loginTimestamp: serverTime
              });
              return;
            }
          }
        } catch (_) {}

        setErrorMsg(
          loginRoleTab === 'siswa'
            ? 'NISN atau Password tidak ditemukan pada database Google Sheets (`users_peserta`)!'
            : 'Username/NIP atau Password tidak ditemukan pada database Google Sheets (`users_staff`)!'
        );
        setIsSubmitting(false);
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between relative overflow-hidden">
          <div className="pointer-events-none absolute -top-40 -left-40 w-96 h-96 rounded-full bg-sky-600/15 blur-3xl" />
          <div className="pointer-events-none absolute -bottom-40 -right-40 w-96 h-96 rounded-full bg-indigo-600/15 blur-3xl" />

          {/* TOP NAVBAR INDEX */}
          <header className="relative z-10 border-b border-slate-800/80 bg-slate-900/70 backdrop-blur-md px-4 sm:px-8 py-3.5">
            <div className="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <SkaridaLogo className="w-11 h-11" />
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-black text-base sm:text-lg tracking-tight text-white">SKARIDA CBT</span>
                    <span className="px-2 py-0.5 text-[10px] font-extrabold uppercase rounded-md bg-sky-500/20 text-sky-300 border border-sky-500/30">
                      Portal Index
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400 font-semibold">
                    SMK Negeri 2 Tegalsari — Banyuwangi
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2.5 text-xs">
                <button
                  onClick={() => { setTempUrl(scriptUrl); setShowApiModal(true); }}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-sky-300 font-bold transition"
                >
                  <Database className="w-3.5 h-3.5" />
                  <span>{scriptUrl ? 'Google Sheets Terhubung' : 'Set URL Google Sheets'}</span>
                </button>
                <div className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-500/10 border border-emerald-500/25 text-emerald-400 font-bold">
                  <Wifi className="w-3.5 h-3.5" /> Server Online
                </div>
                <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 font-mono text-amber-400 font-bold">
                  <Clock className="w-3.5 h-3.5 text-amber-400" /> {serverTime}
                </div>
              </div>
            </div>
          </header>

          {/* MAIN CONTENT */}
          <main className="relative z-10 flex-1 flex items-center justify-center p-4 sm:p-8">
            <div className="max-w-5xl w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
              {/* Kolom Kiri: Branding & Informasi Sistem */}
              <div className="lg:col-span-6 space-y-6 text-center lg:text-left">
                <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-indigo-500/15 border border-indigo-500/30 text-indigo-300 text-xs font-bold">
                  <ShieldCheck className="w-4 h-4 text-sky-400" /> Portal Autentikasi Terpadu (index.html)
                </div>

                <div className="space-y-2">
                  <h1 className="text-2xl sm:text-4xl font-black text-white tracking-tight leading-tight">
                    Sistem Ujian Berbasis Komputer & Smartphone{' '}
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-400">
                      SMKN 2 Tegalsari
                    </span>
                  </h1>
                  <p className="text-xs sm:text-sm text-slate-400 leading-relaxed max-w-xl mx-auto lg:mx-0">
                    Selamat datang di halaman indeks utama <strong>Skarida CBT</strong>. Pilih jalur autentikasi sebagai{' '}
                    <strong className="text-sky-300">Peserta Ujian (Siswa)</strong> atau{' '}
                    <strong className="text-indigo-300">Panel Manajemen (Admin / Guru)</strong>.
                  </p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-left">
                  <div className="p-3.5 rounded-2xl bg-slate-900/90 border border-slate-800 flex items-start gap-3">
                    <div className="p-2 rounded-xl bg-sky-500/15 text-sky-400 shrink-0">
                      <Smartphone className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="text-xs font-extrabold text-white">Mobile Anti-Cheat & 3-Strike</h3>
                      <p className="text-[11px] text-slate-400 mt-0.5 leading-snug">
                        Sensor layar belah (split-screen), blokir pindah tab, watermark NISN, dan auto force submit pada pelanggaran ke-4.
                      </p>
                    </div>
                  </div>

                  <div className="p-3.5 rounded-2xl bg-slate-900/90 border border-slate-800 flex items-start gap-3">
                    <div className="p-2 rounded-xl bg-indigo-500/15 text-indigo-400 shrink-0">
                      <Lock className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="text-xs font-extrabold text-white">Single-Device & Gatekeeper</h3>
                      <p className="text-[11px] text-slate-400 mt-0.5 leading-snug">
                        Mencegah login ganda di perangkat berbeda serta mengunci akses ujian sebelum jadwal mulai resmi dibuka.
                      </p>
                    </div>
                  </div>
                </div>
              </div>

              {/* Kolom Kanan: Card Form Login */}
              <div className="lg:col-span-6">
                <div className="bg-slate-900/95 border border-slate-800 rounded-3xl p-5 sm:p-7 shadow-2xl space-y-5 max-w-md mx-auto">
                  <div className="grid grid-cols-2 gap-1.5 p-1.5 bg-slate-950 rounded-2xl border border-slate-800">
                    <button
                      type="button"
                      onClick={() => switchRoleTab('siswa')}
                      className={`py-2.5 px-3 rounded-xl font-extrabold text-xs flex items-center justify-center gap-2 transition-all ${
                        loginRoleTab === 'siswa'
                          ? 'bg-gradient-to-r from-sky-600 to-indigo-600 text-white shadow-lg shadow-sky-600/20'
                          : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      <GraduationCap className="w-4 h-4" /> Login Siswa
                    </button>
                    <button
                      type="button"
                      onClick={() => switchRoleTab('staff')}
                      className={`py-2.5 px-3 rounded-xl font-extrabold text-xs flex items-center justify-center gap-2 transition-all ${
                        loginRoleTab === 'staff'
                          ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-600/20'
                          : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      <MonitorCheck className="w-4 h-4" /> Login Admin / Guru
                    </button>
                  </div>

                  {!authenticatedSession ? (
                    <>
                      <div className="flex items-center gap-3 pb-2 border-b border-slate-800">
                        <SkaridaLogo className="w-12 h-12" />
                        <div>
                          <h2 className="text-base font-black text-white">
                            {loginRoleTab === 'siswa' ? 'Masuk Portal Peserta Ujian' : 'Masuk Command Center Admin/Guru'}
                          </h2>
                          <p className="text-xs text-slate-400">
                            {loginRoleTab === 'siswa'
                              ? 'Gunakan NISN & Password yang tertera pada Kartu Login'
                              : 'Gunakan Username / NIP untuk mengelola Bank Soal & Sesi'}
                          </p>
                        </div>
                      </div>

                      <form onSubmit={handleLoginSubmit} className="space-y-4">
                        <div>
                          <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-300 mb-1.5">
                            {loginRoleTab === 'siswa' ? 'Username (NISN Peserta)' : 'Username / NIP Admin & Guru'}
                          </label>
                          <div className="relative">
                            <UserCheck className="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2" />
                            <input
                              type="text"
                              value={username}
                              onChange={e => setUsername(e.target.value)}
                              placeholder={loginRoleTab === 'siswa' ? 'Masukkan NISN Anda...' : 'Masukkan Username atau NIP...'}
                              className="w-full bg-slate-950 border border-slate-700 focus:border-sky-500 rounded-2xl pl-10 pr-4 py-3 text-sm font-mono font-bold text-white outline-none"
                              required
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-300 mb-1.5">
                            {loginRoleTab === 'siswa' ? 'Password Kartu Ujian' : 'Password Akun'}
                          </label>
                          <div className="relative">
                            <KeyRound className="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2" />
                            <input
                              type={showPass ? 'text' : 'password'}
                              value={password}
                              onChange={e => setPassword(e.target.value)}
                              placeholder="Masukkan Password..."
                              className="w-full bg-slate-950 border border-slate-700 focus:border-sky-500 rounded-2xl pl-10 pr-10 py-3 text-sm font-mono font-bold text-amber-300 outline-none"
                              required
                            />
                            <button
                              type="button"
                              onClick={() => setShowPass(!showPass)}
                              className="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white"
                            >
                              {showPass ? <EyeOff className="w-4 h-4" /> : <Eye className="w-4 h-4" />}
                            </button>
                          </div>
                        </div>

                        {errorMsg && (
                          <div className="p-3.5 rounded-2xl bg-red-950/90 border border-red-500/50 text-xs text-red-200 flex items-start gap-2.5">
                            <AlertTriangle className="w-4 h-4 text-red-400 shrink-0 mt-0.5" />
                            <span className="leading-relaxed">{errorMsg}</span>
                          </div>
                        )}

                        <button
                          type="submit"
                          disabled={isSubmitting}
                          className={`w-full py-3.5 rounded-2xl text-white font-extrabold text-sm shadow-lg flex items-center justify-center gap-2 transition active:scale-[0.99] ${
                            loginRoleTab === 'siswa'
                              ? 'bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 shadow-sky-600/25'
                              : 'bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 shadow-indigo-600/25'
                          }`}
                        >
                          {isSubmitting
                            ? 'Memverifikasi & Mengalihkan Halaman...'
                            : loginRoleTab === 'siswa'
                            ? 'Masuk ke Dashboard Ujian Siswa'
                            : 'Masuk ke Dashboard Admin / Guru'}
                          <ArrowRight className="w-4 h-4" />
                        </button>
                      </form>
                    </>
                  ) : (
                    <div className="py-4 text-center space-y-4">
                      <div className="w-16 h-16 rounded-full bg-emerald-500/20 border-2 border-emerald-500 flex items-center justify-center mx-auto">
                        <CheckCircle2 className="w-9 h-9 text-emerald-400" />
                      </div>
                      <div>
                        <span className="px-3 py-1 rounded-full bg-emerald-500/15 text-emerald-300 text-[10px] font-black uppercase tracking-wider">
                          Autentikasi Berhasil • Role: {authenticatedSession.role.toUpperCase()}
                        </span>
                        <h3 className="text-lg font-black text-white mt-2">{authenticatedSession.nama}</h3>
                        <p className="text-xs text-slate-400">
                          {authenticatedSession.role === 'siswa'
                            ? `Kelas ${authenticatedSession.kelas} • Jurusan ${authenticatedSession.jurusan} • Agama ${authenticatedSession.agama}`
                            : authenticatedSession.jabatan}
                        </p>
                      </div>

                      <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 text-left space-y-2 text-xs">
                        <div className="flex justify-between">
                          <span className="text-slate-400">Username / ID</span>
                          <span className="font-mono font-bold text-white">{authenticatedSession.username}</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-400">Waktu Login Server</span>
                          <span className="font-mono font-bold text-emerald-400">{authenticatedSession.loginTimestamp}</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-400">Redirect File GitHub</span>
                          <span className="font-mono font-bold text-sky-400">{authenticatedSession.targetFile}</span>
                        </div>
                      </div>

                      <div className="space-y-2">
                        <a
                          href={authenticatedSession.targetFile}
                          className="w-full py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs flex items-center justify-center gap-2 shadow-lg"
                        >
                          <ExternalLink className="w-4 h-4" /> Buka Halaman {authenticatedSession.targetFile} (Di GitHub Hosting)
                        </a>
                        <button
                          type="button"
                          onClick={() => setAuthenticatedSession(null)}
                          className="w-full py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white font-extrabold text-xs flex items-center justify-center gap-2"
                        >
                          <LogOut className="w-4 h-4" /> Kembali & Uji Akun Lainnya
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </main>

          {/* MODAL KONFIGURASI URL GOOGLE APPS SCRIPT */}
          {showApiModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-extrabold text-white text-sm flex items-center gap-2">
                    <Database className="w-4 h-4 text-sky-400" /> Konfigurasi URL Google Apps Script
                  </h3>
                  <button onClick={() => setShowApiModal(false)} className="text-slate-400 hover:text-white">
                    <X className="w-5 h-5" />
                  </button>
                </div>
                <div className="space-y-2 text-xs">
                  <label className="block font-bold text-slate-300">URL Web App Google Sheets (.../exec)</label>
                  <input
                    type="url"
                    value={tempUrl}
                    onChange={e => setTempUrl(e.target.value)}
                    placeholder="https://script.google.com/macros/s/AKfycb.../exec"
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white font-mono text-xs outline-none focus:border-sky-500"
                  />
                  <p className="text-[11px] text-slate-400 leading-relaxed">
                    Tempelkan URL hasil <strong>Deploy &gt; New deployment &gt; Web app</strong> dari Google Sheets Anda. URL ini akan disimpan di browser dan dipakai bersama oleh <code>index.html</code>, <code>admin.html</code>, dan <code>siswa.html</code>.
                  </p>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setShowApiModal(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">
                    Batal
                  </button>
                  <button
                    onClick={() => {
                      safeSetStorage('skarida_script_url', tempUrl.trim());
                      setScriptUrl(tempUrl.trim());
                      setShowApiModal(false);
                    }}
                    className="px-5 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-xs font-extrabold"
                  >
                    Simpan Koneksi Database
                  </button>
                </div>
              </div>
            </div>
          )}

          <footer className="relative z-10 border-t border-slate-900 bg-slate-950/80 px-6 py-3 text-center text-[11px] text-slate-500">
            © 2026 SKARIDA CBT — SMK Negeri 2 Tegalsari Banyuwangi • Smart Proctoring & Multi-Tier Exam Engine
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<IndexLoginPortal />);
  </script>
</body>
</html>
